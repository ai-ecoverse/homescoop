# Homebrew-shaped recipe — WASIX sysroot data (wasixcc SYSROOT_PREFIX layout).
name: wasix-sysroot
builder: host
version: "2025.9.30"
npm: "@ai-ecoverse/wasix-sysroot"
summary: "WASIX libc/libcxx/compiler-rt sysroots for wasm32-wasi"
# CI base: the published -14 (build-incremental.sh adds slicc_stat_owner).
source:
  url: "https://registry.npmjs.org/@ai-ecoverse/wasix-sysroot/-/wasix-sysroot-2025.9.30-14.tgz"
  sha256: "1a88c9f1b12b0bffaf6502914abc4f1b40443ddccbfa84d8bbc44fc86a0e652e"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://github.com/ai-ecoverse/homescoop/tree/main/packages/wasix-sysroot
  license: Apache-2.0 WITH LLVM-exception
  notes: |
    Package root is the SYSROOT_PREFIX (five variants). No commands —
    consumed by wasm-clang drivers / wasixcc. CI builds 2025.9.30-16 with
    build-incremental.sh: the published -14 tarball byte for byte plus
    slicc_stat_owner.o in every libc.a (replacing fstat.o/fstatat.o) and
    patched posix.o/at_fdcwd.o (file modes via the kernel's slicc_fs
    imports, homescoop#169), using the pinned install-wasixcc toolchain. The full rebuild (stage a local
    ~/.wasixcc, rebuild the libc++ runtimes) is build.sh with
    HOMESCOOP_WASIX_SYSROOT_FULL=1.
