# OpenSSH portable client for slicc WASIX (wasixcc). Client-first: ssh,
# ssh-keygen; scp/sftp/agent later if cheap. No sshd in the package.
name: wasix-openssh
builder: host
# Portable tarball is openssh-10.6p1; npm base is 10.6.0 (see docs/versioning.md).
# Renovate: manual — OpenBSD portable tags are V_X_Y_PZ, not semver.
version: "10.6.0"
npm: "@ai-ecoverse/wasix-openssh"
summary: "OpenSSH 10.6p1 client for slicc WASIX (ssh, ssh-keygen, scp, sftp, ssh-add)"
source:
  url: "https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-10.6p1.tar.gz"
  sha256: "a9dc9565dffe8640f64d863cd29a32bc4a3dbdec0566a7fc44c5d6ee767d5f39"
sources:
  # Build-time WASIX dev packages (static lib/ flavour), pkg-config only.
  wasix_zlib:
    url: "https://registry.npmjs.org/@ai-ecoverse/wasix-zlib/-/wasix-zlib-1.3.1-3.tgz"
    sha256: "f55d56c0837722e5d1e309f4344f723c95c7f68cd3ddb3089d6b4c025aaf14c7"
  wasix_openssl:
    url: "https://registry.npmjs.org/@ai-ecoverse/wasix-openssl/-/wasix-openssl-3.5.9-4.tgz"
    sha256: "47629bd4e1f53ee1aa32e3ef150cd744c4eb242632f8bad2818c631aa6c645b7"
wasm:
  initial-memory: 32MiB
  measured-peak: 14MiB
  measured-by: "VmSize of each ssh, ssh-keygen, scp and sftp process polled from /proc/<pid>/status (one thread each, Threads: 1, so that is the allocating thread's own view) in cert/heap.mjs, on 10.6.0-13's build on wasix-sysroot 2025.9.30-40 at the unsized 8.75 MiB linked initial memory (8 MiB of it the stack), slicc-kernel 1.93.0 on Node: ssh -C of 50 MiB from the host sshd 13.9 MiB, plain 50 MiB down 10 MiB, scp 50 MiB up and down 10.6 MiB, sftp get 10.3 MiB, 50 MiB up 9.4 MiB, an mlkem768x25519 login 9.4 MiB, ssh-keygen -t rsa -b 4096 9 MiB. A measurement link with scripts/wasm-refresh-malloc.c (HOMESCOOP_WASM_PEAK) agrees: malloc's highest block end in the ssh -C run is 12.2 MiB, memory 12.3 MiB"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://www.openssh.com/
  license: SSH-OpenSSH
  notes: |
    Built with wasixcc on wasix-sysroot 2025.9.30-40 (select/pselect
    sub-second timeouts + socketpair flags from -18; slicc_fs from -17). Links
    wasix-openssl 3.5.9-4 and wasix-zlib 1.3.1-3 via pkg-config only, with
    -Wl,--fatal-warnings. OpenSSH 10.6's client loop uses poll/ppoll.

    Identity: getpwuid comes from wasix-sysroot slicc_identity; tilde paths
    honour $HOME first (misc.c). Until H1 (sysroot -19 + kernel K1), document
    $HOME/$USER and prefer user@host / -l when unsure.

    PTY: enter_raw_mode clears ISIG/IEXTEN/OPOST via tcsetattr; WASIX
    tty_set cannot clear those yet (slicc-kernel#247). Cert checks that local
    ^C hits local ssh; escape ~. is the documented way out. No ssh patch.

    ssh-add is shipped; ssh-agent is not. Without an agent, ssh-add -l exits 2.

    scp/sftp: posix_spawnp with per-call argv copy (patch 0002); socketpair
    needs slicc-kernel ≥ 1.41.0 (engines); host-node cert pin 1.41.3.
    set_sock_tos quiet on ENOSYS (0003); ssh-keygen -R backup via copy (0004).
    ProxyCommand / ProxyJump / SSH_ASKPASS still fork — unsupported (README).

    Cert: host-node (Node kernel + host sshd over uplink; tiny host none-auth
    server; bare git repo for GIT_SSH_COMMAND). Coordinator certifies and
    publishes; workers do not.
