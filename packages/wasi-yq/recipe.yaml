  notes: |
    yq v4.54.2 (tag v4.54.2, commit a433067, Go, MIT). build.sh fetches
    the pinned source and Go 1.27.3, checks that the tag v<version> still
    names the pinned commit (so a version-only bump fails closed), vendors
    the modules (go.sum checked) and builds yq with GOOS=wasip1
    GOARCH=wasm CGO_ENABLED=0 -trimpath -buildvcs=false -mod=vendor and
    upstream's release ldflags (-s -w), so the build is reproducible. No
    patches: every linked module builds for wasip1 as it is (go-isatty has
    wasip1 code and reports no terminal, so output is never coloured
    unless -C is given, as native yq into a pipe).
    build.sh also builds the same tree natively and checks its output on
    the cases of test/goldens.mjs against test/fixtures/expected.json,
    which the cert compares the wasm's output with.
