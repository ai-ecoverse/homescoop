name: py-matplotlib
builder: host
version: "3.11.2"
npm: "@ai-ecoverse/py-matplotlib"
summary: "matplotlib Agg for slicc WASIX CPython 3.14"
# 3.11.2-3 is packaging-only: 3.11.2-2's bytes with exact @ai-ecoverse pins
# (wasix-python 3.14.2-11 and the re-released py-* deps, dateutil
# 2.9.0-post0.2). Drop repack: when the next release rebuilds.
repack:
  from: "3.11.2-2"
dependencies:
  build: [wasix-python, py-numpy, freetype]
  host: []
  run:
    - wasix-python
    - py-numpy
    - py-contourpy
    - py-cycler
    - py-fonttools
    - py-kiwisolver
    - py-packaging
    - py-pillow
    - py-pyparsing
    - py-python-dateutil
about:
  license: PSF-2.0
  notes: |
    Agg backend. FreeType statically linked (PIC wasixcc). No wasm-* runtime deps.
