name: py-matplotlib
builder: host
version: "3.11.2"
npm: "@ai-ecoverse/py-matplotlib"
summary: "matplotlib Agg for slicc WASIX CPython 3.14"
# 3.11.2-4 is packaging-only: 3.11.2-3's bytes with exact @ai-ecoverse pins
# (wasix-python 3.14.2-12, py-numpy 2.3.2-6, py-contourpy 1.4.0-3, py-cycler
# 0.12.1-3, py-fonttools 4.66.1-3, py-kiwisolver 1.5.1-3, py-packaging
# 26.3.0-3, py-pillow 12.3.0-4, py-pyparsing 3.3.3-3). Drop repack: when the
# next release rebuilds.
repack:
  from: "3.11.2-3"
dependencies:
  build: [wasix-python, py-numpy, freetype]
  host: []
  run:
    - wasix-python
    - py-numpy
    - py-contourpy
    - py-cycler
    - py-fonttools
    - py-kiwisolver
    - py-packaging
    - py-pillow
    - py-pyparsing
    - py-python-dateutil
about:
  license: PSF-2.0
  notes: |
    Agg backend. FreeType statically linked (PIC wasixcc). No wasm-* runtime deps.
