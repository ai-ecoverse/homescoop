# The AWS CLI v2 (aws) for slicc, on wasix-python (homescoop#2115).
# Pure Python: AWS's source distribution with its pure-Python dependencies
# from PyPI, staged as one tree with a Python launcher. Nothing compiles.
name: aws-cli
builder: host
# AWS CLI v2 tags are plain versions (2.40.4); v1 tags (1.x) are in the same
# repo, and renovate.json keeps this pin on 2.x.
# renovate: datasource=github-tags depName=aws/aws-cli
version: "2.41.2"
npm: "@ai-ecoverse/aws-cli"
summary: "The AWS Command Line Interface v2: aws, to manage AWS services from slicc."
source:
  # AWS's source distribution, what `pip install` of the GitHub tag builds
  # from. requirements/download-deps/system-sandbox-lock.txt in it pins every
  # dependency with its sha256; build.sh checks each wheel below against it.
  url: "https://awscli.amazonaws.com/awscli-{{version}}.tar.gz"
  sha256: "a6dda56f481fbda705295f4f5b6e17977c50deefcd7c0f73134415def17d2b6e"
# The pure-Python dependencies (the .whl sources), the versions the source
# distribution's lock file pins (awscrt and ruamel.yaml.clib are native; see
# about.notes). A version bump whose lock moves one of them fails the build
# until these follow it.
sources:
  colorama:
    url: "https://files.pythonhosted.org/packages/py2.py3/c/colorama/colorama-0.4.6-py2.py3-none-any.whl"
    sha256: "4f1d9991f5acc0ca119f9d443620b77f9d6b33703e51011c16baf57afb285fc6"
  distro:
    url: "https://files.pythonhosted.org/packages/py3/d/distro/distro-1.8.0-py3-none-any.whl"
