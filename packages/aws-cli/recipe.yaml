    url: "https://files.pythonhosted.org/packages/py3/u/urllib3/urllib3-2.6.3-py3-none-any.whl"
    sha256: "bf272323e553dfb2e87d9bfd225ca7b0f467b919d7bbd355436d3fd37cb0acd4"
