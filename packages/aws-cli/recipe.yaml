  # AWS's LICENSE.txt is a notice that names the Apache License 2.0; the
  # package's LICENSE is that notice followed by the license text.
  apache_license:
    url: "https://www.apache.org/licenses/LICENSE-2.0.txt"
    sha256: "cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30"
dependencies:
  build: []
  host: []
  run:
    - wasix-python
about:
  homepage: https://aws.amazon.com/cli/
  license: Apache-2.0
  notes: |
    AWS CLI v2, not v1: v1 is in maintenance mode and has no `aws sso login`.
    v2 isn't on PyPI; this is AWS's source distribution (awscli.amazonaws.com),
    whose awscli/ is the package AWS's own pep517 backend puts in the wheel,
    plus the autocomplete index (awscli/data/ac.index) that backend
    generates, generated here the same way with the build machine's python3.
    Its dependencies are the pure-Python wheels of the versions its lock file
    pins, unpacked beside it in lib/aws-cli with their dist-info (licenses,
    and the metadata prompt_toolkit reads its version from), without their
    .data scripts. Not included: awscrt (the AWS Common Runtime, a native
    extension with no WASIX build) and ruamel.yaml.clib (optional C speedups;
    ruamel.yaml falls back to pure Python).
    awscrt-optional.patch makes awscrt optional again, as it is in standalone
    botocore (botocore.compat.HAS_CRT): CRC32C and CRC64NVME checksums are
    pure Python (botocore/crc.py), the default request checksum is CRC32
    (zlib), and s3 uses the classic transfer client. The crypto the CLI did
    with awscrt.crypto (cloudfront sign, get-password-data
    --priv-launch-key, cloudtrail validate-logs and verify-query-results,
    ec2-instance-connect ssh's key, aws login) runs unchanged on
    src/awscrt, staged as lib/aws-cli/awscrt: awscrt 0.38.1's awscrt.crypto
    API on cryptography (@ai-ecoverse/py-cryptography, a dependency), and
    nothing else of awscrt, so HAS_CRT stays False. SigV4a is the patch's
    botocore/sigv4a.py, botocore's SigV4 signers with SigV4a's scope and
    ECDSA key on cryptography. The xxhash checksums, the CRT transfer
    client and EC2 Instance Connect's websocket tunnel need awscrt and say
    so. The launcher puts the site-packages of exactly the py-* packages
    package.json pins (py-cryptography, py-cffi) after the standard
    library (src/launcher.py).
    login-remote.patch makes `aws login` take its cross-device (--remote)
    flow by default, since the other one waits for a callback on 127.0.0.1.
    help-text.patch renders help as plain text when there is no groff or
    mandoc, as the CLI does on Windows.
