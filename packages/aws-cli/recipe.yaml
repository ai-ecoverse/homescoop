  docutils:
    url: "https://files.pythonhosted.org/packages/py3/d/docutils/docutils-0.19-py3-none-any.whl"
    sha256: "5e1de4d849fee02c63b040a4a3fd567f4ab104defd8a5511fbbc24a8a017efbc"
  jmespath:
    url: "https://files.pythonhosted.org/packages/py3/j/jmespath/jmespath-1.0.1-py3-none-any.whl"
    sha256: "02e2e4cc71b5bcab88332eebf907519190dd9e6e82107fa7f83b1003a6252980"
  prompt_toolkit:
    url: "https://files.pythonhosted.org/packages/py3/p/prompt_toolkit/prompt_toolkit-3.0.51-py3-none-any.whl"
    sha256: "52742911fde84e2d423e2f9a4cf1de7d7ac4e51958f648d9540e0fb8db077b07"
  python_dateutil:
    url: "https://files.pythonhosted.org/packages/py2.py3/p/python_dateutil/python_dateutil-2.9.0-py2.py3-none-any.whl"
    sha256: "cbf2f1da5e6083ac2fbfd4da39a25f34312230110440f424a14c7558bb85d82e"
  ruamel_yaml:
    url: "https://files.pythonhosted.org/packages/py3/r/ruamel_yaml/ruamel_yaml-0.19.1-py3-none-any.whl"
    sha256: "27592957fedf6e0b62f281e96effd28043345e0e66001f97683aa9a40c667c93"
  six:
    url: "https://files.pythonhosted.org/packages/py2.py3/s/six/six-1.17.0-py2.py3-none-any.whl"
    sha256: "4721f391ed90541fddacab5acf947aa0d3dc7d27b2e1e8eda2be8970586c3274"
