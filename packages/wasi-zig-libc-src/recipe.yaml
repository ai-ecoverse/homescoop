name: wasi-zig-libc-src
builder: host
reproducible: true
version: "0.16.0"
npm: "@ai-ecoverse/wasi-zig-libc-src"
summary: "wasi-libc's C sources from Zig 0.16.0, for @ai-ecoverse/wasi-zig's zig cc beyond the prebuilt baseline"
source:
  url: "https://ziglang.org/download/{{version}}/zig-{{version}}.tar.xz"
  sha256: "43186959edc87d5c7a1be7b7d2a25efffd22ce5807c7af99067f86f99641bfdf"
toolchain:
  zig_sha256_linux_x64: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
  zig_sha256_macos_arm64: "b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://github.com/ai-ecoverse/homescoop/tree/main/packages/wasi-zig-libc-src
  license: MIT AND Apache-2.0 WITH LLVM-exception
  notes: |
    build.sh fetches the same zig 0.16.0 source tarball as wasi-zig (by
    sha256) and copies lib/libc/wasi and lib/libc/musl into the package, as
    wasi-zig's build did when it staged this package (wasi-zig's patches
    don't touch those trees). wasi-zig's zig cc reads them from beside its
    own lib/ for a wasm32-wasi CPU or mode other than the prebuilt baseline
    (wasi-zig patch 0026). Release it at wasi-zig's version.
