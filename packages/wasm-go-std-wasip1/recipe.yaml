# Go std export archives for wasip1/wasm (pair with wasm-go tools).
# Split from tools: one target's std is ~124 MB raw / ~30 MB gzipped (>40 MiB cap).
name: wasm-go-std-wasip1
builder: host
# renovate: datasource=golang-version depName=go
version: "1.27.3"
npm: "@ai-ecoverse/wasm-go-std-wasip1"
summary: "Go 1.27 std .a archives for wasip1/wasm (slicc go driver)"
source:
  url: "https://go.dev/dl/go{{version}}.src.tar.gz"
  sha256: "6e7749035cf360f06b2575d162ea79df9fda8ef671889e5c375f8e50777f26bb"
sources:
  go_linux_amd64:
    url: "https://go.dev/dl/go{{version}}.linux-amd64.tar.gz"
    sha256: "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40"
  go_darwin_arm64:
    url: "https://go.dev/dl/go{{version}}.darwin-arm64.tar.gz"
    sha256: "dd3908cf20959d798c1e06ebe5b72213f0505ce01373b40ce3110975a6cd99c2"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://go.dev
  license: BSD-3-Clause
  notes: |
    Tools-free std package: slicc.go.version + slicc.go.std only (no toolchain).
    Stage goroot/pkg/wasip1_wasm/<import path>.a from
    CGO_ENABLED=0 GOOS=wasip1 GOARCH=wasm go list -export -trimpath
    -f '{{.ImportPath}} {{.Export}}' std (same Go version as wasm-go).
    unsafe has no archive. If gzipped pack still exceeds 40 MiB, split further
    (e.g. wasm-go-std-wasip1-core + …). Queue after wasix-python/numpy/pandas.
