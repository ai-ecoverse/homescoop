# SLICC wasm-realm TLS engine: Mbed TLS server sessions over memory buffers,
# used by SLICC's in-realm HTTP proxy to terminate CONNECT tunnels (#3571).
name: tls-engine
builder: host
# renovate: datasource=github-releases depName=Mbed-TLS/mbedtls extractVersion=^mbedtls-(?<version>.*)$
version: "3.6.7"
npm: "@ai-ecoverse/wasm-tls-engine"
summary: "Mbed TLS 3.6.5 server engine (ES module + wasm) for SLICC's realm proxy"
source:
  url: "https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-{{version}}/mbedtls-{{version}}.tar.bz2"
  sha256: "a7e8bcbec0e6f761b4af24f25677626b35f762f68eef79c08677a363212d11f6"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://github.com/ai-ecoverse/homescoop/tree/main/packages/tls-engine
  license: Apache-2.0
  notes: |
    Not a realm program: SLICC's kernel imports it (a lazy chunk plus the wasm
    asset). src/slicc_tls_engine.c is the engine; it holds no CA key (leaves
    are signed outside). No slicc libc shims are linked.
