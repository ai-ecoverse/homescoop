# The Azure CLI (az) for slicc, on wasix-python (homescoop#2112).
# Pure Python: azure-cli and its closure as upstream pins it, every file a
# py3-none-any wheel from PyPI checked against wheels.lock. Nothing compiles.
name: azure-cli
builder: host
# renovate: datasource=pypi depName=azure-cli
version: "2.93.0"
npm: "@ai-ecoverse/azure-cli"
summary: "The Azure CLI: az, to manage Azure resources from slicc."
source:
  # Upstream's pinned closure for this release, the file Microsoft's deb and
  # rpm builds install. wheels.lock (src/lock.py) is made from it and records
  # its sha256; build.sh refuses a lock made from other bytes, then fetches
  # every wheel in the lock and checks it against the lock's sha256.
  url: "https://raw.githubusercontent.com/Azure/azure-cli/azure-cli-{{version}}/src/azure-cli/requirements.py3.Linux.txt"
  sha256: "11d0f42401c801a7bf53b7fe62593af8871875292ed606715ff2afedba4212a9"
sources:
  trim:
    # Upstream's scripts/trim_sdk.py, which its deb, rpm and docker builds run
    # after the install: drops the mgmt SDKs' aio/ trees and the API versions
    # no profile uses.
    url: "https://raw.githubusercontent.com/Azure/azure-cli/azure-cli-{{version}}/scripts/trim_sdk.py"
    sha256: "2e6292f5285b4fcedbe8efd77309fade550667d1c502a6ffa078f1aa97942c64"
dependencies:
  build: []
  host: []
  run:
    - wasix-python
about:
  homepage: https://github.com/Azure/azure-cli
  license: MIT
  notes: |
    Source: PyPI, the closure upstream pins in requirements.py3.Linux.txt at
    the release tag, resolved by src/lock.py into wheels.lock (uv, Linux,
    CPython 3.15, nothing newer than the release). Left out: the native
    packages (cffi, cryptography, PyNaCl, bcrypt, psutil) and the pure ones
    that import them at module level (pyOpenSSL, paramiko, fabric, scp,
    sshtunnel); the lock's header gives each reason. PyYAML has no pure
    wheel on PyPI, so its pure-Python package is copied from the sdist.
    Staged under lib/azure-cli with no __pycache__ (version neutral), then
    trimmed with upstream's own scripts/trim_sdk.py. bin/az is a Python
    launcher (src/launcher.py) in place of upstream's shell one.
