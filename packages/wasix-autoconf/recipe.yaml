# GNU Autoconf for slicc (Perl + m4 scripts; no wasm binary).
name: wasix-autoconf
builder: host
# ladder-pr builds it twice and compares the package.tgz sha256.
reproducible: true
version: "2.72"
npm: "@ai-ecoverse/wasix-autoconf"
summary: "GNU Autoconf scripts for slicc (needs wasix-perl + wasix-m4)"
source:
  url: "https://mirrors.kernel.org/gnu/autoconf/autoconf-{{version}}.tar.xz"
  sha256: "ba885c1319578d6c94d46e9b0dceb4014caafe2490e437a0dbca3f270a223f5a"
dependencies:
  build: []
  host: []
  run:
    - wasix-perl
    - wasix-m4
about:
  homepage: https://www.gnu.org/software/autoconf/
  license: GPL-3.0-or-later
  notes: |
    Script package: autoconf/autoheader/autom4te/autoreconf/autoscan/autoupdate/ifnames.
    Shebang #!/usr/bin/perl; slicc resolves via wasix-perl. Needs wasix-m4 on PATH.
    2.72.0-7: a real rebuild again (-4..-6 were packaging-only repacks of -3);
    2.72.0-10 too, a CI build with provenance (-8/-9 were repacks of -7);
    2.72.0-11 bumps the pins to wasix-m4 1.4.20-7 and wasix-perl 5.42.0-21.
    autom4te's GNU m4 probe matches m4 --help in Perl, not through grep, so
    autoconf / aclocal run without grep (homescoop#470); the README says what
    a generated configure needs (grep, sed, awk).
