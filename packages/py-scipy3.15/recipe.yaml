# SciPy for slicc WASIX CPython 3.15 (side modules, dlopen; static OpenBLAS).
name: py-scipy3.15
builder: host
# renovate: datasource=pypi depName=scipy
version: "1.18.1"
npm: "@ai-ecoverse/py-scipy"
npm-tag: "python3.15"
summary: "SciPy 1.18.1 for slicc WASIX CPython 3.15 (cp315-wasix_wasm32)"
