# Git for slicc wasm realm (local + HTTP via libcurl).
name: git
builder: host
# renovate: datasource=github-releases depName=git/git extractVersion=^v(?<version>\d+\.\d+\.\d+)$
version: "2.55.0"
npm: "@ai-ecoverse/wasm-git"
summary: "Git 2.55 with git-remote-http(s) over homescoop libcurl"
source:
  url: "https://www.kernel.org/pub/software/scm/git/git-{{version}}.tar.xz"
  sha256: "457fdb04dc8728e007d4688695e6912e6f680727920f2a40bf11eacc17505357"
dependencies:
  build: []
  host:
    - "@ai-ecoverse/wasm-curl@8.22.0-1"
    - "@ai-ecoverse/wasm-zlib@1.3.1-2"
  run:
    - "@ai-ecoverse/wasm-bash@5.3.0-7"
about:
  homepage: https://github.com/ai-ecoverse/homescoop/tree/main/packages/git
  license: GPL-2.0-only
  notes: |
    NO_OPENSSL; HTTP(S) remotes via libcurl + Mbed TLS from wasm-curl.
    Links slicc net profile (socket+select+spawn+exec+gaps). Helpers under
    libexec/git-core; GIT_EXEC_PATH=libexec/git-core in the manifest env.
    /bin/sh resolves to installed GNU bash in the realm and slicc-kernel;
    local, file:// and ssh transports need it, so package.json lists
    @ai-ecoverse/wasm-bash in dependencies (ipk installs it with git).
