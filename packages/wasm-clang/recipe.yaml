name: wasm-clang
builder: host
reproducible: true
version: "24.0.0"
npm: "@ai-ecoverse/wasm-clang"
summary: "Clang/LLD 24 for slicc (wasm tool, WASIX drivers)"
source:
  url: "https://registry.npmjs.org/@ai-ecoverse/llvm-emscripten/-/llvm-emscripten-24.0.0-2.tgz"
  sha256: "8b0a0da5d7bea4ef6dc3e5b6c23b241d34819018cfbb7dd26719e8fad25d17e2"
sources:
  wasix_sysroot:
    version: "2025.9.30-38"
    url: "https://registry.npmjs.org/@ai-ecoverse/wasix-sysroot/-/wasix-sysroot-2025.9.30-38.tgz"
    sha256: "1fb57c95d84e7b33a5a535561a0d536c943c40fefd70991f9570db8e27994574"
inputs:
  - "packages/wasm-emscripten/patches/**"
  - "packages/wasm-emscripten/package-patches/**"
  - "scripts/slicc-node-main.js"
dependencies:
  build: []
  host: []
  run:
    - wasix-sysroot
    - wasm-binaryen
about:
  homepage: https://github.com/ai-ecoverse/homescoop/tree/main/packages/wasm-clang
  license: Apache-2.0 WITH LLVM-exception
  notes: |
    One multi-call module bin/llvm.wasm (clang, lld, llvm-ar, llvm-nm,
    llvm-objcopy, llvm-symbolizer; multicall.cpp picks the tool by argv[0]),
    linked in CI from @ai-ecoverse/llvm-emscripten 24.0.0-2 (llvm-project
    b158b0ae, compiled by the patched emscripten 6.0.9 tree; homescoop#859
    stage E) against today's shims/slicc, with the patched emscripten 6.0.9
    tree on emsdk 6.0.9's prebuilt compilers (scripts/emscripten-tree.sh)
    plus wasm-emscripten's package-patches (0014 libfs symloop, 0015).
    The resource dir is llvm-emscripten's lib/clang/24 plus the pinned
    wasix-sysroot's libclang_rt.builtins for wasip1/wasi. Drivers are
    #!/bin/sh wasixcc-compatible wrappers; the sysroot is wasix-sysroot, and
    wasm-opt for fork Asyncify comes from @ai-ecoverse/wasm-binaryen (PATH).
