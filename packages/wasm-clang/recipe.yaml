# Homebrew-shaped recipe — Clang/LLD as wasm tools (slicc-emscripten llvm-wasm).
name: wasm-clang
builder: host
version: "24.0.0"
npm: "@ai-ecoverse/wasm-clang"
summary: "Clang/LLD 24 for slicc (wasm tool, WASIX drivers)"
source:
  # Prebuilt by slicc-emscripten/build-wasm-llvm.sh; build.sh stages that artifact.
  url: "https://github.com/llvm/llvm-project"
  sha256: "skip"
# 24.0.0-15 is packaging-only too: -11's bytes with this driver (cc's
# Asyncify check reads the import section with od, no grep: homescoop#451)
# and glue-node-runner.patch (the glue's Node-host runner stays out of
# slicc-kernel's Node process worker: homescoop#276). build.sh applies both
# at the next real build. 24.0.0-16: the driver's Asyncify step also covers a
# link without -o (a.out) and -oFILE (homescoop#692).
# 24.0.0-17: calls that write no program (-v, -fsyntax-only, -###, a header)
# leave an a.out alone (homescoop#710, #711).
# 24.0.0-18: @response files, PCH outputs, -Xlinker -o and -B values
# (homescoop#721, #722).
# 24.0.0-19: same-bytes relinks and quoted / nested response files.
# 24.0.0-20: braces / ~ in response files, no marker left on a failed compile.
# 24.0.0-21: response files read with clang's own tokenizer rules (homescoop#769).
repack:
  from: "24.0.0-11"
  files:
    - bin/cc=drivers/wasix-driver.sh
    - bin/gcc=drivers/wasix-driver.sh
    - bin/c++=drivers/wasix-driver.sh
    - bin/g++=drivers/wasix-driver.sh
    - bin/wasixcc=drivers/wasix-driver.sh
    - bin/wasix++=drivers/wasix-driver.sh
  patches:
    - glue-node-runner.patch
  fields:
    - engines
    - slicc.env
dependencies:
  build: []
  host: []
  run:
    - wasix-sysroot
    - wasm-binaryen
about:
  homepage: https://github.com/ai-ecoverse/homescoop/tree/main/packages/wasm-clang
  license: Apache-2.0 WITH LLVM-exception
  notes: |
    Stage from slicc-emscripten/build/llvm-wasm (ENVIRONMENT=web,worker,node,
    slicc_spawn.o). Do not rebuild LLVM unless the link profile must change.
    Drivers are #!/bin/sh wasixcc-compatible wrappers; sysroot is wasix-sysroot.
    -10: one multi-call module bin/llvm.wasm (clang, lld, ar, nm, objcopy,
    symbolizer; multicall.cpp) and the signal-ABI sources recompiled against the
    current sysroot (see PRESTAGE.md).
    wasm-opt for fork Asyncify comes from @ai-ecoverse/wasm-binaryen (PATH).
