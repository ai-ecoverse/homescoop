# ripgrep for slicc WASI preview1 (no Emscripten glue).
name: wasi-ripgrep
builder: host
runner: pool
# renovate: datasource=crate depName=ripgrep
version: "15.2.0"
npm: "@ai-ecoverse/wasi-ripgrep"
toolchain:
  rust: "1.98.1"
summary: "ripgrep 15 for slicc WASI preview1 (command rg)"
source:
  url: "https://static.crates.io/crates/ripgrep/ripgrep-{{version}}.crate"
  sha256: "a30750b6d0743bfdd2656ebbaf4555aa278c43144b84bc389bcbfa399485ec71"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://github.com/BurntSushi/ripgrep
  license: "MIT OR Unlicense"
  notes: |
    cargo build --locked --target wasm32-wasip1 (release, stripped) from the
    .crate, with dependencies vendored. Manifest abi=wasi; command rg →
    bin/rg.wasm (no glue). Default features only (no PCRE2).
    patches/grep-cli-wasi-stdin.patch (homescoop#168) applies to the
    vendored grep-cli: piped and redirected stdin are searched, as on Linux.
    15.2.0-4 (homescoop#343) pins Rust 1.98.1 and ships
    THIRD-PARTY-NOTICES.md: every crate rg.wasm links (cargo metadata for
    wasm32-wasip1 over the vendored sources, checked against cargo tree),
    Rust's standard library and wasi-libc (homescoop_notice_rust).
    15.2.0-5: the notice names wasi-sdk-33, which Rust 1.98.1 builds its
    wasi-libc from (homescoop#472); wasm-opt is required, and a module it
    rejects fails the build instead of shipping unoptimised (homescoop#473).
