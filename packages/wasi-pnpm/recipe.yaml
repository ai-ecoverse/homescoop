# pnpm 12 for slicc WASI: pnpm.wasm built by homescoop from pnpm's own
# source with upstream's pnpm/wasm/build.mjs plus patches/, and a
# host-import module for slicc-kernel.
name: wasi-pnpm
builder: host
runner: pool
reproducible: true
version: "12.9.1"
npm: "@ai-ecoverse/wasi-pnpm"
summary: "pnpm 12 for slicc WASI (commands pnpm, pn)"
source:
  # pnpm v12.9.1 (the release commit "chore(release): 11.28.4, pacquet 12.9.1")
  url: "https://github.com/pnpm/pnpm/archive/5dafb0980042af99fb1aa24478d16f03b8474b50.tar.gz"
  sha256: "5ade48506ae88ed031994ea1aab5bfc161d1a3b60f4604100f719678a42684ee"
  commit: "5dafb0980042af99fb1aa24478d16f03b8474b50"
toolchain:
  # Exactly what pnpm/wasm/build.mjs at that commit requires.
  rust: "nightly-2026-08-27"
  wasi_sdk: "34.0"
  wasi_sdk_sha256_linux_x64: "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4"
  wasi_sdk_sha256_macos_arm64: "9c59398106b417f8f14913380fdf0097a8cc0ff4af9eb3ce0065a859e88d49e9"
  wabt: "1.0.42"
  wabt_sha256_linux_x64: "84895407a6bbb80e918f33b16b2fb2206021c150b6bc9ff6f761263a745ab131"
  wabt_sha256_macos_arm64: "3f654779b436c628db3ca4323c51538815f5fbc887a6d5f3bb1c18d36281e240"
# homescoop#1287: the initial heap from the measured peak, with headroom.
wasm:
  initial-memory: 320MiB
  measured-peak: 280MiB
  measured-by: "pnpm-agent-loop run 39330831811: wasi-pnpm 12.9.1-16's PNPM_SLICC_PEAK_FILE over bios's cold-store agent install (kernel 1.124.2, hosted); warm installs peak at 96 MiB"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://pnpm.io
  license: MIT
  notes: |
    build.sh fetches the pinned pnpm source, applies patches/ (0001: build
    parking_lot_core with its `nightly` feature, so contended locks wait
    with memory.atomic.wait32 instead of panicking; 0002: pnpm-cli doesn't
    compile its checkout's CARGO_MANIFEST_DIR into the wasm, so the bytes
    don't depend on the build directory, homescoop#522), drops the
    .cargo/config.toml block that points crates.io at pnpm's vendored
    .pnpm/crates (Cargo.lock checksums still apply), and runs upstream's
    pnpm/wasm/build.mjs with the pinned toolchain and remapped paths.
    host/pnpm-host.mjs implements pnpm_host, pnpm_fs and pnpm_atomic on
    slicc-kernel's per-command imports hook. build.sh fails when strings
    finds the work tree, CARGO_HOME or a home or temp path in pnpm.wasm.
    12.9.1-9 is built from source again (12.9.1-8 was a packaging-only
    repack of -7, pinned to the runner's /home/runner/work/_temp path).
    12.9.1-10 links with CARGO_PROFILE_RELEASE_STRIP=debuginfo, and 0003
    keeps that linked module. names.py moves its Rust function names,
    renumbered past build.mjs's two pnpm_atomic imports, into
    bin/pnpm.wasm.names. It also drops the generated-only name section, so
    SLICC names a trap's frames under SLICC_WASM_BACKTRACE=1. That re-links
    the code (homescoop#1126). 12.9.1-12's 0005 cuts the wasm port's
    per-file mode calls (a shard's mode once per directory; no fstat/fchmod
    of a created file once creation modes are seen to apply), and
    host/pnpm-host.mjs reads the process umask from the kernel. 12.9.1-13
    drops 12.9.1-11's 0004 (stage, rename aside, rename in): on slicc-kernel
    <= 1.124.x a directory rename copies the tree, and for a large package
    it timed out (os error 73) in 41 of 160 agent installs (homescoop#1127's
    loop); homescoop#1128 is open again. 12.9.1-14's 0006 copies imported
    files with slicc-kernel's ctx.fs.copyFile (>= 1.128.0; ENOSYS falls
    back), and build.sh links pnpm.wasm with 256 MiB of initial memory
    against homescoop#1127's cross-thread memory.grow traps
    (HOMESCOOP_PNPM_INITIAL_MEMORY=0 to build without).
    12.9.1-15's 0007 makes `pnpm init` pin the running pnpm (a pin to the
    registry's latest made every later command fail), and 0008 stops the
    local-prefix walk below `/`, whose base-set node_modules made `/` the
    project of every directory without a manifest (thr_r75dacjwyi, a live
    seven). 12.9.1-16's 0009 gives pnpm a wasm allocator that refreshes the
    thread's view of the shared memory (memory.grow(0)) before handing out
    memory above it (homescoop#1127: V8's bulk-memory bounds checks against a
    stale per-thread length), in pnpm's own source rather than a patched
    sysroot. 12.9.1-17 links the initial heap from recipe.yaml's wasm
    field (320 MiB, from a measured 280 MiB cold-install peak; #1287).
