# GNU grep for slicc wasm realm (host ladder).
name: grep
builder: host
runner: pool
# renovate: datasource=git-tags depName=https://git.savannah.gnu.org/git/grep.git extractVersion=^v(?<version>.*)$
version: "3.12"
npm: "@ai-ecoverse/wasm-grep"
summary: "GNU grep for slicc"
source:
  url: "https://mirrors.kernel.org/gnu/grep/grep-{{version}}.tar.xz"
  sha256: "2649b27c0e90e632eadcd757be06c6e9a4f48d941de51e7c0f83ff76408a07b9"
sources:
  pcre2:
    # renovate: datasource=github-releases depName=PCRE2Project/pcre2 extractVersion=^pcre2-(?<version>.*)$
    version: "10.49"
    url: "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-{{version}}/pcre2-{{version}}.tar.bz2"
    sha256: "53c156e1ba416a20da8e65395daa132da0d80e76910424caca3fcdae7831d384"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://github.com/ai-ecoverse/homescoop/tree/main/packages/grep
  license: GPL-3.0-or-later
  notes: |
    Port of slicc-emscripten/build-wasm-gnu.sh. Links slicc cli profile
    (spawn+exec+select+jobs, whole-archive) via build-gnu-cli.sh. grep -P
    uses a static PCRE2 (no JIT) built from the pinned source (homescoop#680).
