name: py-fonttools
builder: host
version: "4.66.1"
npm: "@ai-ecoverse/py-fonttools"
summary: "fonttools for slicc WASIX CPython"
# 4.66.1-7 is packaging-only: 4.66.1-6's bytes with wasix-python as a range,
# ">=3.14.2-16 <3.14.3" (#702). Drop repack: when the next release rebuilds.
repack:
  from: "4.66.1-6"
dependencies:
  build: []
  host: []
  run:
    - wasix-python
about:
  license: MIT
  notes: |
    Pure-Python wheel staged into lib/python3.14/site-packages.
    slicc.python.sitePackages only (no abi/platform requires).
