# SQLite CLI (amalgamation shell.c) for slicc wasm realm.
name: sqlite3
builder: host
# renovate: datasource=github-tags depName=sqlite/sqlite extractVersion=^version-(?<version>.*)$
version: "3.54.0"
npm: "@ai-ecoverse/wasm-sqlite3"
summary: "sqlite3 CLI 3.54.0 for slicc wasm realm"
source:
  url: "https://www.sqlite.org/{{year}}/sqlite-amalgamation-{{amal}}.zip"
  sha256: "68e913b0fe8ec6b4e5f391c594a28872884e80d6cd042a1e50c957be46b5aa4d"
  year: "2026"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://github.com/ai-ecoverse/homescoop/tree/main/packages/sqlite3
  license: blessing
  notes: |
    Builds the official amalgamation CLI (sqlite3.c + shell.c) with emcc.
    Links slicc cli profile (spawn + exec + gaps + signals + select + jobs).
    Replaces the sql.js-backed just-bash sqlite3 command.
    The amalgamation number in source.url ({{amal}}) is derived from
    version (3.54.0 -> 3540000); source.year is the release year and has to
    be moved by hand when a release lands in a new year.
