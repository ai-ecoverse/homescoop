# GNU screen — Emscripten ABI (PTY ioctls via musl + SLICC #3733 glue).
name: screen
builder: host
runner: pool
version: "5.0.1"
npm: "@ai-ecoverse/wasm-screen"
summary: "GNU screen 5.0.1 for slicc (emscripten; asyncify fork; slicc-kernel pseudo-terminals)"
source:
  url: "https://mirrors.kernel.org/gnu/screen/screen-{{version}}.tar.gz"
  sha256: "2dae36f4db379ffcd14b691596ba6ec18ac3a9e22bc47ac239789ab58409869d"
  # SOURCE_DATE_EPOCH for screen -v's "build on" date (BUILD_DATE in
  # Makefile.in), so a rebuild on another day has the same bytes (#497):
  # the newest file in screen-5.0.1.tar.gz, 2025-05-15T15:42:28Z.
  epoch: "1747323748"
# ladder-pr builds it twice and compares the package.tgz sha256.
reproducible: true
sources:
  ncurses:
    version: "6.5"
    url: "https://mirrors.kernel.org/gnu/ncurses/ncurses-{{version}}.tar.gz"
    sha256: "136d91bc269a9a5785e5f9e980bc76ab57428f604ce3e5a5a90cebc767971cc6"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://www.gnu.org/software/screen/
  license: GPL-3.0-or-later
  notes: |
    Emscripten only — WASIX cannot surface TIOCGPTN/TIOCSPTLCK/TIOCSCTTY.
    Uses musl posix_openpt/openpty + SLICC ioctl wrap (PR #3733).
    Default configure: --disable-socket-dir (sockets under $SCREENDIR or
    $HOME/.screen); package sets SCREENDIR=/tmp/screens; screen -ls lists
    them. SLICC PR #3733 (pseudo-terminals) has merged — PTY ioctls available.
    Reattach from a different terminal fails until slicc-kernel#192 (other
    terminals' /dev/ttyN are not visible; no SCM_RIGHTS on kernel sockets);
    cert/reattach.mjs measures it and flips to requiring the attach once the
    attacher's tty is visible from the session.
    5.0.1-11 (#497): SOURCE_DATE_EPOCH from source.epoch pins screen -v's
    build date, so the build is byte-reproducible (reproducible: true).
