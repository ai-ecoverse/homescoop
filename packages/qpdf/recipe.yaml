# qpdf (pdftk replacement) for slicc wasm realm (host ladder).
name: qpdf
builder: host
# renovate: datasource=github-releases depName=qpdf/qpdf extractVersion=^v(?<version>.*)$
version: "12.4.2"
npm: "@ai-ecoverse/wasm-qpdf"
summary: "qpdf PDF transformation tool for slicc"
source:
  url: "https://github.com/qpdf/qpdf/releases/download/v{{version}}/qpdf-{{version}}.tar.gz"
  sha256: "8a58af5b6141319287c1883bec8bd1bd545b7567b7fc5e6ce5d25a1c85f36397"
dependencies:
  build:
    - "@ai-ecoverse/wasm-zlib@1.3.1-2"
    - "@ai-ecoverse/wasm-libjpeg-turbo@3.1.2-1"
  host: []
  run: []
about:
  homepage: https://github.com/ai-ecoverse/homescoop/tree/main/packages/qpdf
  license: Apache-2.0
  notes: |
    qpdf, fix-qdf and zlib-flate (homescoop#96, replaces slicc 6's pdftk).
    emcmake, static libqpdf, native crypto only (no OpenSSL/GnuTLS),
    zlib + libjpeg from homescoop, wasm exceptions. Links the slicc gaps
    profile. New package → human cert.
