# Info-ZIP zip 3.0 + unzip 6.0 for slicc wasm realm.
name: zip
builder: host
reproducible: true
version: "3.0.0"
npm: "@ai-ecoverse/wasm-zip"
summary: "Info-ZIP zip/unzip for slicc"
source:
  url: "https://deb.debian.org/debian/pool/main/z/zip/zip_3.0.orig.tar.gz"
  sha256: "f0e8bb1f9b7eb0b01285495a2699df3a4b766784c1765a8f1aeedf63c0806369"
  # SOURCE_DATE_EPOCH for __DATE__ in zip -v / unzip -v (homescoop#441):
  # UnZip 6.00's release day, 2009-04-20T00:00:00Z, the newer of the two.
  epoch: "1240185600"
sources:
  unzip:
    version: "6.0"
    url: "https://deb.debian.org/debian/pool/main/u/unzip/unzip_6.0.orig.tar.gz"
    sha256: "036d96991646d0449ed0aa952e4fbe21b476ce994abc276e49d30e686708bd37"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://github.com/ai-ecoverse/homescoop/tree/main/packages/zip
  license: Info-ZIP
  notes: |
    Builds zip 3.0 and unzip 6.0 (second tarball fetched in build.sh).
    Links slicc cli profile. zip-*.patch go into zip's tree, in filename
    order: zip -s 0 of a split archive (split-copy, #440), zip - to stdout
    (stdout-seek, #439), zip -T without a shell and a failed test's double
    fclose (test-spawn, test-failed-fclose, #432). unzip-*.patch go into
    unzip's. unzip-debian-NN-<name>.patch are Debian unzip 6.0-31's
    debian/patches/<name>, verbatim, NN its place in debian/patches/series
    (https://deb.debian.org/debian/pool/main/u/unzip/unzip_6.0-31.debian.tar.xz,
    sha256 d7dc23f5254c6711dc05f467e70236cfd50a7931001c6152904474b19f295c38):
    the security fixes (#582), the two that 32 needs to apply (05, 17),
    and the functional fixes 04 (the PKWARE verification bit), 21 (64-bit
    sizes in warnings) and 29 (Windows zip64 archives, total disks 0; #652);
    not the branding, man page, zipgrep, build-date or build-only ones.
    Then ours: escape-bound (unzip -U), mapname-keep-ff (#602),
    unipath-short (#582) and unipath-utf8 (#570). slicc-strict-paths.js
    (--js-library) makes every path syscall refuse a name that isn't UTF-8
    with EILSEQ instead of the glue's lossy decode (#602). cert/meta.json
    maps each to its spec.
