# protoc-gen-connect-go (the Connect code generator for Go) for slicc WASI preview1: a command, so
# buf generate can run it as a local plugin in slicc-kernel (@ai-ecoverse/wasi-buf).
name: wasi-protoc-gen-connect-go
# Not built by the ladder; .github/workflows/wasi-protoc-plugins.yml builds and tests it.
builder: retired
version: "1.21.0"
npm: "@ai-ecoverse/wasi-protoc-gen-connect-go"
summary: "protoc-gen-connect-go 1.21.0 for slicc WASI preview1 (command protoc-gen-connect-go)"
source:
  # connect-go v1.21.0
  url: "https://github.com/connectrpc/connect-go/archive/41b7f302f0d0100d715eb9e44873ee69c06afa8b.tar.gz"
  sha256: "bc9975f30ceddc3d2b977d98f0a673341625e7801317a7ec7ca85df5525dbfee"
  commit: "41b7f302f0d0100d715eb9e44873ee69c06afa8b"
toolchain:
  go: "1.26.7"
  go_sha256_linux_x64: "ffb5f8de10c62550dfddab66b36b57030721e0a44a3218e9e1181d7b59f121ca"
  go_sha256_macos_arm64: "020a1e8224811be75163e920bc77e0926a1390a6aeea19bdcf23f74b9d749f6d"
build:
  module: "."
  package: "./cmd/protoc-gen-connect-go"
  command: "protoc-gen-connect-go"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://github.com/connectrpc/connect-go
  license: Apache-2.0
  notes: |
    scripts/build-wasip1-go-command.sh builds protoc-gen-connect-go from the pinned
    source with the pinned Go (GOOS=wasip1 GOARCH=wasm CGO_ENABLED=0
