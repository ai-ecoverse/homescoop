  notes: |
    ntfy v2.32.0 (tag v2.32.0, commit 9d0b6d9). build.sh fetches the pinned
    source and Go 1.27.1, applies patches/*.patch and builds the client only
    (-tags noserver, upstream's make cli-client: no server, no SQLite, no
    web app) with GOOS=wasip1 GOARCH=wasm CGO_ENABLED=0 -trimpath
    -buildvcs=false, main.version/commit/date fixed from this recipe so the
    build is reproducible. The module's go.sum is checked as its modules
    download.
    patches/0001-wasip1-slicc-host.patch: wasip1 build files, and HTTP and
    spawn through package/host/ntfy-host.mjs (ntfy_host imports).
    patches/0002-gateway-contract.patch: resume with since=<last id>,
    Retry-After honoured, auth errors end ntfy sub, oversize messages
    refused before any request.
    build.date is the tag commit's time (2026-10-18T12:30:13Z) as a Unix
    time, which is what upstream's Makefile passes.
