# Perl 5.42 for slicc WASIX (perl-cross + wasixcc + wasix-sysroot).
name: wasix-perl
builder: host
runner: pool
reproducible: true
inputs:
  - scripts/install-wasixcc.sh
# renovate: datasource=perl-version
version: "5.42.0"
npm: "@ai-ecoverse/wasix-perl"
summary: "Perl 5.42 for slicc WASIX (commands perl, prove, pod2man, cpan)"
source:
  url: "https://www.cpan.org/src/5.0/perl-{{version}}.tar.xz"
  sha256: "73cf6cc1ea2b2b1c110a18c14bbbc73a362073003893ffcedc26d22ebdbdd0c3"
sources:
  # perl-cross (arsv) overlay; 1.6.5 carries the perl 5.42.0 diffs.
  perl_cross:
    url: "https://github.com/arsv/perl-cross/releases/download/1.6.5/perl-cross-1.6.5.tar.gz"
    sha256: "81130cd4b8c6d9eb2a1959f37d44391a46ad6a6794fc41fed5441f74e85e3dd0"
wasm:
  initial-memory: 64MiB
  measured-peak: 44MiB
  measured-by: "cert/heap.mjs on 5.42.0-22's first CI build (run 39702590579, wasix-sysroot 2025.9.30-42, 13.3 MiB linked initial memory) on slicc-kernel 1.132.1: VmSize of each perl process polled from /proc/<pid>/status (perl is single-threaded, so that is the allocating thread's view): a 100000-key hash 43.8 MiB, an automake-style parse of 30000 Makefile.am lines 27.5 MiB, loading 14 core modules 21.9 MiB, a fork child's 4 MiB s///g 17.4 MiB. A 4.5 MiB configure-script rewrite peaks at 84 MiB and grows past the initial heap, which the -39 allocator refresh covers"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://www.perl.org
  license: Artistic-1.0-Perl OR GPL-1.0-or-later
  notes: |
    Cross-built with perl-cross (arsv) over Perl 5.42.0; wasixcc against wasix-sysroot
    (asyncify sysroot — real fork). Core XS statically linked (usedl=undef).
    Post-link wasm-opt --asyncify for fork/setjmp. Pure-Perl lib/ as real dirs.
    PERL5LIB defaults under package + ~/.local/share/perl5. m4 not bundled — package
    separately if autoconf/autoreconf needs it.
