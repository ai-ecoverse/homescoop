# ImageMagick utilities/magick for slicc wasm realm (host ladder).
name: imagemagick
builder: host
# renovate: datasource=github-releases depName=ImageMagick/ImageMagick versioning=loose
version: "7.1.2-33"
npm: "@ai-ecoverse/wasm-imagemagick"
summary: "ImageMagick magick CLI (convert/identify/mogrify argv0 aliases)"
source:
  url: "https://github.com/ImageMagick/ImageMagick/archive/refs/tags/{{version}}.tar.gz"
  sha256: "c768ff077cccff1b682aa56653b54247b268752427ca998992b24cc7c597d9e7"
dependencies:
  build:
    - "@ai-ecoverse/wasm-zlib@1.3.1-2"
    - "@ai-ecoverse/wasm-libjpeg-turbo@3.1.2"
    - "@ai-ecoverse/wasm-libpng@1.6.59-1"
    - "@ai-ecoverse/wasm-lcms2@2.19.1-1"
    - "@ai-ecoverse/wasm-libtiff@4.7.2-1"
    - "@ai-ecoverse/wasm-libwebp@1.5.0-1"
    - "@ai-ecoverse/wasm-openjpeg@2.5.3"
    - "@ai-ecoverse/wasm-freetype@2.13.3-1"
    - "@ai-ecoverse/wasm-libxml2@2.15.4-1"
    - "@ai-ecoverse/wasm-libiconv@1.18.0-1"
  host: []
  run: []
about:
  homepage: https://github.com/ai-ecoverse/homescoop/tree/main/packages/imagemagick
  license: ImageMagick
  notes: |
    Port of slicc-emscripten harness/ladder.sh rung_magick. Links slicc cli
    profile. package.json slicc.commands maps magick/convert/identify/mogrify
    onto bin/magick{.wasm} with argv0 for multi-call names.
    7.1.2-32-4 links webp, freetype and libxml2: up to -3 the .pc files
    homescoop_ensure_prefix_pcs synthesized for wasm-zlib, wasm-libwebp and
    wasm-freetype said Version: 0, so configure's libwebp >= 0.4.1 and
    freetype2 >= 2.8.0 checks failed and those delegates were left out, and
    -2/-3 configured --without-xml. cert/checklist.mjs asserts the delegates.
    wasm-libxml2 links GNU libiconv (wasm-libiconv); libwebp's encoder needs
    libsharpyuv (the synthesized libwebp.pc requires it).
    --without-heic on purpose (homescoop#304): HEIC needs libheif with
    libde265, an HEVC decoder, and HEVC is patent-encumbered, so the default
    package stays HEVC-free. A delegate cannot be added at run time, because
    this is a static Emscripten build (--without-modules) and slicc-kernel
    only dynamically links WASIX programs. HEIC/HEIF/AVIF reading is the
    separate, optional @ai-ecoverse/wasm-imagemagick-heif
    (packages/imagemagick-heif), built from this same configure with
    --with-heic; bump the two together.
    7.1.2-33-1 ships a resource policy sized for a browser tab as the
    default (packages/imagemagick/policy-tab.xml in etc/ImageMagick-7:
    memory 768MiB, map 512MiB, disk 512MiB, area 64MP, width/height 16KP),
    and upstream's policy-open.xml in etc/ImageMagick-7-open, used by the
    magick-open command or MAGICK_CONFIGURE_PATH. delegates.xml has no
    inkscape or rsvg-convert entries.
