# SciPy for slicc WASIX CPython 3.14 (f2c + static OpenBLAS into extensions).
name: py-scipy
builder: host
# renovate: datasource=pypi depName=scipy
version: "1.18.1"
npm: "@ai-ecoverse/py-scipy"
summary: "SciPy 1.18.0 for slicc WASIX CPython 3.14 (cp314-wasix_wasm32)"
source:
  url: "https://files.pythonhosted.org/packages/source/s/scipy/scipy-{{version}}.tar.gz"
  sha256: "52c4b7422442aba924d03ad4019852b08a92e64ea187b933135687bfe2747307"
dependencies:
  build:
    - wasix-python
    - py-numpy
  host: []
  run:
    - wasix-python
    - py-numpy
about:
  homepage: https://scipy.org
  license: BSD-3-Clause
  notes: |
    Cross-built with wasixcc shared-library (sysroot-ehpic) via hoodmane/f2c.
    OpenBLAS static into scipy extensions that need BLAS/LAPACK. Zero
    signature_mismatch; -Wl,--fatal-warnings on real extension links.
