# poppler PDF utilities (pdftotext, pdftoppm, …) for slicc wasm realm (host ladder).
name: poppler
builder: host
# renovate: datasource=gitlab-tags registryUrl=https://gitlab.freedesktop.org depName=poppler/poppler extractVersion=^poppler-(?<version>.*)$
version: "26.10.0"
npm: "@ai-ecoverse/wasm-poppler"
summary: "poppler PDF utilities for slicc"
source:
  url: "https://poppler.freedesktop.org/poppler-{{version}}.tar.xz"
  sha256: "6792cb7c69205007ad87d2e936cecc5b3a31fac29ab54ffc3175fdb6b2a6ce35"
sources:
  # URW base-35 Type1 fonts (GPL with font exception); base 14 ship.
  gsfonts:
    version: "8.11"
    url: "https://deb.debian.org/debian/pool/main/g/gsfonts/gsfonts_8.11+urwcyr1.0.7~pre44.orig.tar.gz"
    sha256: "9f2a598998bf05e023546ac981aa2a857aa1635d2e0e3020a3c3004ad564dc00"
dependencies:
  build:
    - "@ai-ecoverse/wasm-zlib@1.3.1-2"
    - "@ai-ecoverse/wasm-libjpeg-turbo@3.1.2-1"
    - "@ai-ecoverse/wasm-libpng@1.6.59-1"
    - "@ai-ecoverse/wasm-lcms2@2.19.1-1"
    - "@ai-ecoverse/wasm-freetype@2.13.3-1"
    - "@ai-ecoverse/wasm-openjpeg@2.5.3-1"
  host: []
  run: []
about:
  homepage: https://github.com/ai-ecoverse/homescoop/tree/main/packages/poppler
  license: GPL-2.0-only OR GPL-3.0-only
  notes: |
    pdftotext, pdftoppm, pdfinfo and friends (homescoop#95). Splash backend
    only: no cairo, so pdftocairo is not built. Generic font configuration
    (no fontconfig): the URW base-14 Type1 fonts from gsfonts ship in
    share/fonts, found through POPPLER_FONTSDIR (patched in). JPX through
    homescoop's openjpeg (build.sh writes the CMake config wasm-openjpeg
    lacks). New package → human cert.
