# Pandas for slicc WASIX CPython 3.14 (side modules, dlopen).
name: py-pandas
builder: host
# renovate: datasource=pypi depName=pandas
version: "2.3.3"
npm: "@ai-ecoverse/py-pandas"
summary: "Pandas 2.3.2 for slicc WASIX CPython 3.14 (cp314-wasix_wasm32)"
source:
  url: "https://files.pythonhosted.org/packages/source/p/pandas/pandas-{{version}}.tar.gz"
  sha256: "e05e1af93b977f7eafa636d043f9f94c7ee3ac81af99c13508215942e64c993b"
dependencies:
  build:
    - wasix-python
    - py-numpy
  host: []
  run:
    - wasix-python
    - py-numpy
    - py-python-dateutil
    - py-pytz
    - py-tzdata
    - py-six
about:
  homepage: https://pandas.pydata.org
  license: BSD-3-Clause
  notes: |
    Cross-built like py-numpy: real meson cross file (host_machine wasi/wasm32),
    wasixcc shared-library (exnref-ehpic), wasix-python + wasm py-numpy includes
    (NPY_SIZEOF_LONG=4). Wheel tag cp314-cp314-wasix_wasm32; meson-python emits
    *cpython-314-wasm32-wasix.so natively (no Darwin rename). Cython 3.1.3.
    Manifest slicc.python requires abi=cp314 platform=wasix_wasm32.
