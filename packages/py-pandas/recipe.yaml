# Pandas for slicc WASIX CPython 3.15 (side modules, dlopen).
name: py-pandas
builder: host
# renovate: datasource=pypi depName=pandas
version: "3.0.6"
npm: "@ai-ecoverse/py-pandas"
summary: "Pandas 3.0.6 for slicc WASIX CPython 3.15 (cp315-wasix_wasm32)"
source:
  url: "https://files.pythonhosted.org/packages/source/p/pandas/pandas-{{version}}.tar.gz"
  sha256: "66b07ef7315a31bfe1089cd3d71a7de781c9dca986762d0b4fe7c0ef17465d10"
sources:
  wasix_python:
    url: "https://registry.npmjs.org/@ai-ecoverse/wasix-python/-/wasix-python-3.15.0-1.tgz"
    sha256: "f96dde95f183dbc4b48a46bf70f6f616b823f5b9bafa75fa5e1334d1f96f4481"
  py_numpy:
    url: "https://registry.npmjs.org/@ai-ecoverse/py-numpy/-/py-numpy-2.5.4-1.tgz"
    sha256: "9e983a3c6d6edbbdc34cdfbcd49710aa17c5f67161ac19c99a3e2d38cd4c0a6c"
  cython:
    url: "https://files.pythonhosted.org/packages/bf/77/67b0b24e45073a699610e50f00c18474ff9b09ea29ecc95083bdf5e60acd/cython-3.3.0-py3-none-any.whl"
    sha256: "9b24b5c8cd536946b62086fcafee6d5509d3f549f72d553d2336af87ffbe0da1"
  meson:
    url: "https://files.pythonhosted.org/packages/9c/07/b48592d325cb86682829f05216e4efb2dc881762b8f1bafb48b57442307a/meson-1.9.1-py3-none-any.whl"
    sha256: "f824ab770c041a202f532f69e114c971918ed2daff7ea56583d80642564598d0"
  cpython:
    url: "https://www.python.org/ftp/python/3.15.0/Python-3.15.0.tgz"
    sha256: "438596cac081036d3c1d532ab7e7335eeb35567bc961749a0d5797176db0db68"
reproducible: true
notices:
  not_linked:
    py_numpy: "build-time headers and Cython declarations; py-numpy ships its own notices"
    cython: "build tool (Cython 3.3.0, generates the C sources)"
    meson: "build tool"
inputs:
  - packages/py-kiwisolver/test/wasm-call-signatures.mjs
dependencies:
  build:
    - wasix-python
    - py-numpy
  host: []
  run:
    - wasix-python
    - py-numpy
    - py-python-dateutil
    - py-pytz
    - py-tzdata
    - py-six
about:
  homepage: https://pandas.pydata.org
  license: BSD-3-Clause
  notes: |
    Built from the PyPI sdist in CI (the cp315 line, homescoop#761): meson
    1.9.1 + Cython 3.3.0 on the host python, a meson cross file (wasi/wasm32),
    wasixcc shared-library (sysroot-ehpic, legacy EH, PIC), wasix-python 3.15.0-1
    and py-numpy 2.5.4-1 headers. Side modules *cpython-315-wasm32-wasix.so.
    Manifest slicc.python requires abi=cp315 platform=wasix_wasm32.
