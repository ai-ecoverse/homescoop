# NumPy for slicc WASIX CPython 3.15 (side modules, dlopen).
name: py-numpy3.15
builder: host
reproducible: true
# renovate: datasource=pypi depName=numpy
version: "2.5.4"
npm: "@ai-ecoverse/py-numpy"
npm-tag: "python3.15"
summary: "NumPy 2.5.4 for slicc WASIX CPython 3.15 (cp315-wasix_wasm32)"
source:
  url: "https://files.pythonhosted.org/packages/source/n/numpy/numpy-{{version}}.tar.gz"
  sha256: "9a94cf751c9ad8ebaa835bcd3d40dacf8534ad086b88c38029b65123c7999d2a"
sources:
  openblas:
    url: "https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28.tar.gz"
    sha256: "f1003466ad074e9b0c8d421a204121100b0751c96fc6fcf3d1456bd12f8a00a1"
  cython:
    url: "https://files.pythonhosted.org/packages/bf/77/67b0b24e45073a699610e50f00c18474ff9b09ea29ecc95083bdf5e60acd/cython-3.3.0-py3-none-any.whl"
    sha256: "9b24b5c8cd536946b62086fcafee6d5509d3f549f72d553d2336af87ffbe0da1"
  wasix_python:
    url: "https://registry.npmjs.org/@ai-ecoverse/wasix-python/-/wasix-python-3.15.0-1.tgz"
    sha256: "f96dde95f183dbc4b48a46bf70f6f616b823f5b9bafa75fa5e1334d1f96f4481"
  cpython:
    url: "https://www.python.org/ftp/python/3.15.0/Python-3.15.0.tgz"
    sha256: "438596cac081036d3c1d532ab7e7335eeb35567bc961749a0d5797176db0db68"
inputs:
  - packages/py-kiwisolver/test/wasm-call-signatures.mjs
dependencies:
  build:
    - wasix-python
  host: []
  run:
    - wasix-python
about:
  homepage: https://numpy.org
  license: BSD-3-Clause
  notes: |
    Cross-built with wasixcc shared-library (sysroot-ehpic): -fPIC -fvisibility=default
    -shared -nostdlib -Wl,--allow-undefined, dylink.0 side modules named
    *cpython-315-wasm32-wasix.so under lib/python3.15/site-packages.
    Manifest slicc.python requires abi=cp315 platform=wasix_wasm32.
