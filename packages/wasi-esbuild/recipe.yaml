# esbuild (evanw/esbuild) for slicc WASI preview1: esbuild built from its Go
# source with GOOS=wasip1. esbuild-wasm on npm is a GOOS=js build that needs
# wasm_exec.js and a JS host, which slicc-kernel does not run.
name: wasi-esbuild
builder: host
# renovate: datasource=github-tags depName=evanw/esbuild extractVersion=^v(?<version>.*)$
version: "0.28.2"
npm: "@ai-ecoverse/wasi-esbuild"
summary: "esbuild 0.28 for slicc WASI preview1 (command esbuild)"
source:
  url: "https://github.com/evanw/esbuild/archive/refs/tags/v{{version}}.tar.gz"
  sha256: "300162f899361d9f0263065f8728ef9086dcfc1a3d36bcbc4e0abe5de9c58bf8"
toolchain:
  go: "1.26.7"
  go_sha256_linux_x64: "ffb5f8de10c62550dfddab66b36b57030721e0a44a3218e9e1181d7b59f121ca"
  go_sha256_macos_arm64: "020a1e8224811be75163e920bc77e0926a1390a6aeea19bdcf23f74b9d749f6d"
build:
  module: "."
  package: "./cmd/esbuild"
  command: "esbuild"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://esbuild.github.io
  license: MIT
  notes: |
    scripts/build-wasip1-go-command.sh builds cmd/esbuild from the pinned
    source with the pinned Go (GOOS=wasip1 GOARCH=wasm CGO_ENABLED=0
    -trimpath -buildvcs=false -ldflags='-s -w -buildid='), unpatched. The
    command sets "preopenRoot": true (slicc-kernel >= 1.30.0, #144): "/" is
    preopened, so module resolution can walk every directory up to the root.
    (0.28.2-1 carried 0001-wasip1-outside-preopens.patch for that.)
