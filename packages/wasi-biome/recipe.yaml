# Biome (biomejs/biome) CLI for slicc WASI preview1: biome_cli built from
# source for wasm32-wasip1-threads. @biomejs/wasm-web is a wasm-bindgen
# library for a JS host, not a CLI, and Biome publishes no WASI build.
name: wasi-biome
builder: host
runner: pool
# renovate: datasource=github-tags depName=biomejs/biome extractVersion=^@biomejs/biome@(?<version>.*)$
version: "2.6.6"
npm: "@ai-ecoverse/wasi-biome"
summary: "Biome 2.6 for slicc WASI preview1 (command biome)"
source:
  url: "https://github.com/biomejs/biome/archive/refs/tags/@biomejs/biome@{{version}}.tar.gz"
  sha256: "0fce71ab77fcc17c4c3966681a90f5d7b8108bdb3d7e091fde57aab7b6386cd1"
inputs:
  - scripts/rust-wasm-refresh-alloc.rs
# homescoop#1287: the initial heap from the measured peak, with headroom.
wasm:
  initial-memory: 128MiB
  measured-peak: 97MiB
  measured-by: "biome check of a 3000-file TypeScript project (cert/stress.mjs's shape, twice its size), VmSize polled from /proc/<pid>/status: 98,496 kB peak with 2.5.15-4 on slicc-kernel 1.132.1; 400 files stay at 21 MB"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://biomejs.dev
  license: "MIT OR Apache-2.0"
  notes: |
    cargo build --release --locked -p biome_cli --target
    wasm32-wasip1-threads with the toolchain biome pins (rust-toolchain.toml),
    BIOME_VERSION set as in upstream's release build, RUSTFLAGS
    --cfg tokio_unstable -C codegen-units=1 -C strip=symbols and a 4 GiB
    memory maximum. Threads, because the crawler, scanner and module graph
    run on std threads and rayon; the kernel runs wasi thread-spawn.
    0001-wasi-cli.patch: no daemon (sockets, child processes) and no
    `biome upgrade` on WASI; the working directory is the process's
    (PWD when it is `.`'s device and inode, else the walk up `..`).
    2.5.15-3 (homescoop#343) ships THIRD-PARTY-NOTICES.md
    (homescoop_notice_rust): every crate biome.wasm links, Rust's standard
    library (rust-toolchain.toml's 1.98.1) and wasi-libc.
    2.5.15-4: the notice names wasi-sdk-33, which Rust 1.98.1 builds its
    wasm32-wasip1-threads wasi-libc from (homescoop#472).
    2.6.4-2: 0001 no longer takes a stale PWD (Node's spawn with `cwd`
    leaves the parent's); cert/cwd.mjs, on slicc-kernel 1.176.2 with
    slicc-jsh's node.
