# OpenBLAS for slicc WASIX: a build input (static PIC libopenblas.a, headers,
# pkg-config) that py-numpy and py-scipy link, so OpenBLAS is built once
# (homescoop A6 split).
name: wasix-openblas
builder: host
runner: pool
reproducible: true
# renovate: datasource=github-releases depName=OpenMathLib/OpenBLAS extractVersion=^v(?<version>.*)$
version: "0.3.34"
npm: "@ai-ecoverse/wasix-openblas"
summary: "OpenBLAS for slicc WASIX: static PIC libopenblas.a (BLAS, CBLAS, C netlib LAPACK; f2c int ABI, single-threaded), headers, pkg-config"
source:
  url: "https://github.com/OpenMathLib/OpenBLAS/releases/download/v{{version}}/OpenBLAS-{{version}}.tar.gz"
  sha256: "cd7e129868320cc2d033afa920e31202dfe0b8066a5b66661900ccc0f197dfed"
toolchain:
  wasix_sysroot: "2025.9.30-38"
  wasix_sysroot_sha256: "1fb57c95d84e7b33a5a535561a0d536c943c40fefd70991f9570db8e27994574"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://github.com/ai-ecoverse/homescoop/tree/main/packages/wasix-openblas
  license: BSD-3-Clause AND BSD-2-Clause
  notes: |
    build.sh: OpenBLAS 0.3.28 with the pinned wasixcc on wasix-sysroot -38
    (toolchain.wasix_sysroot), PIC with legacy wasm exceptions (the ehpic
    tree numpy's and scipy's side modules use; OpenBLAS is C, so the objects
    carry no EH code). TARGET=RISCV64_GENERIC BINARY=32 NOFORTRAN=1
    USE_THREAD=0 NO_SHARED=1 NO_LAPACKE=1 NO_AFFINITY=1, `make libs netlib`,
    and wasm-abi.py's source edits (packages/py-numpy/tools/build-openblas.sh,
    after Pyodide): every Fortran-style entry returns int (the f2c ABI), and
    xerbla_ is two-argument and weak. tmglib (LAPACK's test-matrix
    generators) is dropped from the archive.
