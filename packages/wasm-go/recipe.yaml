# Go 1.26 toolchain tools for SLICC's `go` driver (GO-CONTRACT / PR #3657).
# Queue: after wasix-python, py-numpy, py-pandas. Revision versions only.
#
# Package split (40 MiB npm cap):
#   @ai-ecoverse/wasm-go              — VERSION + pkg/tool/wasip1_wasm/{compile,link,asm}
#   @ai-ecoverse/wasm-go-std-wasip1   — std .a for wasip1/wasm (~30 MB gzipped alone)
#   @ai-ecoverse/wasm-go-std-linux-amd64 — optional cross-compile std (optional later)
name: wasm-go
builder: host
# renovate: datasource=golang-version depName=go
version: "1.27.2"
npm: "@ai-ecoverse/wasm-go"
summary: "Go 1.27 wasip1 tools (compile/link/asm) for slicc go driver"
source:
  url: "https://go.dev/dl/go{{version}}.src.tar.gz"
  sha256: "03495da2ba64894d40f5c4992e49454fa78b50690604ff92b6afff5081b76e62"
sources:
  go_linux_amd64:
    url: "https://go.dev/dl/go{{version}}.linux-amd64.tar.gz"
    sha256: "ecbadb99091a3f46e31f5f934b068b1864eafa7995211b39eaddf76996045fe5"
  go_darwin_arm64:
    url: "https://go.dev/dl/go{{version}}.darwin-arm64.tar.gz"
    sha256: "76812b213b1b2302c978d28fa52fa92d541704b9e7d9d5db8002c50e4018c4c5"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://go.dev
  license: BSD-3-Clause
  notes: |
    Reference: slicc GO-CONTRACT.md / tmp-wasi/live/go/build.sh.
    Stage goroot/VERSION + goroot/pkg/tool/wasip1_wasm/{compile,link,asm}
    (no extension): GOOS=wasip1 GOARCH=wasm CGO_ENABLED=0 go build -trimpath
    -ldflags='-s -w' cmd/<tool>, same host Go version as recipe.
    Manifest slicc.go only — do NOT list go/compile/link in slicc.commands
    (SLICC TS driver owns `go`). Std archives ship in wasm-go-std-* packages;
    driver unions slicc.go.std by (version, target).
