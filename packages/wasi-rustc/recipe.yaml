# Rust compiler for slicc WASI (LLVM-in-wasm host).
name: wasi-rustc
builder: host
# Spike cut tracks oligamiq/rust_wasm v3.0.0 (rustc 1.83.0-dev). Bump when
# in-tree x.py build lands on a current stable.
# renovate: datasource=github-releases depName=rust-lang/rust
version: "1.83.0"
npm: "@ai-ecoverse/wasi-rustc"
summary: "rustc (LLVM) for slicc wasm32-wasip1 — host is wasm32-wasip1-threads"
source:
  # Spike: oligamiq release artifacts (bjorn3 compile_rustc_for_wasm lineage).
  url: "https://github.com/oligamiq/rust_wasm/releases/download/v3.0.0-release/rustc_opt.wasm.tar.gz"
  sha256: "skip"
dependencies:
  build: []
  host: []
  run:
    - wasm-clang
about:
  homepage: https://github.com/ai-ecoverse/homescoop/tree/main/packages/wasi-rustc
  license: MIT OR Apache-2.0
  notes: |
    Path B: LLVM-in-wasm (not Weblings CLIF→wasm). Host: wasm32-wasip1-threads.
    Start from bjorn3 compile_rustc_for_wasm* + oligamiq LLVM patches; rustc pins its LLVM.
    Linker: spawn wasm-ld from @ai-ecoverse/wasm-clang over WASIX (default -C linker=wasm-ld).
    Default --target wasm32-wasip1; ship lib/rustlib/... (no symlinks).
    Cargo deferred. See SPIKE.md.
