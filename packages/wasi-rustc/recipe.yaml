name: wasi-rustc
builder: host
reproducible: true
version: "1.98.1"
npm: "@ai-ecoverse/wasi-rustc"
summary: "rustc 1.98.1 (LLVM 21 inside the wasm) for slicc WASI: host wasm32-wasip1-threads, default target wasm32-wasip1"
source:
  url: "https://static.rust-lang.org/dist/rustc-{{version}}-src.tar.xz"
  sha256: "be1816e7f6c40abb90245ad6e024bed2a7e88d7dda4561e4d5470207df616b9f"
sources:
  wasi_llvm:
    url: "https://registry.npmjs.org/@ai-ecoverse/wasi-llvm/-/wasi-llvm-21.1.8-2.tgz"
    sha256: "5181c65f743599b3eb13ebd878a4e8dc6e1e0e010cdb28bfbc036ce6a438312e"
toolchain:
  llvm: "21.1.8"
  wasi-sdk: "34.0"
  wasi_sdk_sha256_linux_x64: "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4"
inputs:
  - scripts/wasm-refresh-malloc.c
# homescoop#1287: the initial heap from the measured peak, with headroom.
wasm:
  initial-memory: 192MiB
  measured-peak: 161MiB
  measured-by: "HOMESCOOP_WASM_PEAK (scripts/wasm-refresh-malloc.c, the highest malloc block end, measured in the allocating thread) of the first 1.98.1-8 CI build (run 39484414298) on slicc-kernel 1.134.3: rustc hi.rs 161 MiB, so a small compile stays in the initial heap. Bigger ones grow past it, which the refresh covers: a 400-function rustc -O 281 MiB, a 1500-function one 675 MiB debug and 1.7 GB at -O"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://github.com/ai-ecoverse/homescoop/tree/main/packages/wasi-rustc
  license: (MIT OR Apache-2.0) AND Apache-2.0 WITH LLVM-exception
  notes: |
    build.sh fetches rustc-1.98.1-src.tar.xz (vendored crates, llvm-project
    and cargo included) by sha256, applies patches/0003-0019, installs
    wasi-sdk 34.0 (pinned here, as wasi-llvm does) and fetches the published
    @ai-ecoverse/wasi-llvm by sha256 (#876). make-stable-config.py writes the
    bootstrap config: host wasm32-wasip1-threads against wasi-llvm's
    llvm-config, targets wasm32-wasip1 and wasm32-wasip1-threads, the
    in-tree LLVM 22 only for the Linux build machine, remap-debuginfo on.
    x.py install; bin/rustc.wasm is the compiler without its name section
    (scripts/split-name-section.py) and DWARF, bin/rustc the driver
    (rustc-driver.sh), lib/rustlib/wasm32-wasip1 the target std. Stage0 comes
    from static.rust-lang.org, checked against src/stage0's sha256s.
