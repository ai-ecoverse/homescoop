  notes: |
    html-to-markdown v2.5.2 (tag v2.5.2, commit 290df46, Go, MIT). build.sh
    fetches the pinned source and Go 1.27.3, checks that the tag v<version>
    still names the pinned commit (so a version-only bump fails closed),
    vendors the modules (go.sum checked), applies 0001-termenv-wasip1.patch
    and builds the CLI ./cli/html2markdown with GOOS=wasip1 GOARCH=wasm
    CGO_ENABLED=0 -trimpath -buildvcs=false -mod=vendor, main.version,
    main.commit and main.date set as upstream's goreleaser does (build.date
    is the tag commit's time), so the build is reproducible.
    0001-termenv-wasip1.patch: termenv (the CLI's coloured error prefix) has
    no wasip1 build; its js/plan9/aix fallback (no colours) builds for
    wasip1 too. The same one-line patch is in wasi-gh.
    build.sh also builds the same tree natively and checks its output on
    test/fixtures (a Node.js docs page, invalid HTML, the generated large
    page, empty input) against the committed goldens, which the cert
    compares the wasm's output with.
