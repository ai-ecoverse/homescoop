# fnox (jdx/fnox) for seven's kernel: the secrets tool as a WASI command.
# Upstream is jdx/fnox v1.45.0; the patches live here (NNNN-*.patch, applied
# in filename order by apply.sh) and are only those the WASI build or seven's
# in-kernel integration needs. Tested on slicc-kernel 1.83.0 and later
# (/dev/sealed and exec tickets).
name: wasi-fnox
builder: host
# renovate: datasource=github-releases depName=jdx/fnox
version: "1.45.0"
npm: "@ai-ecoverse/wasi-fnox"
summary: "fnox 1.45 for slicc WASI preview1 (command fnox; seven's sealed store)"
source:
  url: "https://github.com/jdx/fnox/archive/refs/tags/v{{version}}.tar.gz"
  sha256: "845f9e8078869c60d67a1a9d14a77e997bca0a7c5640c7ae83ca38fecd4a8340"
  epoch: "1793301543"
# ladder-pr builds it twice and compares the package.tgz sha256 (homescoop#536).
reproducible: true
toolchain:
  rust: "1.98.1"
  binaryen: "133"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://fnox.jdx.dev
  license: MIT
  notes: |
    Upstream is jdx/fnox v1.45.0; the patches live here, are not
    upstreamed (per Lars), and are kept only when (a) the WASI build
    needs them or (b) seven's in-kernel integration does. Host installs
    use upstream fnox as it is. apply.sh checks and applies the series
    in filename order (git apply --check, then apply), then copies
    homescoop's crates/wasix-command, the path dependency 0005 names.
    (a) building for WASI:
      0001 gate non-WASI dependencies (cloud SDKs, reqwest, rustls,
           keyring, TUI, prompts, signals, locks, keepass, and from
           1.40.0 kube, k8s-openapi and mlua's vendored Lua) by target;
           1.42.1's rust-embed stays common, since age uses it on WASI too
      0002 build only the age and plain providers on WASI; others keep
           their config variants and fail when used, and keep their
           env_dependencies() (read from the module source at build
           time), so proxy run scrubs their credentials (homescoop#401);
           from 1.40.0 also the kubernetes and lua providers, a module
           directory (lua/mod.rs), and a list named by a constant (the
           Azure providers' SERVICE_PRINCIPAL_ENV_VARS; azure_shared stays
           built without its Azure SDK credential code); from 1.41.0
           also the gopass provider (the gopass CLI through
           tokio::process), whose GNUPGHOME, GOPASS_HOMEDIR and
           GOPASS_CONFIG_NOWRAP proxy run scrubs the same way
      0003 compile out mcp (including request_secret and the proxy MCP
           relay), local_http, secret_session, tui, daemon, leases,
           prompts on WASI, and from 1.40.0 the plugin command and
           fnox-core's plugins; from 1.42.0 the azure-token lease's
           prerequisite check reads its auth setting (azure_shared's
           AzureAuth, which stays built), and its backend, managed
           identity included, stays compiled out; from 1.42.1 also
           activate's invoked_exe (which and current_exe); proxy stays
           as a WASI stub for rules validation (0009)
      0004 cwd from PWD, HOME from the environment, current_thread; the
           XDG defaults (config, state, and 1.40.0's data dir) as on unix
      0005 spawn `fnox exec` children through wasix-command
      0011 allow the lints that WASI-gated code leaves behind
      0013 set: std IsTerminal on WASI (atty is always false on wasm);
           also (b): an empty sealed value is refused
      0014 refuse `fnox edit` on WASI (tempfile's temp_dir() and the
           editor's std Command can't run there; it trapped with 134,
           homescoop#376): "fnox edit is not available in seven: use
           fnox set"
      0017 plain: read a `file` provider's secrets file with std::fs on
           WASI (1.40.0's tokio::fs read needs a blocking-pool thread
           and trapped with 134)
      0018 refuse `fnox files`, `fnox set --file` and `fnox get --file`
           on WASI (1.44 secret files; seven has no deploy path)
    (b) seven (secrets-tokens-design.md; /dev/sealed is §3.7):
      0006 the sealed provider and fnox_core::sealed, the device client
      0007 set: seal a piped value; on a terminal ask the vault dialog
           (request/status, cancel on ^C); refuse values in argv
      0008 exec: materialize, then spawn the resolved path with
           SLICC_SEALED_TICKET; as_file refused; missing command → 127
      0009 proxy rules --json; proxy run passes placeholders on WASI
      0010 refuse sync/reencrypt, age decryption (slicc-vault#2); check
           asks the vault for each sealed record
      0012 exec --shell-grants: materialize {shellGrants} (slicc-vault#9)
           for the agent's bash hook; the child runs in the ticket's cwd
      0015 (a+b) the shell integration: hook-env takes the pid from the
           kernel (std's process::id panicked, rc 134, homescoop#400);
           activate names fnox by its PATH entry (/usr/bin/fnox), not a
           bare fnox its fnox() wrapper calls recursively; as_file files
           are refused with exec's message (temp_dir() panicked too)
      0016 exec leaves an as_file secret unset with a warning instead of
           refusing the command (homescoop#945); activate skips a fnox
           on PATH the kernel won't execute (homescoop#1129)
    cargo build --locked --release --bin fnox --target wasm32-wasip1
    with RUSTFLAGS --cfg tokio_unstable and SOURCE_DATE_EPOCH set to the
    v1.45.0 commit time (source.epoch, 2026-10-29T19:19:03Z), so the
    build is byte-reproducible (homescoop#364), then wasm-opt -Oz
    (binaryen 133). No C toolchain. THIRD-PARTY-NOTICES.md from cargo metadata
    plus Rust's std and wasi-libc licences. 1.39.0-1 is certified and
    published; 1.39.0-2 adds 0014 and the reproducible build; 1.39.0-3
    keeps the disabled providers' env_dependencies() in 0002; 1.39.0-4
    adds 0015; 1.39.0-5 puts tokio in 0005's Cargo.lock entry for
    wasix-command (its optional tokio feature), so --locked builds again,
    and 0015's activate names /usr/bin/fnox when PATH has none
    (homescoop#554); 1.39.0-6 adds 0016. 1.40.0-1 rebases the series
    onto v1.40.0: 0001-0004, 0006, 0007, 0009 and 0013 are refreshed
    (contexts, the new kubernetes and lua providers, plugins,
    azure_shared, set's --from-file order); no patch is dropped, since
    upstream does none of them itself; 0017 is new. 1.41.0-1 rebases
    the series onto v1.41.0: 0002 also compiles out the new gopass
    provider; 0006 (the provider list, which gains gopass), 0009 (proxy
    rules' help text, now on ProxyRulesCommand) and 0016 (exec's plan
    call, now Roots::Scope) are refreshed; the others need new contexts
    only; no patch is dropped, since upstream does none of them itself.
    1.42.0-1 rebases the series onto v1.42.0: 0003 keeps azure_token.rs's
    AzureAuth import on WASI, since the lease's check_prerequisites now
    matches on it; the others need new contexts only; no patch is
    dropped, since upstream does none of them itself; build.sh's
    usage-test notice moves to 7.1.0 (the same LICENSE, f68207e9...).
    1.42.1-1 rebases the series onto v1.42.1: 0003 also gates upstream's
    new invoked_exe in activate, so WASI still finds fnox only through
    0015's PATH walk; 0001, 0015 and 0016 need new contexts only (0001
    keeps rust-embed common); the others apply as they are; no patch is
    dropped, since upstream does none of them itself; build.sh's
    usage-test notice moves to 7.1.1 (the same LICENSE, f68207e9...).
    Upstream's activate hooks now test the binary before deactivating,
    so `fnox deactivate` works after fnox is removed; the cert covers it.
    1.43.0-1 rebases all 17 patches. 0003 gates the four new lease
    backends and the native sandbox module. 0005 refuses exec output
    redaction on WASI before resolving secrets; it needs helper threads.
    0009 gates the new native proxy machinery and refuses OS sandbox
    requests on WASI before spawning. The sealed ticket, provider scrub
    and existing refusal patches retain their added and removed lines.
    0016 also captures the child environment before resolution, so a
    filtered-out interpolation dependency cannot leak through fnox's
    mutated process environment; original inherited values survive.
    1.45.0-1 rebases the series onto v1.45.0 (skipping 1.44 as Renovate
    did): 0003 gates mcp's request_secret page, local_http and
    secret_session; 0007 uses set's key() accessor; 0009 replaces the
    single-file proxy.cfg spray with src/proxy/wasi.rs (validate_config
    and target_label; reserved FNOX_PROXY_MCP* env names); 0010's
    reencrypt refusal sits above the new files re-encrypt path; 0018
    refuses fnox files and set/get --file. Security patches 0006, 0008,
    0010 and 0012 keep the same added and removed lines; 0007 only
    renames &self.key to self.key(); 0009 gains the WASI stub. build.sh's
    usage-test notice moves to 7.1.3 (the same LICENSE, f68207e9...).
