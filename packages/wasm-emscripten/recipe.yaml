# Homebrew-shaped recipe — Emscripten 6.0.9 driver for slicc.
name: wasm-emscripten
builder: host
runner: pool
version: "6.0.9"
npm: "@ai-ecoverse/wasm-emscripten"
summary: "Emscripten 6.0.9 (emcc) for slicc via wasix-python"
source:
  url: "https://github.com/emscripten-core/emscripten"
  sha256: "skip"
# 6.0.9-18 is packaging-only: 6.0.9-17's bytes with slicc.env
# EM_CACHE_PACKAGE / EM_LLVM_PACKAGE / EM_BINARYEN_PACKAGE = ${package}/../<dep>
# (-17 hard-coded /shared/lib/node_modules/…, which npm and pnpm never fill;
# #277) and emscripten-config resolving them physically. Drop repack: when
# the next release rebuilds.
# 6.0.9-19 too: wasm-clang 24.0.0-18 and wasm-binaryen 132.0.0-2, whose glue's
# Node-host runner stays out of noInitialRun hosts (homescoop#276).
# package/package.json keeps -17's "files" (a repack may not change it), so
# it still says "Media"; build.sh writes "media" for the next real build, and
# test/files.test.mjs checks that list against the tarball (#205).
repack:
  from: "6.0.9-17"
  files:
    - emscripten-config
    - README.md
  fields:
    - slicc.env
dependencies:
  build: []
  host: []
  run:
    - wasix-python
    - wasm-clang
    - wasm-binaryen
    - emscripten-cache
about:
  homepage: https://github.com/ai-ecoverse/homescoop/tree/main/packages/wasm-emscripten
  license: MIT
  notes: |
    Stages slicc-emscripten/src/emscripten (excluding test/docs) with
    September slicc patches, Closure refuse, ac_cv_build seeding, and
    writable EM_CACHE + sysroot symlink into emscripten-cache.
