about:
  license: BSD-3-Clause
  notes: |
    Cross-built from the sdist with wasixcc++ (legacy wasm EH, PIC) as a
    dylink.0 side module against wasix-python 3.15.0-1's headers and the
    libc++ headers of the C++ runtime python.wasm exports (wasix-libc
    v2026-07-03.1 sysroot-ehpic). Wheel tag cp315-wasix_wasm32; native
    _cext.cpython-315-wasm32-wasix.so.
