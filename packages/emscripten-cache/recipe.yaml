name: emscripten-cache
builder: host
reproducible: true
version: "6.0.9"
npm: "@ai-ecoverse/emscripten-cache"
summary: "Prebuilt Emscripten 6.0.9 sysroot for slicc (read-only seed)"
source:
  url: "https://github.com/emscripten-core/emscripten/archive/4e4223852a0835923411059a3929907d7df1232e.tar.gz"
  sha256: "426911732c683c5940e3e089782d90d272ec2738c933e53593f9e9a65ff6aa96"
inputs:
  - "packages/wasm-emscripten/patches/**"
  - "packages/wasm-emscripten/package/package.json"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://github.com/ai-ecoverse/homescoop/tree/main/packages/emscripten-cache
  license: MIT
  notes: |
    The sysroot (headers + the system libraries listed in libs.txt) that
    `embuilder build` makes from the emscripten 6.0.9 tag with
    packages/wasm-emscripten/patches applied, on emsdk 6.0.9's prebuilt
    clang and binaryen (scripts/emscripten-tree.sh). Same tree and patches as
    wasm-emscripten 6.0.9-20. Runtime CACHE is a writable user dir whose
    sysroot is a symlink into this package. homescoop#859.
