# The Fastly CLI (fastly/cli) for slicc WASI preview1: fastly.wasm built by
# homescoop from fastly's source with GOOS=wasip1 and patches/, plus a
# host-import module for slicc-kernel.
name: wasi-fastly
builder: host
reproducible: true
# renovate: datasource=github-releases depName=fastly/cli extractVersion=^v(?<version>.*)$
version: "17.2.0"
npm: "@ai-ecoverse/wasi-fastly"
summary: "Fastly CLI 17.2.0 for slicc WASI preview1 (command fastly)"
source:
  url: "https://github.com/fastly/cli/archive/23a945ddd734be70671c246f3c5a8a4fecfb3a42.tar.gz"
  sha256: "be0f2e80ba0588b35e93f710f746910537590690a4569da3a2fff79ee2d0fffa"
  tag: "v{{version}}"
  commit: "23a945ddd734be70671c246f3c5a8a4fecfb3a42"
  tree: "8fca3e1633547cd11c01079f9180e7d564e55ad9"
toolchain:
  go: "1.27.3"
  go_sha256_linux_x64: "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40"
  go_sha256_macos_arm64: "dd3908cf20959d798c1e06ebe5b72213f0505ce01373b40ce3110975a6cd99c2"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://www.fastly.com/documentation/reference/cli/
  license: Apache-2.0
  notes: |
    fastly at source.tag and source.commit (the version above; its go.mod
    requires go 1.26.10). build.sh fetches the pinned source and Go
    (toolchain.go), vendors the modules (go.sum checked),
    applies patches/*.patch and builds ./cmd/fastly with GOOS=wasip1
    GOARCH=wasm CGO_ENABLED=0 -trimpath -buildvcs=false and upstream's
    release ldflags (-s -w, revision.AppVersion v<version>,
    revision.GitCommit the short commit, revision.Environment release).
    patches/0001-wasip1-build.patch: wasip1 files for go-ps and
    otiai10/copy, the only modules that do not build for wasip1.
    patches/0002-wasip1-slicc-host.patch: HTTP (http.DefaultTransport, and
    go-fastly's client on wasip1) through package/host/fastly-host.mjs
    (fastly_host imports), modes for the config directory, config.toml and
    errors.log, and a piped token for fastly auth login.
    patches/0003-wasip1-unavailable-commands.patch: SSO, compute
    build/publish/serve/init/install-tools, vcl serve, update and install
    refuse with a clear error; no update check, no build-data notice.
    patches/0004-lazy-oidc-metadata.patch: the OpenID Connect metadata is
    fetched only when an SSO token may need it.
    build.sh runs wasm-opt -Oz and fails above 62 MiB, so fastly.wasm fits
    a Cloudflare Dynamic Worker (64 MiB of code).
