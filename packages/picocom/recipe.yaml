  notes: |
    Emscripten ABI like screen and less, with no patches: termios and
    ioctl(TIOCM*) on the kernel's embedder serial nodes (slicc-kernel's
    "Embedder devices", kernel.devices.add). Built with the less shim
    profile (select/poll wait in the kernel). Build flags instead of
    patches: -DNO_FORK (no sz/rz file transfer, so --send-cmd and
    --receive-cmd are refused), no LINENOISE (its only use is the
    file-name prompt of those transfers), no USE_FLOCK and no UUCP lock
    dir (a node has one open file description at a time, EBUSY for a
    second), -DNO_CUSTOM_BAUD (the standard speeds B50 to B4000000 with
    HIGH_BAUD; no termios2 BOTHER speeds), and -DUSE_IOCTL so DTR and
    RTS go through TIOCMBIS/TIOCMBIC as on Linux (emscripten does not
    define __linux__). em-select.c and -Dselect=homescoop_picocom_select
    send picocom's select() to the shims' pselect, which waits in the
    kernel: the shims replace pselect and poll but not select, and
    Emscripten's own select never blocks, so picocom's main loop took the
    0 for its idle timeout and exited right after 'Terminal ready'.
