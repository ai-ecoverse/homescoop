name: wasi-zig
builder: host
reproducible: true
# renovate: datasource=github-releases depName=ziglang/zig
version: "0.16.0"
npm: "@ai-ecoverse/wasi-zig"
summary: "Zig 0.16.0 with LLVM 21 for slicc WASI (command zig; zig cc / c++)"
source:
  url: "https://ziglang.org/download/{{version}}/zig-{{version}}.tar.xz"
  sha256: "43186959edc87d5c7a1be7b7d2a25efffd22ce5807c7af99067f86f99641bfdf"
sources:
  wasi_llvm:
    url: "https://registry.npmjs.org/@ai-ecoverse/wasi-llvm/-/wasi-llvm-21.1.8-2.tgz"
    sha256: "5181c65f743599b3eb13ebd878a4e8dc6e1e0e010cdb28bfbc036ce6a438312e"
toolchain:
  zig_sha256_linux_x64: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
  zig_sha256_macos_arm64: "b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"
  llvm: "21.1.8"
  wasi-sdk: "34.0"
  wasi_sdk_sha256_linux_x64: "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4"
  wasi_sdk_sha256_macos_arm64: "9c59398106b417f8f14913380fdf0097a8cc0ff4af9eb3ce0065a859e88d49e9"
inputs:
  - scripts/wasm-refresh-malloc.c
# homescoop#1287: the initial heap from the measured peak, with headroom.
wasm:
  initial-memory: 96MiB
  measured-peak: 73MiB
  measured-by: "cert/heap.mjs: the highest block end wasi-libc's malloc handed out (HOMESCOOP_WASM_PEAK, measured in the allocating thread), over 3 rounds of 4 concurrent zig cc -O2 plus zig build-exe -OReleaseFast and a cold @cImport: 73 MiB (with zig's 57 MiB of data and stack below it); 0.16.0-19 on slicc-kernel 1.134.3. Zig's own allocator (BrkAllocator) grows the memory itself, above the initial heap"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://ziglang.org/
  license: MIT AND Apache-2.0 WITH LLVM-exception
  notes: |
    build.sh fetches the zig 0.16.0 source and the host zig 0.16.0
    (ziglang.org, sha256 per host), installs wasi-sdk 34.0 (pinned here, as
    wasi-llvm does) and fetches the published
    @ai-ecoverse/wasi-llvm by sha256 (#876). It applies patches/, compiles
    zig's C++ glue (libzigcpp) with wasi-sdk clang++, resolves the compiler
    module through `zig build`, builds the compiler object without libc,
    builds wasi-libc, libc++ and Zig's runtimes for the baseline wasm32-wasi
    target once (prebuilt in lib/prebuilt), and links zig.wasm with wasi-sdk
    (threads, imported shared memory) against wasi-llvm. lib/ holds zig's
    std, runtimes, clang's wasm resource headers and the libc headers;
    wasi-libc's C sources are @ai-ecoverse/wasi-zig-libc-src (its own
    recipe). slicc.env: ZIG_LIB_DIR=${package}/lib,
    ZIG_GLOBAL_CACHE_DIR=${HOME}/.cache/zig, ZIG_EXE=zig. Wasm output has no
    start section (export _start only). The compiler imports wasix_32v1
    (proc_spawn3/proc_join); user wasm32-wasi programs stay preview1.
    0.16.0-18's 0027: JIT commands (translate-c, which @cImport runs) take
    zig's path from ZIG_EXE on WASI (#1061), and C++ against the wasm32-wasi
    libc++ (built without exceptions) defaults to -fno-exceptions (#1062).
    0.16.0-19: zig.wasm's link wraps the malloc family with
    scripts/wasm-refresh-malloc.c (the view refresh for blocks above a
    thread's view of the shared memory, #1287), and the initial memory is
    recipe.yaml's wasm.initial-memory.
