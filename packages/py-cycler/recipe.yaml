name: py-cycler
builder: host
version: "0.12.1"
npm: "@ai-ecoverse/py-cycler"
summary: "cycler for slicc WASIX CPython"
# 0.12.1-4 is packaging-only: 0.12.1-3's bytes with exact @ai-ecoverse pins
# (wasix-python 3.14.2-13). Drop repack: when the next release rebuilds.
repack:
  from: "0.12.1-3"
dependencies:
  build: []
  host: []
  run:
    - wasix-python
about:
  license: BSD-3-Clause
  notes: |
    Pure-Python wheel staged into lib/python3.14/site-packages.
    slicc.python.sitePackages only (no abi/platform requires).
