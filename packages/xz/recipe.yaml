# XZ Utils for slicc wasm realm (xz/lzma CLIs + static liblzma).
name: xz
builder: host
runner: pool
# renovate: datasource=github-releases depName=tukaani-project/xz extractVersion=^v(?<version>.*)$
version: "5.8.4"
npm: "@ai-ecoverse/wasm-xz"
summary: "xz / lzma tools and liblzma for slicc"
source:
  url: "https://github.com/tukaani-project/xz/releases/download/v{{version}}/xz-{{version}}.tar.xz"
  sha256: "4ce24038fd4221e0d13bc1a2de7a4db56e90b92b3bf75321f6c14be73f65de4b"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://github.com/ai-ecoverse/homescoop/tree/main/packages/xz
  license: "0BSD AND GPL-2.0-or-later"
  notes: |
    --disable-shared --enable-static --disable-threads. slicc cli profile.
    argv0 aliases: unxz xzcat lzma unlzma lzcat. Stages xzgrep/xzdiff/xzless.
    5.8.4-2: package/LICENSE is upstream's COPYING, COPYING.0BSD and
    COPYING.GPLv2; the scripts are GPL-2.0-or-later (homescoop#511).
    5.8.4-7: xzless is a command; the scripts' tools are dependencies
    (homescoop#1487).
    5.8.4-8: those tools are peerDependencies "*" in package.json, so an
    install reuses the top-level copies instead of nesting old pins
    (slicc-bios#939).
