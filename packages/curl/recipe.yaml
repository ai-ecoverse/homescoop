# curl + libcurl for slicc wasm realm (loopback sockets + Mbed TLS).
name: curl
builder: host
# renovate: datasource=github-releases depName=curl/curl extractVersion=^curl-(?<major>\d+)_(?<minor>\d+)_(?<patch>\d+)$
version: "8.22.0"
npm: "@ai-ecoverse/wasm-curl"
summary: "curl 8.22 + libcurl (Mbed TLS, zlib, HTTP/1.1) for slicc"
source:
  url: "https://curl.se/download/curl-{{version}}.tar.xz"
  sha256: "f7ef3ae8a22e521f289803fe93543eb64c329b58aa73a9e224dfd915a2a5f4f7"
sources:
  mbedtls:
    version: "3.6.5"
    url: "https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-{{version}}/mbedtls-{{version}}.tar.bz2"
    sha256: "4a11f1777bb95bf4ad96721cac945a26e04bf19f57d905f241fe77ebeddf46d8"
dependencies:
  build: []
  host:
    - "@ai-ecoverse/wasm-zlib@1.3.1-2"
  run: []
about:
  homepage: https://github.com/ai-ecoverse/homescoop/tree/main/packages/curl
  license: curl
  notes: |
    Mbed TLS 3.6.5 backend; honors SSL_CERT_FILE / CURL_CA_BUNDLE and proxy env.
    HTTP/1.1 only (no nghttp2). Links slicc net profile (socket+select+spawn+gaps).
    Ships curl CLI, static libcurl.a + mbedtls libs, headers, and curl.pc.
