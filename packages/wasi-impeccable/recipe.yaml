# Impeccable engine CLI for slicc WASI preview1.
# Upstream is a design skill + Rust engine; this recipe ships detect, the
# FS-local verbs and the HTTP verbs for wasm32-wasip1.
name: wasi-impeccable
builder: host
runner: pool
# ladder-pr builds it twice and compares the package.tgz sha256.
reproducible: true
inputs:
  - crates/wasix-net/**
  - crates/wasix-ureq/**
  - crates/wasix-command/**
  - scripts/build-common.sh
  - scripts/rust-wasm-refresh-alloc.rs
# renovate: datasource=github-releases depName=pbakaus/impeccable extractVersion=^engine-v(?<version>.*)$
version: "0.1.28"
npm: "@ai-ecoverse/wasi-impeccable"
toolchain:
  rust: "1.98.1"
summary: "impeccable engine 0.1.28 for slicc WASI preview1 (command impeccable; file-local, HTTP and live verbs)"
source:
  url: "https://github.com/pbakaus/impeccable/archive/refs/tags/engine-v{{version}}.tar.gz"
  sha256: "fafa269ad91ae95829d74865797eacdb2b176cce7a6aa56b60ac85cfaea0e635"
# homescoop#1287: the initial heap from the measured peak, with headroom.
wasm:
  initial-memory: 64MiB
  measured-peak: 49MiB
  measured-by: "cert/stress.mjs's impeccable detect --json over a 600-page site (40 rules and 40 paragraphs a page), VmSize polled from /proc/<pid>/status: 49 MiB peak with 0.1.15-4 on slicc-kernel 1.134.3"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://impeccable.style
  license: Apache-2.0
  notes: |
    cargo build -p impeccable --target wasm32-wasip1 after
    0001-wasi-cli.patch. Upstream has no WASI feature; the patch is
    mechanical cfg(target_family = "wasm"): ureq is replaced by wasix-ureq,
    std::net by wasix-net and std::process by wasix-command (homescoop
    crates/, vendored by build.sh; HTTPS goes in absolute form through the
    kernel's proxy); live mode runs (built for wasm32-wasip1-threads: its
    server is thread-per-connection, ≤48; it self-spawns detached, with pids
    from WASIX proc_id); skill-bundle signatures are verified with
    ed25519-dalek (verify_strict) instead of ring, which does not build for
    wasm32-wasip1, against the same compiled-in keys; Io's cwd is the
    process's working directory (wasi-libc's current_dir() stays /): PWD
    when it is `.`'s device and inode, else the walk up `..` (0.1.18-2,
    not a stale PWD); avoid process::id / thread spawn
    panics; print clear "not available in this build yet" for
    URL/--cdp/capture/serve-question; Svelte live sessions (node) refuse. Live
    needs slicc-kernel 1.17.2 or later (#105 clock polls, #106 lookups of
    files other processes create).
    --version prints the crate / engine VERSION (0.1.x). wasm-opt -Oz.
    Command impeccable → bin/impeccable.wasm (abi=wasi).
    0.1.14-2 (homescoop#343) pins Rust 1.98.1 and ships
    THIRD-PARTY-NOTICES.md (homescoop_notice_rust): every crate the wasm
    links, Rust's standard library and wasi-libc.
    0.1.15-2: the notice names wasi-sdk-33, which Rust 1.98.1 builds its
    wasi-libc from (homescoop#472); wasm-opt is required, and a module it
    rejects fails the build instead of shipping unoptimised (homescoop#473).
    0.1.15-3: RUSTFLAGS remap the work tree, CARGO_HOME and the sysroot,
    so impeccable.wasm no longer embeds the builder's registry paths and
    the bytes don't depend on CARGO_HOME or the work directory
    (homescoop#471); build.sh fails on any home, temp or rustup path.
    (The remap flags go to cargo as CARGO_ENCODED_RUSTFLAGS.)
    0.1.15-4: the same impeccable.wasm as 0.1.15-3 (byte-identical), a
    packaging revision for the #642 cache-key fix. #676's mismatch between
    main and npm had already been fixed by ed4bfd7 (wasix-command's tokio
    module back at the end of wasix.rs); homescoop#825 corrects this note.
    build.sh's wasm cache key covers the vendored crates/wasix-*, so a
    local rebuild after a crate edit reruns cargo (homescoop#642).
    0.1.16-1: 0001 rebased onto engine-v0.1.16. Upstream moved live's
    HTTP server core into crates/common (http.rs, now also the decision
    page's and component review's server, replacing tiny_http, which is a
    dev-dependency only), so common takes wasix-net for it and live's
    live_http.rs hunk is gone. New in 0.1.16, detect --cdp <port|url>
    attaches to a running Chromium-based app's DevTools port; on WASI it
    refuses like URL scans ("--cdp scans need a browser; not available in
    this build yet", cert/cdp.mjs). No patch dropped: upstream still has no
    WASI support.
    0.1.17-1: 0001 rebased onto engine-v0.1.17. live gained markup5ever
    next to the dependencies the patch rewrites, which was the one rejected
    hunk; the wasm-side dependency change itself is unchanged, and the skill
    download's new connect and idle timeouts already exist in wasix-ureq.
    cert/checklist.mjs reads the expected --version from this recipe.
    0.1.21-1: 0001 rebased onto engine-v0.1.21. The verb router moved from
    the cli's main.rs into its library (router.rs, run with an
    InstalledPack), so lib.rs gates only its native browser adapters and
    router.rs the CDP / listening-socket verbs; 0002's allocator include
    stays in main.rs. The new agents crate (the agents verb) named its temp
    files after std::process::id(), which panics on wasm32-wasip1; 0001 uses
    impeccable_common::process_id() there too (cert/agents.mjs).
    0.1.22-1: 0001 rebased onto engine-v0.1.22. The cli now depends on
    the new account crate (login, logout, whoami, health, pro-refresh,
    design health uploads after detect and Pro dispatch), which needs ring,
    a loopback OAuth listener and the OS keychain; 0001 keeps it native
    (the cli's dependency, main.rs's Pro dispatch and router.rs's account
    arms and health upload), so on WASI those verbs refuse with "not
    available in this build yet" and detect never uploads. The new loop
    verb builds as is and refuses off macOS (cert/account.mjs).
    0.1.23-1: 0001 rebased onto engine-v0.1.23. The account crate grew
    setup reporting (setup, and a setup-report worker the cli schedules
    from detect, context, doctor, whoami, agents, the skills verbs and a
    successful login),
    critique sync (critiques, critiques-refresh, and critique-storage
    uploading each saved critique) and health-design-refresh; 0001 keeps
    them native with the rest of account (the cli's setup_report module,
    its schedule calls, the new arms and critique-storage's upload), so on
    WASI those verbs refuse with "needs Impeccable account sign-in; not
    available in this build yet" and critique-storage saves locally only
    (cert/setup.mjs). audit-storage and reports.enabled build as is
    (cert/reports.mjs); loop connect / disconnect refuse off macOS, and
    the toml_edit they parse with stays a dependency on every target. The
    shared HTTP builder now takes the request's URL and skips the proxy
    for loopback and NO_PROXY hosts, following redirects hop by hop; on
    wasm only its TLS config is left out (wasix-ureq).
    0.1.24-1: 0001 rebased onto engine-v0.1.24. The cli gained regex (a
    dependency on every target) and the foundations module: the
    foundations verb's file checks and detector classes build for wasm, its
    git ls-files goes through wasix-command (a new cli dependency), and its
    upload (router's health_scan, foundations::from_scan) stays native with
    account (cert/foundations.mjs). The account verbs world and
    taste-refresh, and the taste refresh the cli schedules from
    setup_report, stay native: on WASI they refuse with "needs Impeccable
    account sign-in; not available in this build yet". walkthrough
    (base64, the system's ffmpeg and ffprobe) stays native and refuses
    with "needs ffmpeg" (cert/world.mjs). context's cached taste block,
    concept-seed's --replace-world and the loop status / connect --json
    additions build as is. No new crates: regex was already in the lock.
    0.1.25-1: 0001 rebased onto engine-v0.1.25 (router.rs's account arms
    were rejected: login now also scans the repository for the account and
    offers Loop after a sign-in). The new account verb status and that
    after-login work stay native with account, so status refuses with
    "needs Impeccable account sign-in"; motion-capture (the browser crate's
    Chrome) refuses with "needs browser capture". detect --before / --kept
    (the wiring check, read by the static HTML engine) build as is, and
    detect --changed runs git through wasix-command (a new dependency of
    the detect crate; with no git it refuses as outside a work tree).
    loop connect --mcp-only runs on any OS upstream; its account service
    origins and IMPECCABLE_HOME come from account's config.rs, which the
    cli builds as its own module on wasm, and its PATH lookup splits on
    `:` there, since std's split_paths panics on WASI. The taste block's
    temp file is named after impeccable_common::process_id()
    (cert/wiring.mjs, cert/mcp.mjs). No new crates.
    0.1.27-1: 0001 rebased onto engine-v0.1.27 (the bump skips 0.1.26).
    The prompts moved from skills into impeccable-common, so the piped
    stdin rule moved with them; the cli's lib.rs and Cargo.toml and the
    foundations disk source (whose checks moved into the new
    foundations-scan crate, which builds for wasm as is) were the rejected
    hunks. The new mcp crate (an MCP server proxying the account's tools)
    depends on account, so the cli takes it off wasm only: mcp and
    switches-refresh (the switch sync) refuse with "needs Impeccable
    account sign-in", agents running with "needs the Impeccable MCP
    server", and first-viewport and shot (Chrome) with "needs browser
    capture"; install registers no browser relay and offers no sign-in,
    and context prints no ACCOUNT: line. Sampled contrast (local images
    decoded by image's pure-Rust decoders, base64 newly linked), detect
    --sarif and --report-unused-ignores, design-compact, design-lookup,
    font-fetch and switches build as is; the sample cache's and
    design-compact's temp files, which std::process::id() would trap, are
    named after impeccable_common::process_id(), switches' git goes
    through wasix-command, and font-fetch's browser User-Agent needs
    wasix-ureq's new AgentBuilder::user_agent (cert/sampled.mjs,
    cert/design.mjs, cert/fonts.mjs, cert/switches.mjs).
    0.1.28-1: 0001 rebased onto engine-v0.1.28. loop connect describes
    five agents in one table (Claude Code, Codex, Cursor, GitHub Copilot
    CLI, opencode), and the agent lookup joins each one's binary
    (cursor-agent for Cursor), which was the one rejected hunk: on wasm it
    still splits PATH on `:`. For Cursor, Copilot and opencode the agents
    engine writes the MCP entry itself (journaled JSON entries, undone by
    agents undo), so loop connect --mcp-only connects Copilot and opencode
    on WASI; Cursor's cursor-agent enable step goes through std, which
    can't start it there, so Cursor reports not connected with its entry
    written (cert/journal.mjs). The new Codex hook trust (codex app-server
    over std::process and a thread) builds for wasm as is and is reached
    only from loop connect / disconnect, which refuse off macOS.
    foundations-scan's new error-capture and legal-page checks build as
    is. No new crates.
