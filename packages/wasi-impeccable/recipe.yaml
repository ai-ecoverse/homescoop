# Impeccable engine CLI for slicc WASI preview1.
# Upstream is a design skill + Rust engine; this recipe ships detect, the
# FS-local verbs and the HTTP verbs for wasm32-wasip1.
name: wasi-impeccable
builder: host
runner: pool
# ladder-pr builds it twice and compares the package.tgz sha256.
reproducible: true
inputs:
  - crates/wasix-net/**
  - crates/wasix-ureq/**
  - crates/wasix-command/**
  - scripts/build-common.sh
  - scripts/rust-wasm-refresh-alloc.rs
# renovate: datasource=github-releases depName=pbakaus/impeccable extractVersion=^engine-v(?<version>.*)$
version: "0.1.15"
npm: "@ai-ecoverse/wasi-impeccable"
toolchain:
  rust: "1.98.1"
summary: "impeccable engine 0.1.15 for slicc WASI preview1 (command impeccable; file-local, HTTP and live verbs)"
source:
  url: "https://github.com/pbakaus/impeccable/archive/refs/tags/engine-v{{version}}.tar.gz"
  sha256: "4eea50c9a9d04079b65ed8c80ab8ee21229dba1eecb3dec0cd7b4870c6112d55"
# homescoop#1287: the initial heap from the measured peak, with headroom.
wasm:
  initial-memory: 64MiB
  measured-peak: 49MiB
  measured-by: "cert/stress.mjs's impeccable detect --json over a 600-page site (40 rules and 40 paragraphs a page), VmSize polled from /proc/<pid>/status: 49 MiB peak with 0.1.15-4 on slicc-kernel 1.134.3"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://impeccable.style
  license: Apache-2.0
  notes: |
    cargo build -p impeccable --target wasm32-wasip1 after
    0001-wasi-cli.patch. Upstream has no WASI feature; the patch is
    mechanical cfg(target_family = "wasm"): ureq is replaced by wasix-ureq,
    std::net by wasix-net and std::process by wasix-command (homescoop
    crates/, vendored by build.sh; HTTPS goes in absolute form through the
    kernel's proxy); live mode runs (built for wasm32-wasip1-threads: its
    server is thread-per-connection, ≤48; it self-spawns detached, with pids
    from WASIX proc_id); skill-bundle signatures are verified with
    ed25519-dalek (verify_strict) instead of ring, which does not build for
    wasm32-wasip1, against the same compiled-in keys; Io's cwd comes from
    PWD (wasi-libc's current_dir() stays /); avoid process::id / thread spawn
    panics; print clear "not available in this build yet" for
    URL/capture/serve-question; Svelte live sessions (node) refuse. Live
    needs slicc-kernel 1.17.2 or later (#105 clock polls, #106 lookups of
    files other processes create).
    --version prints the crate / engine VERSION (0.1.x). wasm-opt -Oz.
    Command impeccable → bin/impeccable.wasm (abi=wasi).
    0.1.14-2 (homescoop#343) pins Rust 1.98.1 and ships
    THIRD-PARTY-NOTICES.md (homescoop_notice_rust): every crate the wasm
    links, Rust's standard library and wasi-libc.
    0.1.15-2: the notice names wasi-sdk-33, which Rust 1.98.1 builds its
    wasi-libc from (homescoop#472); wasm-opt is required, and a module it
    rejects fails the build instead of shipping unoptimised (homescoop#473).
    0.1.15-3: RUSTFLAGS remap the work tree, CARGO_HOME and the sysroot,
    so impeccable.wasm no longer embeds the builder's registry paths and
    the bytes don't depend on CARGO_HOME or the work directory
    (homescoop#471); build.sh fails on any home, temp or rustup path.
    (The remap flags go to cargo as CARGO_ENCODED_RUSTFLAGS.)
    0.1.15-4: the same impeccable.wasm as 0.1.15-3 (byte-identical), a
    packaging revision for the #642 cache-key fix. #676's mismatch between
    main and npm had already been fixed by ed4bfd7 (wasix-command's tokio
    module back at the end of wasix.rs); homescoop#825 corrects this note.
    build.sh's wasm cache key covers the vendored crates/wasix-*, so a
    local rebuild after a crate edit reruns cargo (homescoop#642).
