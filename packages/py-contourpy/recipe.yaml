name: py-contourpy
builder: host
reproducible: true
# renovate: datasource=pypi depName=contourpy
version: "1.4.0"
npm: "@ai-ecoverse/py-contourpy"
summary: "contourpy for slicc WASIX CPython 3.14"
source:
  url: "https://files.pythonhosted.org/packages/source/c/contourpy/contourpy-{{version}}.tar.gz"
  sha256: "20156f5a1ac4f8ce02656e39a61e82164a3d359796dc8026f75b062783d500e1"
sources:
  pybind11:
    url: "https://files.pythonhosted.org/packages/source/p/pybind11/pybind11-3.0.1.tar.gz"
    sha256: "9c0f40056a016da59bab516efb523089139fcc6f2ba7e4930854c61efb932051"
  wasix_python:
    url: "https://registry.npmjs.org/@ai-ecoverse/wasix-python/-/wasix-python-3.14.2-27.tgz"
    sha256: "2824bccd95f7d45dace30a5d0a74f3384d0390bcadfff38b4e8275c9ade1af37"
  cxxrt:
    url: "https://github.com/wasix-org/wasix-libc/releases/download/v2026-07-03.1/sysroot-ehpic.tar.gz"
    sha256: "54e00486bd0ab658009120c3980b967f96c95ec2ec10d23ba49261b9931927d0"
  cpython:
    url: "https://www.python.org/ftp/python/3.14.2/Python-3.14.2.tgz"
    sha256: "c609e078adab90e2c6bacb6afafacd5eaf60cd94cf670f1e159565725fcd448d"
inputs:
  - packages/py-kiwisolver/test/wasm-call-signatures.mjs
dependencies:
  build: [wasix-python]
  host: []
  run: [wasix-python, py-numpy]
about:
  license: BSD-3-Clause
  notes: |
    Cross-built from the sdist in CI (homescoop#211 A2) with wasixcc++
    (legacy wasm EH, PIC) and pybind11 3.0.1 as one dylink.0 side module,
    _contourpy.cpython-314-wasm32-wasix.so, against wasix-python 3.14.2-27's
    headers and the libc++ headers of the C++ runtime python.wasm exports
    (wasix-libc v2026-07-03.1 sysroot-ehpic), as py-kiwisolver. pybind11's
    numpy support finds numpy at run time, so no numpy headers are needed.
