name: py-contourpy
builder: host
version: "1.4.0"
npm: "@ai-ecoverse/py-contourpy"
summary: "contourpy for slicc WASIX CPython 3.14"
# 1.4.0-5 is packaging-only: 1.4.0-4's bytes with exact @ai-ecoverse pins
# (wasix-python 3.14.2-15, py-numpy 2.3.2-8). Drop repack: when the next
# release rebuilds.
repack:
  from: "1.4.0-4"
dependencies:
  build: [wasix-python, py-numpy]
  host: []
  run: [wasix-python, py-numpy]
about:
  license: BSD-3-Clause
  notes: |
    Cross-built with wasixcc + meson-python + pybind11.
    Wheel tag cp314-wasix_wasm32; native *.cpython-314-wasm32-wasix.so.
