# GNU Automake for slicc (Perl scripts; needs autoconf + perl + m4).
name: wasix-automake
builder: host
version: "1.17"
npm: "@ai-ecoverse/wasix-automake"
summary: "GNU Automake scripts for slicc (needs wasix-perl + wasix-autoconf + wasix-m4)"
source:
  url: "https://mirrors.kernel.org/gnu/automake/automake-{{version}}.tar.xz"
  sha256: "8920c1fc411e13b90bf704ef9db6f29d540e76d232cb3b2c9f4dc4cc599bd990"
# 1.17.0-6 is packaging-only: 1.17.0-5's bytes with exact @ai-ecoverse pins
# (wasix-autoconf 2.72.0-4, wasix-perl 5.42.0-8). Drop repack: when the next release rebuilds.
repack:
  from: "1.17.0-5"
dependencies:
  build: []
  host: []
  run:
    - wasix-perl
    - wasix-autoconf
    - wasix-m4
about:
  homepage: https://www.gnu.org/software/automake/
  license: GPL-2.0-or-later
  notes: |
    Script package: automake/aclocal. Shebang #!/usr/bin/perl.
