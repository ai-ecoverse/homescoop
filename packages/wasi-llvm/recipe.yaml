name: wasi-llvm
builder: host
reproducible: true
# renovate: datasource=github-releases depName=llvm/llvm-project
version: "21.1.8"
npm: "@ai-ecoverse/wasi-llvm"
summary: "LLVM/clang/lld 21.1.8 static libraries for wasm32-wasip1-threads (a build input for wasi-rustc and wasi-zig)"
source:
  url: "https://github.com/llvm/llvm-project/releases/download/llvmorg-{{version}}/llvm-project-{{version}}.src.tar.xz"
  sha256: "4633a23617fa31a3ea51242586ea7fb1da7140e426bd62fc164261fe036aa142"
toolchain:
  wasi-sdk: "34.0"
  wasi_sdk_sha256_linux_x64: "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4"
  wasi_sdk_sha256_macos_arm64: "9c59398106b417f8f14913380fdf0097a8cc0ff4af9eb3ce0065a859e88d49e9"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://llvm.org/
  license: Apache-2.0 WITH LLVM-exception
  notes: |
    Not a command package: a build input. The LLVM-enabled wasi-zig and
    wasi-rustc homescoop_fetch this package's npm tarball by sha256 and
    link it, so a ladder build of them has an attested LLVM (#876).
    build.sh builds the native tablegen tools from the same source, then
    LLVM, clang and lld for a wasm32-wasip1-threads host with wasi-sdk 34,
    pinned here (toolchain.wasi-sdk and both sha256s, passed to
    scripts/install-wasi-sdk.sh as an explicit version, as wasi-uv does);
    rustc's and zig's C++ link with the same wasi-sdk and libc++. WebAssembly target only; threads on, assertions off, no
    PIC, static. bin/llvm-config is a python3 script for the build machine
    (gen-llvm-config.py). patches/0001: rustc's LLVM WASI-host guards
    (endian, Support/Unix POSIX gaps) ported to 21. patches/0002: clang's
    export macros on __wasm__, and no clangInterpreter on WASI (its remote
    JIT needs sockets).
