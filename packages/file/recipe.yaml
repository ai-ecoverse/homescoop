# file(1) for slicc wasm realm (libmagic + magic.mgc).
name: file
builder: host
# renovate: datasource=github-tags depName=file/file extractVersion=^FILE(?<version>.*)$
version: "5.46"
npm: "@ai-ecoverse/wasm-file"
summary: "file(1) + magic.mgc for slicc"
source:
  url: "https://astron.com/pub/file/file-{{version}}.tar.gz"
  sha256: "c9cc77c7c560c543135edc555af609d5619dbef011997e988ce40a3d75d86088"
dependencies:
  build:
    - "@ai-ecoverse/wasm-zlib@1.3.1-2"
    - "@ai-ecoverse/wasm-bzip2@1.0.8-1"
    - "@ai-ecoverse/wasm-xz@5.8.1-1"
  host: []
  run: []
about:
  homepage: https://github.com/ai-ecoverse/homescoop/tree/main/packages/file
  license: BSD-2-Clause
  notes: |
    Static libmagic with zlib/bzlib/xzlib for -z. magic.mgc compiled with
    host `file` when cross-compiling. Manifest env MAGIC=${package}/share/misc/magic.mgc.
    magic.mgc is not byte-reproducible across builds/emsdk versions: the
    5.46.0-3 cert saw 2,520 bytes differ at the same size with identical
    detection results. Review a rebuild by its detections (cert), not by a
    byte diff of magic.mgc.
