name: imagemagick-heif
builder: host
# renovate: datasource=github-releases depName=ImageMagick/ImageMagick versioning=loose
version: "7.1.2-33"
npm: "@ai-ecoverse/wasm-imagemagick-heif"
summary: "ImageMagick magick CLI with HEIC/HEIF/AVIF through libheif (optional, HEVC)"
source:
  url: "https://github.com/ImageMagick/ImageMagick/archive/refs/tags/{{version}}.tar.gz"
  sha256: "c768ff077cccff1b682aa56653b54247b268752427ca998992b24cc7c597d9e7"
dependencies:
  build:
    - "@ai-ecoverse/wasm-zlib@1.3.1-2"
    - "@ai-ecoverse/wasm-libjpeg-turbo@3.1.2"
    - "@ai-ecoverse/wasm-libpng@1.6.59-1"
    - "@ai-ecoverse/wasm-lcms2@2.19.1-1"
    - "@ai-ecoverse/wasm-libtiff@4.7.2-1"
    - "@ai-ecoverse/wasm-libwebp@1.5.0-1"
    - "@ai-ecoverse/wasm-openjpeg@2.5.3"
    - "@ai-ecoverse/wasm-freetype@2.13.3-1"
    - "@ai-ecoverse/wasm-libxml2@2.15.4-1"
    - "@ai-ecoverse/wasm-libiconv@1.18.0-1"
    - "@ai-ecoverse/wasm-libheif@1.23.6-1"
  host: []
  run: []
about:
  homepage: https://github.com/ai-ecoverse/homescoop/tree/main/packages/imagemagick-heif
  license: ImageMagick AND LGPL-3.0-or-later AND BSD-2-Clause
  notes: |
    homescoop#304. The packages/imagemagick build with --with-heic, linked
    statically against @ai-ecoverse/wasm-libheif (libheif, libde265 HEVC,
    dav1d AV1). Same version line and commands as wasm-imagemagick.
    Optional, never in a base set: HEVC is patent-encumbered.
    wasm-imagemagick cannot pick the delegate up at run time: it is a
    static Emscripten build (--without-modules), and slicc-kernel only has
    a dynamic linker for WASIX programs, so the HEIC delegate needs its own
    build. Keep version and dependencies in step with packages/imagemagick.
    Relinking (LGPL): the libheif/libde265 static libraries are those
    published in @ai-ecoverse/wasm-libheif; this package ships magick's own
    objects in share/imagemagick-heif/relink (README).
    7.1.2-33-1 ships a resource policy sized for a browser tab as the
    default (packages/imagemagick/policy-tab.xml in etc/ImageMagick-7:
    memory 768MiB, map 512MiB, disk 512MiB, area 64MP, width/height 16KP),
    and upstream's policy-open.xml in etc/ImageMagick-7-open, used by the
    magick-open command or MAGICK_CONFIGURE_PATH. delegates.xml has no
    inkscape or rsvg-convert entries.
