name: imagemagick-heif
builder: host
# Shared with packages/imagemagick: build.sh copies its policy-tab.xml and
# applies its patches, and cert/ re-exports its specs and uses its cert/lib.
inputs:
  - packages/imagemagick/policy-tab.xml
  - packages/imagemagick/cert/**
  - packages/imagemagick/*.patch
# renovate: datasource=github-releases depName=ImageMagick/ImageMagick versioning=loose
version: "7.1.2-34"
npm: "@ai-ecoverse/wasm-imagemagick-heif"
summary: "ImageMagick magick CLI with HEIC/HEIF/AVIF through libheif (optional, HEVC)"
source:
  url: "https://github.com/ImageMagick/ImageMagick/archive/refs/tags/{{version}}.tar.gz"
  sha256: "f5163a573a1c1bff16358d0a592b2fb168ad0fd3b9dc5ff57dc7820eebc5cf79"
dependencies:
  build:
    - "@ai-ecoverse/wasm-zlib@1.3.1-4"
    - "@ai-ecoverse/wasm-libjpeg-turbo@3.1.2-4"
    - "@ai-ecoverse/wasm-libpng@1.6.59-3"
    - "@ai-ecoverse/wasm-lcms2@2.19.1-3"
    - "@ai-ecoverse/wasm-libtiff@4.7.2-3"
    - "@ai-ecoverse/wasm-libwebp@1.6.0-2"
    - "@ai-ecoverse/wasm-openjpeg@2.5.3-1"
    - "@ai-ecoverse/wasm-freetype@2.13.3-3"
    - "@ai-ecoverse/wasm-libxml2@2.15.4-2"
    - "@ai-ecoverse/wasm-libiconv@1.19.0-2"
    - "@ai-ecoverse/wasm-libheif@1.23.6-4"
  host: []
  run: []
about:
  homepage: https://github.com/ai-ecoverse/homescoop/tree/main/packages/imagemagick-heif
  license: ImageMagick AND LGPL-3.0-or-later AND BSD-2-Clause
  notes: |
    homescoop#304. The packages/imagemagick build with --with-heic, linked
    statically against @ai-ecoverse/wasm-libheif (libheif, libde265 HEVC,
    dav1d AV1). Same version line and commands as wasm-imagemagick.
    Optional, never in a base set: HEVC is patent-encumbered.
    wasm-imagemagick cannot pick the delegate up at run time: it is a
    static Emscripten build (--without-modules), and slicc-kernel only has
    a dynamic linker for WASIX programs, so the HEIC delegate needs its own
    build. Keep version and dependencies in step with packages/imagemagick.
    Relinking (LGPL): the libheif/libde265 static libraries are those
    published in @ai-ecoverse/wasm-libheif; this package ships magick's own
    objects in share/imagemagick-heif/relink (README).
    7.1.2-33-1 ships a resource policy sized for a browser tab as the
    default (packages/imagemagick/policy-tab.xml in etc/ImageMagick-7:
    memory 1536MiB, map 256MiB, disk 0, area 64MP, width/height 16KP),
    and upstream's policy-open.xml in etc/ImageMagick-7-open, used by the
    magick-open command or MAGICK_CONFIGURE_PATH. delegates.xml has no
    inkscape or rsvg-convert entries.
    7.1.2-34-1: upstream -34 fixes in-place mogrify without -format/-path
    (homescoop#353, ImageMagick#9011). The tab policy no longer spills the
    pixel cache to disk (homescoop#356: with disk 512MiB a 48 MP resize
    went to the disk cache and hung for minutes): memory 1536MiB, map
    256MiB (memory + map 1.75 GiB, under the build's 2 GiB maximum
    memory), disk 0.
    7.1.2-34-2: tab policy width/height 64KP, not 16KP (homescoop#445,
    panoramas). magick.wasm keeps its name section and line tables
    (homescoop#396): utilities/magick is a C++ link, and CXXFLAGS -g1
    stripped both; it is -g now, as wasm-imagemagick's default, and
    relink.sh links with -g too. build.sh configures again a $WORK tree
    configured with other delegates or built with other flags (a
    .homescoop-build stamp), and checks the delegates outside the skip
    (homescoop#350).
    7.1.2-34-3: webp-check-size-before-open.patch (homescoop#585). WebP
    holds at most 16383 px a side, and upstream's writer truncated the
    output before refusing a wider image, so an in-place write such as
    magick w.webp -resize 200% w.webp destroyed the input (reachable from
    plain magick since the 64KP policy of -34-2). The writer now refuses
    before opening the file. cert/inplace-webp.mjs.
    7.1.2-34-4: relink.sh takes any kit archive from the directory it is
    given, as wasm-imagemagick's does (homescoop#594): libiconv.a, the slicc
    shims and the Magick archives, besides libheif, libde265 and dav1d.
    relink-check overrides libiconv.a (published wasm-libiconv),
    libslicc_cred.a and libMagickCore and requires all three to be used.
    7.1.2-34-5 (homescoop#593): name section without DWARF (CXXFLAGS -g2),
    and the relink kit moves into @ai-ecoverse/wasm-imagemagick-relink
    (share/imagemagick-heif/relink there), as for wasm-imagemagick.
    7.1.2-34-6 (homescoop#678): as wasm-imagemagick, package.json
    homescoop.relink and the notices name the relink package of exactly
    this version, and the relink package's check binds its kit to this
    version's bin/magick.wasm.
