# CPython 3.15 for slicc WASIX (abi=wasi, no Emscripten glue).
# Becomes `python` / `python3` in SLICC's GNU bash. Recipe: HOMESCOOP-5e.md.
name: wasix-python3.15
builder: host
# renovate: datasource=python-version
version: "3.15.0"
npm: "@ai-ecoverse/wasix-python"
npm-tag: "python3.15"
summary: "CPython 3.15 for slicc WASIX (commands python, python3)"
source:
  url: "https://www.python.org/ftp/python/{{version}}/Python-{{version}}.tgz"
  sha256: "438596cac081036d3c1d532ab7e7335eeb35567bc961749a0d5797176db0db68"
sources:
  # homescoop#181 cross-build inputs. Dev packages pinned by the certified
  # tarball sha; lib-pic/ is linked into the dynamic-main python.wasm
  # (wasix-openssl 3.5.9-3+: OPENSSL_THREADS, which CPython requires; 3.5.9-4 and
  # wasix-zlib 1.3.1-3 are built on wasix-sysroot -34 since 3.14.2-27).
  wasix_zlib:
    url: "https://registry.npmjs.org/@ai-ecoverse/wasix-zlib/-/wasix-zlib-1.3.1-3.tgz"
    sha256: "f55d56c0837722e5d1e309f4344f723c95c7f68cd3ddb3089d6b4c025aaf14c7"
  wasix_openssl:
    url: "https://registry.npmjs.org/@ai-ecoverse/wasix-openssl/-/wasix-openssl-3.5.9-4.tgz"
    sha256: "47629bd4e1f53ee1aa32e3ef150cd744c4eb242632f8bad2818c631aa6c645b7"
  # Built inside this recipe as static PIC archives (no other WASIX consumer
  # yet); same upstream pins as packages/bzip2, xz, sqlite3, ncurses-utils.
  bzip2:
    url: "https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz"
    sha256: "ab5a03176ee106d3f0fa90e381da478ddae405918153cca248e682cd0c4a2269"
  xz:
    url: "https://github.com/tukaani-project/xz/releases/download/v5.8.4/xz-5.8.4.tar.xz"
    sha256: "4ce24038fd4221e0d13bc1a2de7a4db56e90b92b3bf75321f6c14be73f65de4b"
  sqlite:
    url: "https://www.sqlite.org/2026/sqlite-amalgamation-3540000.zip"
    sha256: "68e913b0fe8ec6b4e5f391c594a28872884e80d6cd042a1e50c957be46b5aa4d"
  readline:
    url: "https://ftp.gnu.org/gnu/readline/readline-8.3.tar.gz"
    sha256: "fe5383204467828cd495ee8d1d3c037a7eba1389c22bc6a041f627976f9061cc"
  ncurses:
    url: "https://mirrors.kernel.org/gnu/ncurses/ncurses-6.5.tar.gz"
    sha256: "136d91bc269a9a5785e5f9e980bc76ab57428f604ce3e5a5a90cebc767971cc6"
  # wasix-org/libffi @ 09cbf7d (wasm32 WASIX backend: wasix_call_dynamic / closures).
  # GitHub archive has no configure; build.sh runs autogen (host autoconf).
  libffi:
    url: "https://github.com/wasix-org/libffi/archive/09cbf7d66d232a01dbb0c88fd5ae65fa9c15f7c7.tar.gz"
    sha256: "7097de0f66f458c2bd44e0e021e449a2572692067f7136791bdd4788330de978"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://www.python.org
  # GNU Readline is linked statically.
  license: PSF-2.0 AND GPL-3.0-or-later
  notes: |
    WASIX CPython 3.15 dynamic-main on the pinned wasix-sysroot's sysroot-ehpic
    (legacy wasm EH, PIC; side modules by dlopen), cross-built from source
    in CI by build.sh (homescoop#181): host CPython from the same tarball,
    static PIC deps (bzip2, xz, sqlite, ncurses tinfo, readline, libffi;
    zlib and OpenSSL from wasix-zlib / wasix-openssl), modules found by
    configure (patches/cpython-configure-wasix.patch), asyncify onlylist for
    fork/posix_spawn, strip. No fork in bin/python.wasm; subprocess via
    posix_spawn. Since 3.14.2-25 a second configure + make with fork
    (HAVE_FORK, full asyncify) gives bin/python-fork.wasm, which
    PYTHON_FORK=true selects (slicc.commands variants, homescoop#357).
    `_ctypes` is built with wasix-org/libffi (MIT); import / CDLL / CFUNCTYPE
    need slicc-kernel ≥ 1.51.0 (#306/#316: call_dynamic, closure_*,
    dlopen(NULL)/own path = main).
    The sysroot's libc has the setitimer (proc_raise_interval2) and
    clock_nanosleep EINTR patches (patches/wasix-libc-*.patch); advisory
    locks are --wrap stubs; user ids and pwd/grp come from the sysroot's libc
    (slicc-kernel process credentials, -20). The C++
    runtime side modules import (libc++/libc++abi/libunwind) is upstream
    wasix-libc v2026-07-03.1 sysroot-ehpic, as in -11 (README "Side modules").
    stdlib/ adds sys.executable from PATH and puts py-* packages from python's
    npm/pnpm project and pnpm's global projects on sys.path (_slicc_site.py,
    sitecustomize.py, site-packages/slicc-executable.pth).
