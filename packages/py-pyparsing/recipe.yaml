name: py-pyparsing
builder: host
version: "3.3.3"
npm: "@ai-ecoverse/py-pyparsing"
summary: "pyparsing for slicc WASIX CPython"
# 3.3.3-2 is packaging-only: 3.3.3-1's bytes with exact @ai-ecoverse pins
# (wasix-python 3.14.2-11). Drop repack: when the next release rebuilds.
repack:
  from: "3.3.3-1"
dependencies:
  build: []
  host: []
  run:
    - wasix-python
about:
  license: MIT
  notes: |
    Pure-Python wheel staged into lib/python3.14/site-packages.
    slicc.python.sitePackages only (no abi/platform requires).
