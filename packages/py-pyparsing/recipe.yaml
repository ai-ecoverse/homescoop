name: py-pyparsing
builder: host
version: "3.3.3"
npm: "@ai-ecoverse/py-pyparsing"
summary: "pyparsing for slicc WASIX CPython"
# 3.3.3-7 is packaging-only: 3.3.3-6's bytes with wasix-python as a range,
# ">=3.14.2-16 <3.14.3" (#702). Drop repack: when the next release rebuilds.
repack:
  from: "3.3.3-6"
dependencies:
  build: []
  host: []
  run:
    - wasix-python
about:
  license: MIT
  notes: |
    Pure-Python wheel staged into lib/python3.14/site-packages.
    slicc.python.sitePackages only (no abi/platform requires).
