# procps-ng for slicc wasm realm (ps/pgrep/pkill/free/uptime against /proc).
name: procps
builder: host
# renovate: datasource=git-tags depName=https://gitlab.com/procps-ng/procps.git extractVersion=^v(?<version>.*)$
version: "4.0.7"
npm: "@ai-ecoverse/wasm-procps"
summary: "procps-ng (ps, pgrep, pkill, free, uptime, …) for slicc"
source:
  url: "https://downloads.sourceforge.net/project/procps-ng/Production/procps-ng-{{version}}.tar.xz"
  sha256: "9d2021f47a4501c667862c9942a92d1953694b21d11bcd1702e83eb594e3d67d"
dependencies:
  build: []
  host: []
  run: []
about:
  homepage: https://gitlab.com/procps-ng/procps
  license: GPL-2.0-or-later
  notes: |
    Host ladder, slicc cli profile (spawn+exec). Built --without-ncurses so
    top/watch/slabtop are omitted (no standalone ncurses package). Needs
    slicc-kernel /proc (per-pid + uptime/meminfo/loadavg/stat); certify against
    a #66-era kernel prerelease until that ships. New package → human cert,
    not Renovate automerge.
    4.0.6+ pgrep/pkill use pidfd_open / pidfd_send_signal / process_mrelease
    through raw syscall(2), which wasm lacks: pgrep-wasm-no-pidfd.patch makes
    them fail with ENOSYS, so pkill signals with kill() / sigqueue() (the
    Linux < 5.3 path) and --mrelease reports that pidfd_open failed. 4.0.6
    also reads /proc/<pid>/* through openat on a /proc/<pid> dirfd.
