[package]
name = "wasi-hf"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
description = "hf download and hf auth for slicc's kernel: Hugging Face Hub downloads over wasix-net"
publish = false

[[bin]]
name = "hf"
path = "src/main.rs"

# build.sh copies this crate to its work directory and vendors homescoop's
# crates/wasix-net next to it (homescoop_vendor_crates), so the path only
# exists there.
[dependencies]
wasix-net = { path = "homescoop-crates/wasix-net" }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = 0
