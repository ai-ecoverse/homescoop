# The one homescoop workflow. npm trusted publishing is bound to this file
# name (fledgling.workflow in package.json, PUBLISH_WORKFLOWS in
# scripts/cert-review/repack-input.mjs), so everything CI does lives here:
#
#   pull_request   detect the touched recipes and host-build only those
#                  (recipe-sha, host-build, rebuild, reproducible, npm-parity,
#                  test, cert), the shims/crates checks when touched, then
#                  slicc-shared-web's pipeline: lint, scripts/test, and the
#                  Claude + Codex review with the built tarballs loaded into
#                  its four browsers (scripts/review-browser.mjs). `ci` is the
#                  one required check and needs every job, the review included.
#   merge_group    the pipeline's lint and tests, and `group`
#                  (scripts/merge-group-check.mjs): each queued PR's artifact
#                  still binds to the group head. Builds nothing.
#   push to main   publish: each publishable package the push touched, from
#                  the host-<pkg>-prN artifact of its PR's green run
#                  (scripts/ladder-merge-resolve.mjs), over OIDC; and
#                  close-listed-issues.
#   dispatch       the same publish for named packages, on main only.
#   issues/hourly  issue-labels.
#
# See docs/ladder-builds.md.
name: ladder-build

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  issues:
    types: [opened]
  schedule:
    - cron: '23 * * * *'
    - cron: '47 5 * * *'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Publish these recipe dirs (comma-separated) from the green PR runs that last changed them on main. Empty: the packages the dispatched commit touched.'
        required: false
        default: ''
        type: string
      npm_loglevel:
        description: 'Trace the npm publish: http, timing (http plus npm timing lines) or verbose. Empty leaves npm at its own log level.'
        required: false
        default: ''
        type: string
      agent_loop_rounds:
        description: 'Run the stress/wasi-pnpm-agent loop (agent-loop job) with this many pnpm installs; the daily run does 8. Empty: no loop.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# A newer push to a PR cancels its older run. Every other run (a merge group,
# a push to main that publishes, a dispatch) has a group of its own, so
# nothing queued behind it is ever dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    if: contains(fromJSON('["pull_request", "merge_group", "push", "workflow_dispatch"]'), github.event_name)
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'merge_group') && vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    outputs:
      host: ${{ steps.d.outputs.host }}
      rebuild: ${{ steps.d.outputs.rebuild }}
      test: ${{ steps.d.outputs.test }}
      pool: ${{ steps.d.outputs.pool }}
      shims: ${{ steps.d.outputs.shims }}
      crates: ${{ steps.d.outputs.crates }}
      release: ${{ steps.d.outputs.release }}
      base: ${{ steps.d.outputs.base }}
      sha: ${{ steps.d.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: The root package.json's cert kernel is certified (docs/ci-cert.md)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/gate.mjs check-cert-kernel -- node scripts/check-cert-kernel.mjs
      - id: d
        name: What this event touches
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
          ONLY: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          HEAD=$(git rev-parse HEAD)
          case "$GITHUB_EVENT_NAME" in
            pull_request) BASE="$PR_BASE"; HEAD="$PR_HEAD" ;;
            merge_group) BASE=$(git merge-base "$GROUP_BASE" "$HEAD") ;;
            push) if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then BASE=$(git rev-parse "$HEAD^"); else BASE="$BEFORE"; fi ;;
            *) BASE=$(git rev-parse "$HEAD^") ;;
          esac
          json() { node -e 'console.log(JSON.stringify(JSON.parse(process.argv[1])[process.argv[2]]))' "$1" "$2"; }
          HOSTS='[]' REBUILD='[]' TEST='[]' POOL='[]' SHIMS=false CRATES=false RELEASE='[]'
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            CLASS=$(node scripts/classify-touched-packages.mjs --base "$BASE" --head "$HEAD")
            echo "$CLASS"
            HOSTS=$(json "$CLASS" host) REBUILD=$(json "$CLASS" rebuild) TEST=$(json "$CLASS" test) POOL=$(json "$CLASS" pool)
            CHANGED=$(git diff --name-only "$BASE...$HEAD")
            grep -qE '^(shims/slicc/|scripts/(build-common|install-emsdk|test-install-emsdk)\.sh$|scripts/emsdk-patches/)' <<< "$CHANGED" && SHIMS=true
            grep -qE '^(crates/|scripts/build-common\.sh$)' <<< "$CHANGED" && CRATES=true
          elif [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ -n "$ONLY" ]]; then
              PKGS=$(node -e 'const p=process.argv[1].split(",").map((s)=>s.trim()).filter(Boolean); if(!p.every((x)=>/^[a-z0-9][a-z0-9._-]*$/.test(x))) process.exit(1); console.log(JSON.stringify(p))' "$ONLY")
              BASE=$(git rev-list --max-parents=0 HEAD | tail -1)
            else
              PKGS=$(node scripts/list-touched-packages.mjs --base "$BASE" --head "$HEAD" --json --publishable)
            fi
            RELEASE=$(node -e '
              const fs = require("fs");
              const out = JSON.parse(process.argv[1]).map((p) => {
                const f = `packages/${p}/package/package.json`;
                if (!fs.existsSync(f)) throw new Error(`${p}: no ${f}`);
                return { package: p, npm: JSON.parse(fs.readFileSync(f, "utf8")).name };
              });
              console.log(JSON.stringify(out));' "$PKGS")
          fi
          {
            echo "host=$HOSTS"
            echo "rebuild=$REBUILD"
            echo "test=$TEST"
            echo "pool=$POOL"
            echo "shims=$SHIMS"
            echo "crates=$CRATES"
            echo "release=$RELEASE"
            echo "base=$BASE"
            echo "sha=$HEAD"
          } | tee -a "$GITHUB_OUTPUT"

  recipe-sha:
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.host != '[]'
    # Same-repo heads on the light pool; a fork head's refresh-recipe-sha.mjs runs hosted.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      # --verify-repack: repack recipes' pins are checked here once per PR
      # (never rewritten; #730); the build steps below skip them.
      - name: Download expanded source URLs and write sha256
        env:
          HOST: ${{ needs.detect.outputs.host }}
          GH_TOKEN: ${{ github.token }}
          RECIPE_SHA_BASE: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail
          # This job runs the PR head's own refresh-recipe-sha.mjs, so a branch from before #1019
          # has one that prints no verdict line. Wrap it only when it does.
          gate=()
          if [[ -f scripts/gate.mjs ]] && grep -q 'recipe-sha: PASS' scripts/refresh-recipe-sha.mjs; then
            gate=(node scripts/gate.mjs recipe-sha --)
          else
            echo "::warning::recipe-sha: this branch's refresh-recipe-sha.mjs predates the verdict line (#1019); merge main to get the wrapped check"
          fi
          reroll=()
          if grep -q 'recipe-sha: REROLL' scripts/refresh-recipe-sha.mjs; then
            reroll=(--ci-reroll --keep-pin)
          fi
          node -e 'JSON.parse(process.env.HOST).forEach((p) => console.log(p))' | while read -r pkg; do
            log=$(mktemp)
            ${gate[@]+"${gate[@]}"} node scripts/refresh-recipe-sha.mjs "$pkg" --verify-repack --verify-tree ${reroll[@]+"${reroll[@]}"} | tee "$log"
            rerolls=$(grep -c '^   re-roll: ' "$log" || true)
            verdicts=$(grep -c '^recipe-sha: REROLL ' "$log" || true)
            if [[ "$rerolls" != "$verdicts" ]]; then
              echo "::error::recipe-sha: $rerolls re-roll(s) but $verdicts REROLL verdict line(s) for $pkg"
              exit 1
            fi
          done
      # Renovate bumps only recipe.yaml; check-package-meta wants the
      # committed package.json version to be the one the build stages.
      - name: Sync package.json version from recipe
        env:
          HOST: ${{ needs.detect.outputs.host }}
        run: |
          set -euo pipefail
          node -e 'JSON.parse(process.env.HOST).forEach((p) => console.log(p))' | while read -r pkg; do
            node scripts/sync-package-version.mjs "$pkg" --write
          done
          # The root README package table is generated from package.json (#639).
          node scripts/readme-table.mjs --write
      - name: The PR branch already carries its sha256 and package version, or the check fails with the command that writes them
        env:
          HOST: ${{ needs.detect.outputs.host }}
        run: |
          set -euo pipefail
          if git diff --quiet -- 'packages/*/recipe.yaml' 'packages/*/package/package.json' 'packages/*/package/README.md' README.md; then
            echo "recipe-sha: PASS the branch carries its sha256, package versions and README table"
            exit 0
          fi
          git diff -- 'packages/*/recipe.yaml' 'packages/*/package/package.json' 'packages/*/package/README.md' README.md
          stale=0
          while read -r pkg; do
            if ! git diff --quiet -- "packages/$pkg/recipe.yaml" "packages/$pkg/package/package.json" "packages/$pkg/package/README.md"; then
              echo "recipe-sha: FAIL $pkg: needs refresh: node scripts/refresh-recipe-sha.mjs $pkg && node scripts/sync-package-version.mjs $pkg --write && node scripts/readme-table.mjs --write"
              stale=$((stale + 1))
            fi
          done < <(node -e 'JSON.parse(process.env.HOST).forEach((p) => console.log(p))')
          if [ "$stale" = 0 ] && ! git diff --quiet -- README.md; then
            echo "recipe-sha: FAIL README.md: needs refresh: node scripts/readme-table.mjs --write"
          fi
          echo "::error::recipe sha256 / package version / README package table is stale; CI never pushes to a pull request. Run the command on each 'recipe-sha: FAIL' line above, commit and push"
          exit 1

  host-build:
    needs: [detect, recipe-sha]
    if: github.event_name == 'pull_request' && needs.detect.outputs.host != '[]' && needs.recipe-sha.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.host) }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJson(needs.detect.outputs.pool), matrix.package)) && vars.CERT_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Refresh source sha256 in this checkout
        env:
          PKG: ${{ matrix.package }}
        run: |
          set -euo pipefail
          log=$(mktemp)
          if [[ -f scripts/gate.mjs ]] && grep -q 'recipe-sha: REROLL' scripts/refresh-recipe-sha.mjs; then
            node scripts/gate.mjs recipe-sha -- node scripts/refresh-recipe-sha.mjs "$PKG" --ci-reroll | tee "$log"
          else
            node scripts/refresh-recipe-sha.mjs "$PKG" | tee "$log"
          fi
          rerolls=$(grep -c '^   re-roll: ' "$log" || true)
          verdicts=$(grep -c '^recipe-sha: REROLL ' "$log" || true)
          if [[ "$rerolls" != "$verdicts" ]]; then
            echo "::error::recipe-sha: $rerolls re-roll(s) but $verdicts REROLL verdict line(s) for $PKG"
            exit 1
          fi
      - name: Sync npm version from recipe (Renovate bumps)
        run: node scripts/sync-package-version.mjs "${{ matrix.package }}" --write
      - name: Build from the hosted workspace path
        env:
          REPO: ${{ github.event.repository.name }}
        run: bash scripts/ladder-build-root.sh host "${{ matrix.package }}" >> "$GITHUB_ENV"
      - name: Host build (no publish)
        run: |
          set -euo pipefail
          cd "$HOMESCOOP_BUILD_ROOT"
          bash scripts/host-run.sh "${{ matrix.package }}"
          ls -la .homescoop-out/package.tgz
      - name: Assert packed version is npm-publishable semver
        run: |
          set -euo pipefail
          # Fail in CI before browser-cert / human handoff — npm pack accepts
          # two-part forms like 2.23-1 that npm publish rejects.
          ver=$(node scripts/sync-package-version.mjs --assert-tarball .homescoop-out/package.tgz)
          echo "packed version $ver (npm semver OK)"
      - name: Link/run smoke.c against PREFIX
        run: node scripts/gate.mjs host-smoke -- bash scripts/host-smoke.sh "${{ matrix.package }}"
      - name: Record tarball sha256
        run: sha256sum .homescoop-out/package.tgz | tee .homescoop-out/package.tgz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: host-${{ matrix.package }}-pr${{ github.event.pull_request.number }}
          path: |
            .homescoop-out/package.tgz
            .homescoop-out/package.tgz.sha256
            .homescoop-out/packaging-only-diff.txt
          if-no-files-found: error
          retention-days: 14
      - if: always()
        continue-on-error: true
        uses: ai-ecoverse/slicc-shared-web/.github/actions/memory-peak@v1.28.0

  rebuild:
    needs: [detect, recipe-sha]
    if: github.event_name == 'pull_request' && needs.detect.outputs.rebuild != '[]' && needs.recipe-sha.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.rebuild) }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJson(needs.detect.outputs.pool), matrix.package)) && vars.CERT_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Refresh source sha256 in this checkout
        env:
          PKG: ${{ matrix.package }}
        run: |
          set -euo pipefail
          log=$(mktemp)
          if [[ -f scripts/gate.mjs ]] && grep -q 'recipe-sha: REROLL' scripts/refresh-recipe-sha.mjs; then
            node scripts/gate.mjs recipe-sha -- node scripts/refresh-recipe-sha.mjs "$PKG" --ci-reroll | tee "$log"
          else
            node scripts/refresh-recipe-sha.mjs "$PKG" | tee "$log"
          fi
          rerolls=$(grep -c '^   re-roll: ' "$log" || true)
          verdicts=$(grep -c '^recipe-sha: REROLL ' "$log" || true)
          if [[ "$rerolls" != "$verdicts" ]]; then
            echo "::error::recipe-sha: $rerolls re-roll(s) but $verdicts REROLL verdict line(s) for $PKG"
            exit 1
          fi
      - name: Sync npm version from recipe (Renovate bumps)
        run: node scripts/sync-package-version.mjs "${{ matrix.package }}" --write
      # Another directory (a real copy), WORK and user name than host-build's,
      # so reproducible proves path independence (#668); a recipe known to
      # embed its path sets reproducible.same_path: <issue>.
      - name: Build from a second workspace path
        env:
          REPO: ${{ github.event.repository.name }}
        run: bash scripts/ladder-build-root.sh rebuild "${{ matrix.package }}" >> "$GITHUB_ENV"
      - name: Second host build (recipe reproducible)
        run: |
          set -euo pipefail
          cd "$HOMESCOOP_BUILD_ROOT"
          bash scripts/host-run.sh "${{ matrix.package }}"
          sha256sum .homescoop-out/package.tgz | tee .homescoop-out/package.tgz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: rebuild-${{ matrix.package }}-pr${{ github.event.pull_request.number }}
          path: |
            ${{ env.HOMESCOOP_BUILD_ROOT }}/.homescoop-out/package.tgz
            ${{ env.HOMESCOOP_BUILD_ROOT }}/.homescoop-out/package.tgz.sha256
          if-no-files-found: error
          retention-days: 3
      - if: always()
        continue-on-error: true
        uses: ai-ecoverse/slicc-shared-web/.github/actions/memory-peak@v1.28.0

  reproducible:
    needs: [detect, recipe-sha, host-build, rebuild]
    if: ${{ !cancelled() && needs.detect.outputs.rebuild != '[]' && needs.recipe-sha.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.rebuild) }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: actions/download-artifact@v8
        with:
          name: host-${{ matrix.package }}-pr${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/one
      - uses: actions/download-artifact@v8
        with:
          name: rebuild-${{ matrix.package }}-pr${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/two
      - name: Both builds are byte-identical
        env:
          PKG: ${{ matrix.package }}
        run: |
          set -euo pipefail
          one="$RUNNER_TEMP/one/package.tgz"
          two="$RUNNER_TEMP/two/package.tgz"
          what=$(node scripts/read-recipe.mjs "$PKG" --field reproducible.path)
          if [[ -z "$what" ]]; then
            what=package.tgz
            a=$(sha256sum "$one" | cut -d' ' -f1)
            b=$(sha256sum "$two" | cut -d' ' -f1)
          else
            a=$(tar -xOzf "$one" "$what" | sha256sum | cut -d' ' -f1)
            b=$(tar -xOzf "$two" "$what" | sha256sum | cut -d' ' -f1)
          fi
          printf '%s: %s\n  host-build %s\n  rebuild    %s\n' "$PKG" "$what" "$a" "$b" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$a" == "$b" ]]; then
            echo "$PKG: $what is reproducible"
            exit 0
          fi
          for n in one two; do
            mkdir -p "$RUNNER_TEMP/$n/x"
            tar -xzf "$RUNNER_TEMP/$n/package.tgz" -C "$RUNNER_TEMP/$n/x"
            (cd "$RUNNER_TEMP/$n/x" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/$n/files.txt"
          done
          diff "$RUNNER_TEMP/one/files.txt" "$RUNNER_TEMP/two/files.txt" || true
          echo "::error::$PKG: $what differs between host-build ($a) and rebuild ($b); the build is not reproducible"
          exit 1

  npm-parity:
    needs: [detect, recipe-sha, host-build]
    if: ${{ !cancelled() && needs.detect.outputs.host != '[]' && needs.recipe-sha.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.host) }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: actions/download-artifact@v8
        with:
          name: host-${{ matrix.package }}-pr${{ github.event.pull_request.number }}
          path: .homescoop-out
      - name: The built version against npm (behind its npm-tag, or the same version with other contents, fails)
        run: |
          set -euo pipefail
          tag=$(node scripts/npm-tag.mjs "${{ matrix.package }}")
          node scripts/gate.mjs npm-parity -- node scripts/npm-parity.mjs .homescoop-out/package.tgz --tag "$tag" --drift fail
      - name: A threaded bulk-memory module records its sized initial heap (homescoop#1287)
        run: node scripts/gate.mjs threaded-heap -- node scripts/check-threaded-heap.mjs "${{ matrix.package }}" .homescoop-out/package.tgz
      - name: Build inputs, the root rule (a build fetches its pinned source; a repack traces to an attested or reproduced build)
        env:
          GH_TOKEN: ${{ github.token }}
          PKG: ${{ matrix.package }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          npm_name=$(tar -xzOf .homescoop-out/package.tgz package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
          node scripts/gate.mjs repack-input -- node scripts/cert-review/repack-input.mjs \
            --package "$PKG" --ref "$HEAD" --repo "$GITHUB_REPOSITORY" --npm "$npm_name"

  test:
    needs: [detect, recipe-sha, host-build]
    if: ${{ !cancelled() && needs.detect.outputs.test != '[]' && needs.recipe-sha.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.test) }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJson(needs.detect.outputs.pool), matrix.package)) && vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: actions/download-artifact@v8
        with:
          name: host-${{ matrix.package }}-pr${{ github.event.pull_request.number }}
          path: .homescoop-out
      - name: Unpack the built package/ from package.tgz
        run: tar -xzf .homescoop-out/package.tgz -C "packages/${{ matrix.package }}"
      - name: Unit tests (test/*.test.mjs)
        working-directory: packages/${{ matrix.package }}
        run: |
          set -euo pipefail
          if ! compgen -G 'test/*.test.mjs' >/dev/null; then
            echo "no test/*.test.mjs"
            exit 0
          fi
          node --test 'test/*.test.mjs'
      - name: End-to-end tests (test/package.json)
        working-directory: packages/${{ matrix.package }}
        run: |
          set -euo pipefail
          if [[ ! -f test/package.json ]]; then
            echo "no test/package.json"
            exit 0
          fi
          cd test
          npm ci --no-audit --no-fund
          if node -e 'process.exit(require("./package.json").scripts?.["test:e2e"] ? 0 : 1)'; then
            npm run test:e2e
          else
            node --test 'e2e/*.test.mjs'
          fi
      - if: always()
        continue-on-error: true
        uses: ai-ecoverse/slicc-shared-web/.github/actions/memory-peak@v1.28.0

  cert:
    needs: [detect, recipe-sha, host-build]
    if: ${{ !cancelled() && needs.detect.outputs.host != '[]' && needs.recipe-sha.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.host) }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && vars.CERT_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: actions/download-artifact@v8
        with:
          name: host-${{ matrix.package }}-pr${{ github.event.pull_request.number }}
          path: .homescoop-out
      - name: Check package.tgz against package.tgz.sha256
        env:
          ART: host-${{ matrix.package }}-pr${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          for f in package.tgz package.tgz.sha256; do
            if [[ ! -f ".homescoop-out/$f" ]]; then
              echo "::error::$ART has no $f; the cert fails closed"
              exit 1
            fi
          done
          line=$(cat .homescoop-out/package.tgz.sha256)
          re='^([0-9a-f]{64}) '
          if [[ "$line" == *$'\n'* || ! "$line" =~ $re ]]; then
            echo "::error::$ART: package.tgz.sha256 is not one sha256sum line; the cert fails closed"
            exit 1
          fi
          want=${BASH_REMATCH[1]}
          got=$(sha256sum .homescoop-out/package.tgz | cut -d' ' -f1)
          if [[ "$got" != "$want" ]]; then
            echo "::error::$ART: package.tgz sha256 $got does not match package.tgz.sha256 ($want); the cert fails closed"
            exit 1
          fi
          echo "$ART: package.tgz sha256 $got matches package.tgz.sha256"
      - id: plan
        name: What this cert leg certifies
        run: |
          set -euo pipefail
          PROBE="${RUNNER_TEMP}/bcert-probe"
          mkdir -p "$PROBE"
          tar -xzf .homescoop-out/package.tgz -C "$PROBE" package/package.json
          node scripts/gate.mjs cert-leg -- node scripts/browser-cert/cert-leg.mjs plan "${{ matrix.package }}" --manifest "$PROBE/package/package.json" >> "$GITHUB_OUTPUT"
      # cert/meta.json "peers": the host-<peer>-prN artifacts of this run, for
      # ci commands that check the package against them (homescoop#678). A
      # peer not built in this run has no artifact; the ci command then falls
      # back to the registry, and fails when that has no such version either.
      - name: Peer artifacts of this run (cert/meta.json peers)
        if: steps.plan.outputs.peers != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: host-@(${{ steps.plan.outputs.peers }})-pr${{ github.event.pull_request.number }}
          path: .homescoop-out/peers
      - name: Browser cert (slicc-kernel CDP)
        if: steps.plan.outputs.browser == 'run'
        run: |
          set -euo pipefail
          CERT_NM="${RUNNER_TEMP}/homescoop-browser-cert-nm"
          mkdir -p "$CERT_NM"
          KERNEL_SPEC=$(node scripts/gate.mjs cert-kernel -- node scripts/browser-cert/cert-kernel.mjs "${{ matrix.package }}")
          SHARED_WEB=$(node scripts/gate.mjs dev-pin -- node scripts/dev-pin.mjs slicc-shared-web-cert)
          PLAYWRIGHT=$(node scripts/gate.mjs dev-pin -- node scripts/dev-pin.mjs playwright-core)
          MONOCART=$(node scripts/gate.mjs dev-pin -- node scripts/dev-pin.mjs monocart-coverage-reports)
          [[ -n "$KERNEL_SPEC" && -n "$SHARED_WEB" && -n "$PLAYWRIGHT" && -n "$MONOCART" ]] || { echo "::error::browser-cert: an empty kernel, shared-web, playwright or monocart pin"; exit 1; }
          echo "browser-cert: harness $SHARED_WEB $PLAYWRIGHT (package.json devDependencies)"
          npm install --prefix "$CERT_NM" --no-fund --no-audit \
            "$KERNEL_SPEC" \
            "$SHARED_WEB" \
            "$MONOCART" \
            "$PLAYWRIGHT"
          if [[ -f "packages/${{ matrix.package }}/cert/meta.json" ]]; then
            node -e '
              const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
              for (const n of j.needsInstall||j.needs||[]) console.log(n);
            ' "packages/${{ matrix.package }}/cert/meta.json" | while read -r dep; do
              [[ -n "$dep" ]] || continue
              npm install --prefix "$CERT_NM" --no-fund --no-audit "$dep"
            done
            node -e '
              const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
              for (const s of j.needsTarballScripts||[]) console.log(s);
            ' "packages/${{ matrix.package }}/cert/meta.json" | while read -r script; do
              [[ -n "$script" ]] || continue
              echo "browser-cert: needsTarballScript $script"
              tgz=$(node "$script" | head -1)
              npm install --prefix "$CERT_NM" --no-fund --no-audit "$tgz"
            done
            REPACK_TGZ=()
            while read -r peer; do
              [[ -n "$peer" ]] || continue
              out="${RUNNER_TEMP}/repack/${peer}"
              node scripts/repack-published.mjs "$peer" --out "$out" >/dev/null
              echo "browser-cert: needsRepack $peer $(node -p "require('./packages/${peer}/package/package.json').version") sha256 $(cut -d' ' -f1 "$out/package.tgz.sha256")"
              cp "$out/package.tgz" "${RUNNER_TEMP}/repack/${peer}.tgz"
              REPACK_TGZ+=("${RUNNER_TEMP}/repack/${peer}.tgz")
            done < <(node -e '
              const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
              for (const n of j.needsRepack||[]) console.log(n);
            ' "packages/${{ matrix.package }}/cert/meta.json")
            if [[ ${#REPACK_TGZ[@]} -gt 0 ]]; then
              npm install --prefix "$CERT_NM" --no-fund --no-audit "${REPACK_TGZ[@]}"
            fi
          fi
          if [ "$(id -u)" = 0 ] || sudo -n true 2>/dev/null; then
            npx --prefix "$CERT_NM" playwright-core install --with-deps chromium
          else
            echo "browser-cert: no root on $RUNNER_NAME (uid $(id -u), no sudo); the image brings Chromium's system libraries, installing the browser only"
            npx --prefix "$CERT_NM" playwright-core install chromium
          fi
          export HOMESCOOP_CERT_NODE_MODULES="$CERT_NM/node_modules"
          node scripts/gate.mjs cert-run -- node scripts/browser-cert/run.mjs \
            --package "${{ matrix.package }}" \
            --tarball .homescoop-out/package.tgz \
            --json "$RUNNER_TEMP/cert-report/browser-cert.json"
          # Glue by path on the dev-pin kernel when the cert kernel can't run it
          # (#628), and each cert/meta.json extra_kernels entry with specs (#663).
          node scripts/gate.mjs cert-leg -- node scripts/browser-cert/cert-leg.mjs browser-extra "${{ matrix.package }}" \
            --manifest "${RUNNER_TEMP}/bcert-probe/package/package.json" \
            --tarball .homescoop-out/package.tgz
      - name: Host cert (cert/meta.json ci commands)
        run: node scripts/gate.mjs cert-leg -- node scripts/browser-cert/cert-leg.mjs ci "${{ matrix.package }}"
      # The reviewers get this run's cert reports next to the tarballs (pipeline artifacts input).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cert-${{ matrix.package }}-pr${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/cert-report/
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        continue-on-error: true
        uses: ai-ecoverse/slicc-shared-web/.github/actions/memory-peak@v1.28.0

  # shims/slicc and the emsdk pin: the libc shims' own tests in the kernel.
  shims:
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.shims == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: shims/slicc/test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: build the test programs (pinned emsdk)
        run: |
          eval "$(bash ../../../scripts/install-emsdk.sh)"
          ./build.sh
      - run: npm ci
      - run: npm test

  emsdk-cache:
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.shims == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: bash scripts/test-install-emsdk.sh

  # crates/: the shared wasix crates on the host, in the kernel and as a consumer would vendor them.
  crates-host:
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.crates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.83.0', stable]
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install Rust ${{ matrix.toolchain }}
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy,rustfmt --target wasm32-wasip1
          rustup override set ${{ matrix.toolchain }}
      - name: tests
        run: cargo test --locked
      - name: format and lints
        if: matrix.toolchain == 'stable'
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --target wasm32-wasip1 -- -D warnings

  crates-kernel:
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.crates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-wasip1, wasm32-wasip1-threads]
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: install the ${{ matrix.target }} target
        run: rustup target add ${{ matrix.target }}
      - name: build the self-test
        run: |
          cargo build --locked --release -p wasix-selftest --target ${{ matrix.target }}
          ls -l target/${{ matrix.target }}/release/wasix-selftest.wasm
      - name: install slicc-kernel (pinned to the certified version)
        working-directory: crates/test
        run: npm ci --no-audit --no-fund
      - name: self-test in the kernel
        working-directory: crates/test
        env:
          WASIX_SELFTEST_WASM: ${{ github.workspace }}/crates/target/${{ matrix.target }}/release/wasix-selftest.wasm
        run: node --test --test-concurrency=1 'kernel/*.test.mjs'

  crates-consumer:
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.crates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install the wasm32-wasip1 target
        run: rustup target add wasm32-wasip1
      - name: vendor, build for WASI, check both graphs
        run: test/consumer-smoke.sh

  # Informational: one PR comment, updated in place, listing the open
  # `next-build` issues that name a touched package. Never blocks: not in
  # ci's needs, and continue-on-error (a fork PR's token can't comment).
  known-issues:
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Comment known next-build issues for touched packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/known-issues-comment.mjs \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}"

  # A merge group builds nothing: it checks that each queued PR's artifact
  # binds to the group head, the way the push will publish it.
  group:
    if: github.event_name == 'merge_group'
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Every queued PR's artifact binds to the group head
        env:
          GH_TOKEN: ${{ github.token }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: node scripts/merge-group-check.mjs --base "$GROUP_BASE" --head "$(git rev-parse HEAD)"

  # slicc-shared-web's pipeline, after the builds: lint (exact pins,
  # actionlint), scripts/test/*.test.mjs as the integration tests, and on a
  # pull request the Claude and Codex reviews. The reviewers get this run's
  # host-<pkg>-prN tarballs and cert reports (artifacts), and
  # scripts/review-browser.mjs loads them into the review browsers.
  pipeline:
    needs: [detect, recipe-sha, host-build, rebuild, reproducible, npm-parity, test, cert, shims, emsdk-cache, crates-host, crates-kernel, crates-consumer, group]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/pipeline.yml@v2.10.1
    secrets: inherit
    permissions:
      contents: write
      actions: read
      issues: write
      pull-requests: write
      statuses: write
      id-token: write
      attestations: write
    with:
      node-version: '26'
      runs-on: ${{ vars.CERT_RUNNER || 'ubuntu-latest' }}
      timeout-minutes: 30
      lint: |
        npm run lint
        # renovate: datasource=github-releases depName=rhysd/actionlint extractVersion=^v(?<version>.+)$
        ACTIONLINT=1.7.12
        bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v$ACTIONLINT/scripts/download-actionlint.bash") "$ACTIONLINT" "$RUNNER_TEMP" > /dev/null
        SHELLCHECK_OPTS='--severity=warning' "$RUNNER_TEMP/actionlint" -color
      test: npm test
      test-glob: scripts/test/*.test.mjs
      shards: 4
      artifacts: ${{ github.event_name == 'pull_request' && format('@(host|cert)-*-pr{0}', github.event.pull_request.number) || '' }}
      review-browser: node "$GITHUB_WORKSPACE/scripts/review-browser.mjs"
      review-renovate: '*'
      review-timeout-minutes: 150
      review-prompt: |
        HOMESCOOP

        This repository is homescoop: Homebrew-shaped recipes (`packages/<recipe>/`) that build the `@ai-ecoverse/wasm-*`, `wasi-*`, `wasix-*` and `py-*` npm packages seven (seven.sliccy.ai) runs in slicc-kernel in the browser. `README.md`, `docs/ladder-builds.md`, `docs/ci-cert.md` and `docs/versioning.md` are the contract: read the sections the change touches first. `git diff origin/main...HEAD`, or `$RUNNER_TEMP/review/context/pr.diff`, is the change.

        There is no certification after you. Once this pull request passes the merge queue, the push to `main` publishes each package it built to npm, from exactly the tarball this run built, with no other review. A version can never be published twice, so review each package as the last check before it ships, and the scripts and the workflow as the publish path.

        This run (ladder-build run ${{ github.run_id }}) built only the recipes the change touches: `${{ needs.detect.outputs.host }}`. Its jobs ended: recipe-sha ${{ needs.recipe-sha.result }}, host-build ${{ needs.host-build.result }}, rebuild ${{ needs.rebuild.result }}, reproducible ${{ needs.reproducible.result }}, npm-parity ${{ needs.npm-parity.result }}, test ${{ needs.test.result }}, cert ${{ needs.cert.result }}, shims ${{ needs.shims.result }}, emsdk-cache ${{ needs.emsdk-cache.result }}, crates ${{ needs.crates-host.result }}/${{ needs.crates-kernel.result }}/${{ needs.crates-consumer.result }}. A failed job blocks the merge whatever you decide (ci needs every job); say what failed and why if you can tell.

        What's set up:
        - `$RUNNER_TEMP/review/artifacts/host-<recipe>-pr<n>/package.tgz` (with its `package.tgz.sha256`, and `packaging-only-diff.txt` for a repack): the exact bytes that get published. `$RUNNER_TEMP/review/artifacts/cert-<recipe>-pr<n>/browser-cert.json`: that package's cert run (each `packages/<recipe>/cert/*.mjs` spec in slicc-kernel on its `cert/meta.json` kernel), when it has one.
        - The review browsers: `scripts/review-browser.mjs` (the head's copy, for both sides) loaded the built packages into a slicc-kernel page in each one. Head: this pull request's tarballs. Base: the same names from npm (the recipe's `npm-tag:`, else `latest`), the baseline; a new package has none. The extension browsers boot the cert kernel (root `package.json`'s `@ai-ecoverse/slicc-kernel`), the cli browsers slicc-kernel's npm `latest`. wasm-bash, wasm-coreutils and each recipe's `cert/meta.json` `needs` are installed from npm too. `$RUNNER_TEMP/review/homescoop/<side>-<link>.json` describes each (`state`, `packages` with sha256 and source, `kernel`, `skipped`, `page`, `log`), and `ctx` is its URL: `GET <ctx>` describes it; `POST <ctx>ctx/<call>` with a JSON array of arguments calls the same `ctx` the cert specs get, for example `curl -s <ctx>ctx/run -d '[["sqlite3", "--version"], {"cwd": "/home"}]'`, `ctx/write`, `ctx/read`, `ctx/readBytes`, `ctx/pty` and `ctx/addUser` (see `scripts/browser-cert/context.mjs`). Run the same thing on head and base: what fails the same way on the baseline is pre-existing and never blocks. You can also drive the page over CDP (`window.kernel`) and screenshot it.
        - A spec of your own: put it in a directory and run `node scripts/browser-cert/run.mjs --package <recipe> --tarball <package.tgz> --cert <dir> [--kernel @ai-ecoverse/slicc-kernel@<version>] [--users enforce] [--json <out.json>]` (`docs/ci-cert.md` and `scripts/browser-cert/README.md` have the spec API).
        - `npm view` and `npm pack` reach the registry, for the version on npm today and its tarball.

        For each built package (scale it to the change; a rebuild with no source change needs less than an upstream bump or a new patch):
        1. What changed: the recipe, patches, build flags, `package/` and `cert/`, against `origin/main` and against the tarball on npm (file list, modes, `package.json`, `slicc.commands`, `engines`, no install scripts). A deleted spec or a weakened assertion in `cert/` needs a reason.
        2. The cert specs passed (`browser-cert.json`). For a `host-node` harness without `ci` commands, the cert job ran nothing: run the package's host cert yourself.
        3. `cert/meta.json`'s `checklist` is covered by specs, and every `*.patch` is exercised by one.
        4. For an upstream bump: `recipe.yaml`'s source sha256 matches an independent download of `source.url`, and the upstream changelog has nothing that needs a closer look.
        5. Licences and notices are in the tarball.
        6. For security-sensitive packages (secrets, network, crypto, sudo, ssh, gpg, fnox, tailscale): what the change does to that surface.
        7. Try the changed package the way someone in seven would, in the head browsers: its commands on real input, what the change touches, what looks fragile. The committed specs only check what someone already thought of.
        For a change to `scripts/`, the workflow or the docs: the publish path (`.github/workflows/ladder-build.yml`, `scripts/ladder-merge-resolve.mjs`, `scripts/merge-group-check.mjs`, `scripts/assert-certified-publish.mjs`, `scripts/npm-publish.mjs`, `scripts/list-touched-packages.mjs`) must still publish only a green, reviewed pull request's own artifact, and a bug fix comes with a test in `scripts/test/`.

        Severity (roll forward, don't reject over minor issues): deny only for a security or secret exposure, data loss or corruption, a supply-chain problem (a hash that doesn't match, an unexplained non-reproducible build), a licence violation, a crash or a kernel that doesn't boot with the package, a regression that breaks a common workflow or a base-set command without a workaround, or a publish-path change that could ship bytes nobody reviewed. Everything else (narrow regressions with a workaround, compatibility differences, cosmetic issues, test gaps, docs), and anything that also fails on the baseline, is a known issue: approve, and list it in `issues`, titled `[cert] <recipe>: …` (or `[cert] slicc-kernel: …` for a kernel problem, still in ai-ecoverse/homescoop), unless `context/issues.json` already has it open; gather a package's missing specs into one `[cert] <recipe>: cert coverage gaps` issue.

  # The one required check: every job of this run passed or was skipped, and
  # the pipeline (both reviews included) passed.
  ci:
    name: ci
    needs: [detect, recipe-sha, host-build, rebuild, reproducible, npm-parity, test, cert, shims, emsdk-cache, crates-host, crates-kernel, crates-consumer, group, pipeline]
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped, and the pipeline passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          PIPELINE: ${{ needs.pipeline.result }}
          GROUP: ${{ needs.group.result }}
          EVENT: ${{ github.event_name }}
          LIST: >-
            detect=${{ needs.detect.result }} recipe-sha=${{ needs.recipe-sha.result }} host-build=${{ needs.host-build.result }}
            rebuild=${{ needs.rebuild.result }} reproducible=${{ needs.reproducible.result }} npm-parity=${{ needs.npm-parity.result }}
            test=${{ needs.test.result }} cert=${{ needs.cert.result }} shims=${{ needs.shims.result }} emsdk-cache=${{ needs.emsdk-cache.result }}
            crates-host=${{ needs.crates-host.result }} crates-kernel=${{ needs.crates-kernel.result }} crates-consumer=${{ needs.crates-consumer.result }}
            group=${{ needs.group.result }} pipeline=${{ needs.pipeline.result }}
        run: |
          echo "ladder-build: $LIST"
          if node -e 'process.exit(JSON.parse(process.env.RESULTS).every((r) => r === "success" || r === "skipped") ? 0 : 1)'; then :; else
            echo "::error::ci: a job failed or was cancelled: $LIST"
            exit 1
          fi
          if [[ "$PIPELINE" != success ]]; then
            echo "::error::ci: the pipeline (lint, tests, reviews) is $PIPELINE"
            exit 1
          fi
          if [[ "$EVENT" == merge_group && "$GROUP" != success ]]; then
            echo "::error::ci: the merge group check is $GROUP"
            exit 1
          fi
          echo "ci: PASS"

  # Push to main (or a dispatch on main): publish each package from the
  # host-<pkg>-prN artifact of the green pull request run that last changed
  # it, the bytes the reviewers saw. OIDC: npm trusts this file.
  publish:
    needs: detect
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.detect.outputs.release != '[]' && !inputs.agent_loop_rounds
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.release) }}
    # GitHub-hosted: npm takes OIDC tokens (and provenance) from hosted runners only.
    runs-on: ubuntu-latest
    # One publish per npm name at a time (#1151): two overlapping runs could both
    # pass the pre-publish guard against the same old dist-tag, and the lower
    # version, publishing second, would move the tag back.
    concurrency:
      group: npm-publish-${{ matrix.npm }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          # No registry-url: that writes an empty _authToken, and npm 11 then skips the OIDC exchange (ENEEDAUTH).
      - name: The committed version agrees with the recipe
        env:
          PKG: ${{ matrix.package }}
        run: node scripts/sync-package-version.mjs "$PKG" --check
      - id: r
        name: The green PR run's artifact for ${{ matrix.package }}
        env:
          GH_TOKEN: ${{ github.token }}
          PKG: ${{ matrix.package }}
          SHA: ${{ needs.detect.outputs.sha }}
          BASE: ${{ needs.detect.outputs.base }}
        run: node scripts/gate.mjs ladder-merge-resolve -- node scripts/ladder-merge-resolve.mjs --package "$PKG" --sha "$SHA" --base "$BASE" --out "$RUNNER_TEMP/release"
      - name: Publish via OIDC
        if: steps.r.outputs.decision == 'publish'
        env:
          PKG: ${{ matrix.package }}
          NPM: ${{ matrix.npm }}
          CERTIFIED: ${{ steps.r.outputs.certified }}
          HOMESCOOP_NPM_LOGLEVEL: ${{ inputs.npm_loglevel }}
        run: |
          set -euo pipefail
          TAG=$(node scripts/npm-tag.mjs "$PKG")
          bash scripts/oidc-publish.sh "$RUNNER_TEMP/release/package.tgz" "$NPM" "$TAG" "$CERTIFIED"

  close-listed-issues:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/close-listed-issues.mjs
            scripts/gate.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Close the issues a merged PR lists after a closing keyword
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: node scripts/gate.mjs close-listed-issues -- node scripts/close-listed-issues.mjs --before "$BEFORE" --after "$AFTER"

  # Issues filed with a workflow's GITHUB_TOKEN (the reviewers') start no
  # workflow, so the hourly run labels every open unlabelled issue.
  issue-labels:
    if: github.event_name == 'issues' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/issue-labels.mjs
            packages/*/recipe.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Label an unlabelled issue from its title
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/issue-labels.mjs --event
      - name: Label every open unlabelled issue
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/issue-labels.mjs --backlog --apply

  stress-lockfile:
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: touched
        name: Does the change touch stress/wasi-pnpm-agent?
        run: |
          set -euo pipefail
          if git diff --quiet HEAD^1 HEAD -- stress/wasi-pnpm-agent; then
            echo "stress-lockfile: SKIP stress/wasi-pnpm-agent untouched"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only HEAD^1 HEAD -- stress/wasi-pnpm-agent
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.touched.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: agent/pnpm-lock.yaml matches agent/package.json
        if: steps.touched.outputs.run == 'true'
        run: |
          set -euo pipefail
          V=$(node -p "require('./packages/wasi-pnpm/package/package.json').version.replace(/-\\d+$/, '')")
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::stress-lockfile: FAIL no pnpm version from packages/wasi-pnpm ($V)"; exit 1; }
          npm install --prefix "$RUNNER_TEMP/pnpm" --no-fund --no-audit "pnpm@$V"
          if ! "$RUNNER_TEMP/pnpm/node_modules/.bin/pnpm" install --frozen-lockfile --lockfile-only --dir stress/wasi-pnpm-agent/agent; then
            echo "::error::stress-lockfile: FAIL stress/wasi-pnpm-agent/agent/pnpm-lock.yaml is out of date; run pnpm $V install --lockfile-only there (stress/wasi-pnpm-agent/README.md)"
            exit 1
          fi
          echo "stress-lockfile: PASS pnpm $V install --frozen-lockfile --lockfile-only"

  agent-loop:
    if: (github.event_name == 'schedule' && github.event.schedule == '47 5 * * *') || (github.event_name == 'workflow_dispatch' && inputs.agent_loop_rounds != '')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Harness (wasi-pnpm's cert pins) and Chromium
        run: bash scripts/cert-review/harness.sh wasi-pnpm "$RUNNER_TEMP/nm"
      - id: pins
        name: wasi-pnpm at packages/wasi-pnpm's version, the kernel agent/package.json pins
        run: |
          set -euo pipefail
          PNPM=$(node -p "require('./packages/wasi-pnpm/package/package.json').version")
          KERNEL=$(node -p "require('./stress/wasi-pnpm-agent/agent/package.json').dependencies['@ai-ecoverse/slicc-kernel']")
          mkdir -p "$RUNNER_TEMP/pnpm"
          npm pack "@ai-ecoverse/wasi-pnpm@$PNPM" --pack-destination "$RUNNER_TEMP/pnpm" --silent
          sha256sum "$RUNNER_TEMP"/pnpm/*.tgz
          echo "kernel=@ai-ecoverse/slicc-kernel@$KERNEL" >> "$GITHUB_OUTPUT"
      - name: Loop the agent install
        env:
          KERNEL: ${{ steps.pins.outputs.kernel }}
          AGENT_LOOP_ROUNDS: ${{ inputs.agent_loop_rounds || '8' }}
          AGENT_LOOP_OUT: ${{ runner.temp }}/agent-loop
        run: |
          set -euo pipefail
          [[ "$AGENT_LOOP_ROUNDS" =~ ^[1-9][0-9]?$ ]] || { echo "::error::agent-loop: rounds must be 1 to 99, not $AGENT_LOOP_ROUNDS"; exit 1; }
          HOMESCOOP_CERT_NODE_MODULES="$RUNNER_TEMP/nm/node_modules" node scripts/gate.mjs cert-run -- node scripts/browser-cert/run.mjs \
            --package wasi-pnpm --cert stress/wasi-pnpm-agent --spec agent-loop.mjs --kernel "$KERNEL" \
            --tarball "$RUNNER_TEMP"/pnpm/*.tgz --users enforce --soft
      - name: Summary
        if: always()
        env:
          OUT: ${{ runner.temp }}/agent-loop
        run: |
          f="$OUT/rounds.jsonl"
          [ -f "$f" ] || { echo "agent-loop: FAIL no rounds ran" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          node -e '
            const rows = require("fs").readFileSync(process.argv[1], "utf8").trim().split("\n").map(JSON.parse);
            const bad = rows.filter((r) => r.trapped || r.status);
            console.log("agent-loop: " + (bad.length ? "FAIL " : "PASS ") + rows.length + " rounds, " + bad.length + " trapped or failed" + (bad.length ? ": " + bad.map((r) => r.round).join(",") : ""));
          ' "$f" | tee -a "$GITHUB_STEP_SUMMARY"
          cat "$f"
          for r in "$OUT"/wasm-memories-start.txt "$OUT"/round-*.txt; do
            [ -f "$r" ] || continue
            echo "::group::$(basename "$r")"
            cat "$r"
            echo "::endgroup::"
          done
