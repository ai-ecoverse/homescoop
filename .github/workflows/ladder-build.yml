# Ladder build: branch on recipe.builder (host | slicc), then OIDC publish.
# See docs/ladder-builds.md. Trusted publishing is bound to this workflow file.
#
# Triggers:
#   workflow_dispatch — manual, and ladder-merge (via createWorkflowDispatch)
#
# Do not add workflow_call for publish: npm OIDC trusts this filename only when
# it is the *calling* workflow (see docs.npmjs.com/trusted-publishers).
name: ladder-build

on:
  workflow_dispatch:
    inputs:
      package:
        description: Recipe directory under packages/ (e.g. zlib)
        required: true
        default: zlib
        type: string
      duration:
        description: Leader lifetime (slicc builder only)
        required: false
        default: 90m
        type: string
      publish:
        description: OIDC npm publish after a successful build. false = artifact only (cert queue).
        required: false
        default: true
        type: boolean
      certified:
        description: sha256 of the certified tarball. Required to OIDC-publish a version that is not already on npm; must match the built package.tgz.
        required: false
        default: ''
        type: string
      artifact_pr:
        description: PR number whose ladder-pr host-<pkg>-prN artifact is the certified tarball. Skips rebuild; publishes that exact tarball.
        required: false
        default: ''
        type: string
      artifact_id:
        description: With artifact_pr, the id of that host-<pkg>-prN artifact to fetch (ladder-merge passes the one it checked). Empty looks it up by name.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      builder: ${{ steps.r.outputs.builder }}
      npm: ${{ steps.r.outputs.npm }}
      npm_tag: ${{ steps.r.outputs.npm_tag }}
      version: ${{ steps.r.outputs.version }}
      package: ${{ steps.r.outputs.package }}
      published: ${{ steps.r.outputs.published }}
      do_publish: ${{ steps.r.outputs.do_publish }}
      use_artifact: ${{ steps.r.outputs.use_artifact }}
      deps-id: ${{ steps.deps.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
      - id: r
        run: |
          set -euo pipefail
          PKG="${{ inputs.package }}"
          BUILDER=$(node scripts/read-recipe.mjs "$PKG" --field builder)
          BUILDER=${BUILDER:-slicc}
          if [[ "$BUILDER" == "retired" ]]; then
            echo "::error::package '$PKG' is retired (builder: retired) — refuse build/publish"
            exit 2
          fi
          NPM=$(node scripts/read-recipe.mjs "$PKG" --field npm)
          NPM_TAG=$(node scripts/npm-tag.mjs "$PKG")
          if ! VER=$(node scripts/sync-package-version.mjs "$PKG" --check 2> "$RUNNER_TEMP/drift.txt"); then
            echo "::error::$PKG: $(tr '\n' ' ' < "$RUNNER_TEMP/drift.txt")"
            exit 1
          fi
          echo "builder=$BUILDER" >> "$GITHUB_OUTPUT"
          echo "npm=$NPM" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "package=$PKG" >> "$GITHUB_OUTPUT"
          echo "package=$PKG builder=$BUILDER npm=$NPM@$VER tag=$NPM_TAG"
          ART_PR="${{ inputs.artifact_pr }}"
          if [[ -n "$ART_PR" ]]; then
            echo "use_artifact=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_artifact=false" >> "$GITHUB_OUTPUT"
          fi
          WANT_PUBLISH="${{ inputs.publish }}"
          WANT_PUBLISH="${WANT_PUBLISH:-true}"
          if [[ "$WANT_PUBLISH" == "false" ]]; then
            echo "publish=false — build artifact, skip OIDC"
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "do_publish=false" >> "$GITHUB_OUTPUT"
          elif npm view "$NPM@$VER" version >/dev/null 2>&1; then
            echo "already published, skipping $NPM@$VER"
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "do_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "not on registry: $NPM@$VER — build"
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "do_publish=true" >> "$GITHUB_OUTPUT"
          fi
          node scripts/read-recipe.mjs "$PKG" --deps > deps.txt || : > deps.txt
          echo "deps:" && cat deps.txt || true
      - uses: actions/upload-artifact@v7
        id: deps
        with:
          name: recipe-deps-${{ inputs.package }}
          path: deps.txt

  fetch-certified:
    needs: resolve
    if: needs.resolve.outputs.published != 'true' && needs.resolve.outputs.use_artifact == 'true'
    runs-on: ubuntu-latest
    outputs:
      tgz-id: ${{ steps.tgz.outputs.artifact-id }}
      tgz-digest: ${{ steps.tgz.outputs.artifact-digest }}
    steps:
      - name: Download ladder-pr certified tarball
        uses: actions/github-script@v9
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        with:
          script: |
            const pkg = '${{ inputs.package }}';
            const pr = '${{ inputs.artifact_pr }}';
            const want = '${{ inputs.certified }}'.trim().toLowerCase();
            if (!/^[0-9a-f]{64}$/.test(want)) {
              throw new Error('artifact_pr requires certified=<64-char sha256>');
            }
            const name = `host-${pkg}-pr${pr}`;
            const id = process.env.ARTIFACT_ID.trim();
            let art;
            if (id) {
              if (!/^[0-9]+$/.test(id)) throw new Error(`artifact_id ${id} is not a number`);
              ({ data: art } = await github.rest.actions.getArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: Number(id),
              }));
              if (art.name !== name) throw new Error(`artifact ${id} is ${art.name}, not ${name}`);
              if (art.expired) throw new Error(`artifact ${id} (${name}) has expired`);
            } else {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
                per_page: 100,
              });
              const live = (data.artifacts ?? []).filter((a) => a.name === name && !a.expired);
              if (live.length !== 1) {
                throw new Error(`${live.length} artifacts named ${name} (${live.map((a) => a.id).join(', ') || 'none'}); pass artifact_id to pick one`);
              }
              [art] = live;
            }
            if (!/^sha256:[0-9a-f]{64}$/.test(art.digest ?? '')) throw new Error(`artifact ${art.id} (${name}) has no sha256 digest`);
            const res = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: art.id,
              archive_format: 'zip',
            });
            const fs = require('fs');
            const { execSync } = require('child_process');
            const zip = `${process.env.RUNNER_TEMP}/cert.zip`;
            const dir = `${process.env.RUNNER_TEMP}/cert`;
            const bytes = Buffer.from(res.data);
            const zipDigest = `sha256:${require('crypto').createHash('sha256').update(bytes).digest('hex')}`;
            if (zipDigest !== art.digest) throw new Error(`artifact ${art.id} (${name}) downloaded as ${zipDigest}, not its digest ${art.digest}`);
            fs.writeFileSync(zip, bytes);
            execSync(`rm -rf "${dir}" && mkdir -p "${dir}" && unzip -qo "${zip}" -d "${dir}"`);
            const tgz = `${dir}/package.tgz`;
            const shaFile = `${dir}/package.tgz.sha256`;
            if (!fs.existsSync(tgz)) throw new Error('package.tgz missing in artifact');
            const got = execSync(`sha256sum "${tgz}"`).toString().split(/\s+/)[0];
            if (got !== want) {
              throw new Error(`artifact sha256 ${got} != certified ${want}`);
            }
            if (fs.existsSync(shaFile)) {
              const recorded = fs.readFileSync(shaFile, 'utf8').trim().split(/\s+/)[0];
              if (recorded !== got) throw new Error(`artifact sha file ${recorded} != ${got}`);
            }
            fs.copyFileSync(tgz, `${process.env.RUNNER_TEMP}/package.tgz`);
            core.info(`certified artifact ${name} id=${art.id} ${art.digest} package.tgz sha256=${got}`);
      - uses: actions/upload-artifact@v7
        id: tgz
        with:
          name: package-tgz-${{ inputs.package }}
          path: ${{ runner.temp }}/package.tgz

  host-build:
    needs: resolve
    if: needs.resolve.outputs.published != 'true' && needs.resolve.outputs.builder == 'host' && needs.resolve.outputs.use_artifact != 'true'
    runs-on: ubuntu-latest
    outputs:
      tgz-id: ${{ steps.tgz.outputs.artifact-id }}
      tgz-digest: ${{ steps.tgz.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Sync npm version from recipe
        run: node scripts/sync-package-version.mjs "${{ inputs.package }}" --write
      - name: Host ladder run
        run: |
          set -euo pipefail
          bash scripts/host-run.sh "${{ inputs.package }}"
          ls -la .homescoop-out/package.tgz
      - uses: actions/upload-artifact@v7
        id: tgz
        with:
          name: package-tgz-${{ inputs.package }}
          path: .homescoop-out/package.tgz

  slicc-build:
    needs: resolve
    if: needs.resolve.outputs.published != 'true' && needs.resolve.outputs.builder == 'slicc' && needs.resolve.outputs.use_artifact != 'true'
    runs-on: ubuntu-latest
    outputs:
      tgz-id: ${{ steps.tgz.outputs.artifact-id }}
      tgz-digest: ${{ steps.tgz.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v7
      - name: Sync npm version from recipe
        run: node scripts/sync-package-version.mjs "${{ inputs.package }}" --write
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.resolve.outputs.deps-id }}
          path: ${{ runner.temp }}
      - id: leader
        uses: ai-ecoverse/slicc/packages/github-workflow/actions/start-leader@main
        with:
          duration: ${{ inputs.duration }}
          cone-config: ${{ secrets.SLICC_CONE_CONFIG }}
          secrets-env: ${{ secrets.SLICC_SECRETS_ENV }}
          mounts: |
            ${{ github.workspace }}:/mnt/homescoop
      - uses: ai-ecoverse/slicc/packages/github-workflow/actions/install-cli@main
      - uses: ai-ecoverse/slicc/packages/github-workflow/actions/write-file@main
        with:
          join-url: ${{ steps.leader.outputs.join-url }}
          path: /tmp/homescoop/deps.txt
          local: ${{ runner.temp }}/deps.txt
      - uses: ai-ecoverse/slicc/packages/github-workflow/actions/exec@main
        with:
          join-url: ${{ steps.leader.outputs.join-url }}
          timeout: 60m
          command: |
            export HOMESCOOP_ROOT=/mnt/homescoop
            HOMESCOOP_DEPS="$(cat /tmp/homescoop/deps.txt 2>/dev/null || true)"
            export HOMESCOOP_DEPS
            jsh /mnt/homescoop/scripts/ladder-run.jsh ${{ inputs.package }}
      - uses: ai-ecoverse/slicc/packages/github-workflow/actions/read-file@main
        with:
          join-url: ${{ steps.leader.outputs.join-url }}
          path: /tmp/homescoop/out/package.tgz
          local: ${{ runner.temp }}/package.tgz
      - uses: actions/upload-artifact@v7
        id: tgz
        with:
          name: package-tgz-${{ inputs.package }}
          path: ${{ runner.temp }}/package.tgz
      - if: always()
        uses: ai-ecoverse/slicc/packages/github-workflow/actions/stop-leader@main

  publish:
    needs: [resolve, host-build, slicc-build, fetch-certified]
    if: >-
      github.ref == 'refs/heads/main' &&
      always() && needs.resolve.outputs.do_publish == 'true' && (
        needs.host-build.result == 'success' ||
        needs.slicc-build.result == 'success' ||
        needs.fetch-certified.result == 'success'
      )
    runs-on: ubuntu-latest
    # One publish per npm name at a time (#1151): two overlapping runs could both pass the
    # pre-publish guard against the same old dist-tag, and the lower version, publishing
    # second, would move the tag back. Serialized, the second run's assert-certified-publish
    # sees the first one's version under the tag and refuses anything below it. GitHub keeps
    # one pending run per group: a third run replaces a pending second one. Nothing is lost,
    # because the newer run carries the higher certified version (roll forward).
    concurrency:
      group: npm-publish-${{ needs.resolve.outputs.npm }}
      cancel-in-progress: false
    # Job-level: setup-node / npm must see ACTIONS_ID_TOKEN_REQUEST_*.
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          # Do not set registry-url: that writes an empty _authToken and
          # npm 11 then skips the OIDC exchange (ENEEDAUTH).
      - name: The tarball by the id and digest its build job uploaded
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECT: >-
            [{"name": "package-tgz-${{ inputs.package }}",
              "id": "${{ needs.host-build.outputs.tgz-id || needs.slicc-build.outputs.tgz-id || needs.fetch-certified.outputs.tgz-id }}",
              "digest": "${{ needs.host-build.outputs.tgz-digest || needs.slicc-build.outputs.tgz-digest || needs.fetch-certified.outputs.tgz-digest }}"}]
        run: >-
          node scripts/gate.mjs artifact-pick -- node scripts/cert-review/artifacts.mjs
          --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --expect "$EXPECT" --guard '^package-tgz-'
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.pick.outputs.ids }}
          path: ${{ runner.temp }}
      - name: Publish via OIDC
        id: publish
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
          NPM: ${{ needs.resolve.outputs.npm }}
          TAG: ${{ needs.resolve.outputs.npm_tag }}
          CERTIFIED: ${{ inputs.certified }}
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG_TOKEN || true
          TGZ="${{ runner.temp }}/package.tgz"
          ls -la "$TGZ"
          node -v
          npm -v
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo "ACTIONS_ID_TOKEN_REQUEST_URL unset — OIDC will not work" >&2
            exit 1
          fi
          # setup-node / a global npm install can leave _authToken= which
          # short-circuits trusted publishing.
          for npmrc in "${NPM_CONFIG_USERCONFIG:-}" "$HOME/.npmrc"; do
            [[ -n "$npmrc" && -f "$npmrc" ]] || continue
            echo "== strip _authToken from $npmrc"
            sed -i.bak '/_authToken/d' "$npmrc" || true
            cat "$npmrc" || true
          done
          node scripts/gate.mjs publish -- node scripts/npm-publish.mjs "$TGZ" --npm "$NPM" --tag "$TAG" --certified "$CERTIFIED"
