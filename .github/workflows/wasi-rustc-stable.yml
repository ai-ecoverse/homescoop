# Static LLVM 22 baseline for @ai-ecoverse/wasi-rustc (Rust 1.98.1).
name: wasi-rustc-stable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: checkout homescoop patches
        uses: actions/checkout@v4
        with:
          path: homescoop

      - name: free disk
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: checkout Rust 1.98.1 with in-tree LLVM 22
        uses: actions/checkout@v4
        with:
          repository: rust-lang/rust
          ref: 48a229ceaefd4985c50990b14116b6d856af0985 # Rust 1.98.1
          submodules: recursive
          path: rust

      - name: apply WASI host and bundled LLD patches
        working-directory: rust
        run: |
          set -euo pipefail
          git apply ../homescoop/packages/wasi-rustc/patches/0003-rust-1.98-wasi-host-paths.patch
          git apply ../homescoop/packages/wasi-rustc/patches/0004-rust-1.98-static-llvm-lld.patch
          git apply ../homescoop/packages/wasi-rustc/patches/0005-rust-1.98-llvm-wasi-threads-target.patch
          git apply ../homescoop/packages/wasi-rustc/patches/0006-rust-1.98-wasi-sysroot-env.patch
          git diff --check
          git status --short

      - name: install wasi-sdk-24
        working-directory: rust
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz
          tar -xzf wasi-sdk.tar.gz
          rm wasi-sdk.tar.gz
          mv wasi-sdk-24.0-* wasi-sdk
          echo "WASI_SDK_PATH=${{ github.workspace }}/rust/wasi-sdk" >> "$GITHUB_ENV"
          echo "WASI_SYSROOT=${{ github.workspace }}/rust/wasi-sdk/share/wasi-sysroot" >> "$GITHUB_ENV"

      - name: verify wasi-sdk shared-memory libc link
        working-directory: rust
        run: |
          set -euo pipefail
          printf 'int main(void) { return 0; }\n' > wasi-sdk-probe.c
          wasi-sdk/bin/wasm32-wasip1-threads-clang \
            --target=wasm32-wasi --target=wasm32-wasip1-threads \
            -pthread -D_WASI_EMULATED_MMAN wasi-sdk-probe.c \
            -lwasi-emulated-mman -Wl,--max-memory=4294967296 \
            -o wasi-sdk-probe.wasm
          test -s wasi-sdk-probe.wasm

      - name: apt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libclang-dev ninja-build

      - name: generate and parse bootstrap config
        working-directory: rust
        run: |
          set -euo pipefail
          python3 ../homescoop/packages/wasi-rustc/make-stable-config.py --wasi-sdk "$WASI_SDK_PATH" --output config.wasi.toml
          ./x.py install --dry-run --config config.wasi.toml > config-dry-run.log 2>&1 || { cat config-dry-run.log; exit 1; }
          tail -25 config-dry-run.log

      - name: x.py install static rustc and rustlib
        working-directory: rust
        env:
          RUSTFLAGS_NOT_BOOTSTRAP: ""
        run: |
          set -euo pipefail
          unset RUSTFLAGS || true
          unset CARGO_TARGET_WASM32_WASIP1_RUSTFLAGS || true
          unset CARGO_TARGET_WASM32_WASIP1_THREADS_RUSTFLAGS || true
          ./x.py install --config config.wasi.toml

      - name: stage minimal artifact
        working-directory: rust
        run: |
          set -euo pipefail
          mkdir -p stage/bin stage/lib/rustlib
          rustc_wasm=$(find dist -name rustc.wasm -type f | head -1)
          test -n "$rustc_wasm"
          cp "$rustc_wasm" stage/bin/rustc.wasm
          test -d dist/lib/rustlib/wasm32-wasip1
          cp -R dist/lib/rustlib/wasm32-wasip1 stage/lib/rustlib/
          tar -C stage -czf "${{ github.workspace }}/wasi-rustc-stable.tgz" .
          ls -lh "${{ github.workspace }}/wasi-rustc-stable.tgz"

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: wasi-rustc-stable
          path: wasi-rustc-stable.tgz
          if-no-files-found: error
          retention-days: 14
