# After merge to main: dispatch ladder-build for packages whose recipe.yaml
# or package/ tree changed. build.sh / patches / docs do not publish.
#
# When the merge came from a PR with a ladder-pr certified artifact
# (host-<pkg>-prN), pass certified=<sha256> + artifact_pr so ladder-build
# publishes that exact tarball (no rebuild).
#
# Important: do NOT `uses:` ladder-build as a reusable workflow. npm OIDC
# trusted publishing validates the *calling* workflow filename
# (docs.npmjs.com/trusted-publishers). Fledgling trusts ladder-build.yml only,
# so we must trigger a real workflow_dispatch of that file.
name: ladder-merge

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
  workflow_dispatch:
    inputs:
      sha:
        description: Dry run, never dispatches ladder-build. Merge commit on main to resolve (full 40-hex sha).
        required: true
        type: string
      before:
        description: Resolve the pushed range before..sha instead of the one merge (default sha^).
        required: false
        default: ''
        type: string
      packages:
        description: JSON list of packages to resolve instead of the publishable ones the merge touched.
        required: false
        default: ''
        type: string
      assume_unpublished:
        description: Resolve as if the merged versions were not on npm.
        required: false
        default: false
        type: boolean
      message:
        description: Resolve against this text instead of the merge commit message.
        required: false
        default: ''
        type: string
      pr_body:
        description: Resolve against this text instead of the PR body.
        required: false
        default: ''
        type: string
      pr:
        description: Resolve against this PR (open or merged) instead of the one merged as sha.
        required: false
        default: ''
        type: string
      head:
        description: Resolve as if the PR had been merged at this head (40 hex).
        required: false
        default: ''
        type: string
      ci_certified:
        description: Packages to treat as listed in scripts/ci-certified.json (comma separated).
        required: false
        default: ''
        type: string

  workflow_call:
    inputs:
      sha:
        description: The merge commit to resolve (real only when the caller is main's ladder-automerge).
        required: true
        type: string
      before:
        description: Its first parent.
        required: false
        default: ''
        type: string
      pr:
        description: Dry calls only, the PR to resolve as if merged at sha.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.d.outputs.packages }}
      any: ${{ steps.d.outputs.any }}
      sha: ${{ steps.d.outputs.sha }}
      base: ${{ steps.d.outputs.base }}
      real: ${{ steps.d.outputs.real }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
      - id: d
        env:
          EVENT: ${{ github.event_name }}
          REAL: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.workflow_ref == format('{0}/.github/workflows/ladder-automerge.yml@refs/heads/main', github.repository)) }}
          BEFORE: ${{ github.event.before || inputs.before }}
          AFTER: ${{ inputs.sha || github.sha }}
          ONLY: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          if [[ ! "$AFTER" =~ ^[0-9a-f]{7,40}$ ]] || ! FULL=$(git rev-parse --verify --quiet "$AFTER^{commit}"); then
            echo "::error::sha '$AFTER' is not a commit in this repository"
            exit 1
          fi
          AFTER=$FULL
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            BEFORE=$(git rev-parse "$AFTER^" 2>/dev/null || echo "$AFTER")
          elif [[ ! "$BEFORE" =~ ^[0-9a-f]{7,40}$ ]] || ! BEFORE=$(git rev-parse --verify --quiet "$BEFORE^{commit}"); then
            echo "::error::before is not a commit in this repository"
            exit 1
          fi
          if [[ "$REAL" != true && -n "$ONLY" ]]; then
            PKGS=$(node -e 'const p=JSON.parse(process.argv[1]); if(!Array.isArray(p)||!p.every((x)=>/^[a-z0-9][a-z0-9._-]*$/.test(x))) process.exit(1); console.log(JSON.stringify(p))' "$ONLY")
          else
            PKGS=$(node scripts/list-touched-packages.mjs --base "$BEFORE" --head "$AFTER" --json --publishable)
          fi
          {
            echo "sha=$AFTER"
            echo "base=$BEFORE"
            echo "real=$REAL"
            echo "packages=$PKGS"
            echo "any=$([ "$PKGS" != '[]' ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "event=$EVENT real=$REAL sha=$AFTER touched=$PKGS"

  dispatch:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        package: ${{ fromJson(needs.detect.outputs.packages) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      statuses: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Resolve what ladder-build may publish for ${{ matrix.package }}
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
          REAL: ${{ needs.detect.outputs.real }}
          PKG: ${{ matrix.package }}
          SHA: ${{ needs.detect.outputs.sha }}
          BASE: ${{ needs.detect.outputs.base }}
          ASSUME_UNPUBLISHED: ${{ inputs.assume_unpublished }}
          MESSAGE: ${{ inputs.message }}
          PR_BODY: ${{ inputs.pr_body }}
          HEAD_SHA: ${{ inputs.head }}
          PR_NUMBER: ${{ inputs.pr }}
          CI_CERTIFIED: ${{ inputs.ci_certified }}
        run: |
          set -euo pipefail
          args=(--package "$PKG" --sha "$SHA" --base "$BASE")
          if [[ "$REAL" != true ]]; then
            args+=(--dry-run)
            if [[ "$ASSUME_UNPUBLISHED" == true ]]; then args+=(--assume-unpublished); fi
            if [[ -n "$MESSAGE" ]]; then args+=(--message "$MESSAGE"); fi
            if [[ -n "$PR_BODY" ]]; then args+=(--pr-body "$PR_BODY"); fi
            if [[ -n "$HEAD_SHA" ]]; then args+=(--head "$HEAD_SHA"); fi
            if [[ -n "$PR_NUMBER" ]]; then args+=(--pr "$PR_NUMBER"); fi
            if [[ -n "$CI_CERTIFIED" ]]; then args+=(--ci-certified "$CI_CERTIFIED"); fi
          fi
          node scripts/ladder-merge-resolve.mjs "${args[@]}"
      - name: Dispatch ladder-build for ${{ matrix.package }}
        if: needs.detect.outputs.real == 'true'
        uses: actions/github-script@v9
        env:
          INPUTS: ${{ steps.r.outputs.inputs }}
        with:
          script: |
            const inputs = JSON.parse(process.env.INPUTS);
            console.log('dispatch ladder-build.yml', inputs);
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ladder-build.yml',
              ref: context.ref,
              inputs,
            });
