# wasi-impeccable's HTTP verbs and live mode, end to end: build
# impeccable.wasm with the recipe (wasix crates vendored from crates/), then
# run test/e2e on the certified slicc-kernel's headless Node entry. The
# transport mocks impeccable.style and the image API; the skill bundle is the
# real signed release from GitHub, verified inside WASI. Live mode runs its
# server detached in the kernel, with curl as the page. The file-local
# checklist (cert/checklist.mjs) stays a browser cert.
name: wasi-impeccable

on:
  push:
    branches: [main]
    paths:
      - packages/wasi-impeccable/**
      - crates/wasix-net/**
      - crates/wasix-ureq/**
      - crates/wasix-command/**
      - scripts/build-common.sh
      - .github/workflows/wasi-impeccable.yml
  pull_request:
    paths:
      - packages/wasi-impeccable/**
      - crates/wasix-net/**
      - crates/wasix-ureq/**
      - crates/wasix-command/**
      - scripts/build-common.sh
      - .github/workflows/wasi-impeccable.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: build impeccable.wasm
        run: HOMESCOOP_ROOT="$PWD" HOMESCOOP_WORK="$RUNNER_TEMP/homescoop-work" bash packages/wasi-impeccable/build.sh
      - name: install slicc-kernel (pinned; live needs 1.17.2's #105/#106 fixes)
        working-directory: packages/wasi-impeccable/test
        run: npm ci --no-audit --no-fund
      - name: HTTP verbs and live mode in the kernel
        working-directory: packages/wasi-impeccable/test
        # --test-force-exit until slicc-kernel#110 ships: the kernel leaves a
        # sleeping thread's poll timer armed after its process exits, which
        # keeps Node alive until it fires.
        # https://github.com/ai-ecoverse/slicc-kernel/issues/110
        run: node --test --test-concurrency=1 --test-force-exit 'e2e/*.test.mjs'
