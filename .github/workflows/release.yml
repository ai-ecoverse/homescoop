# OIDC trusted publishing for @ai-ecoverse/wasm-* packages.
# Trust must be configured first: `npm run trust` (needs `npm login` + 2FA).
# No NPM_TOKEN — GitHub issues an OIDC token that npm accepts for publish.
#
# Do NOT pass registry-url to setup-node: it writes a dummy NODE_AUTH_TOKEN
# that takes precedence over OIDC and makes publish look like an anon 404.
name: release

on:
  workflow_dispatch:
    inputs:
      package:
        description: >-
          Recipe dir under packages/ (e.g. zlib), or "all" for every wasm-* package
        required: true
        default: zlib

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Trusted publishing needs a recent npm (OIDC exchange).
      - name: Ensure npm supports OIDC
        run: npm install -g npm@latest

      - name: List packages
        run: node scripts/list-packages.mjs

      - name: Publish via OIDC
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN || true
          publish_one() {
            local dir="$1"
            echo "::group::npm publish packages/${dir}/package"
            npm publish "packages/${dir}/package" --access public --tag latest
            echo "::endgroup::"
          }
          if [ "$PACKAGE" = "all" ]; then
            for dir in packages/*/package; do
              publish_one "$(basename "$(dirname "$dir")")"
            done
          else
            publish_one "$PACKAGE"
          fi
