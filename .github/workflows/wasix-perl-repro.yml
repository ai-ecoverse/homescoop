name: wasix-perl-repro

on:
  pull_request:
    paths:
      - packages/wasix-perl/**
      - scripts/install-wasixcc.sh
      - .github/workflows/wasix-perl-repro.yml
  workflow_dispatch:

permissions:
  contents: read

# Supersede stale runs: a newer push to the same PR or renovate branch cancels
# the older run; other refs keep at most one pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/renovate/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: build wasix-perl
        run: bash scripts/host-run.sh wasix-perl
      - name: record sha256
        run: |
          mkdir -p out
          tar xzf .homescoop-out/package.tgz -C out
          sha256sum .homescoop-out/package.tgz out/package/bin/perl.wasm | tee out/sha256.txt "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: wasix-perl-repro-${{ matrix.attempt }}
          path: out/sha256.txt

  reproducible:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wasix-perl-repro-*
      - name: both builds are byte-identical
        run: |
          cat wasix-perl-repro-*/sha256.txt | tee "$GITHUB_STEP_SUMMARY"
          diff wasix-perl-repro-1/sha256.txt wasix-perl-repro-2/sha256.txt
