name: issue-labels

on:
  issues:
    types: [opened]

permissions:
  issues: write

concurrency:
  group: issue-labels-${{ github.event.issue.number }}

jobs:
  label:
    name: issue-labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/issue-labels.mjs
            packages/*/recipe.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Label an unlabelled issue from its title
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/issue-labels.mjs --event
