name: pnpm-agent-loop

# homescoop#1127: loop seven's agent install (bios's lockfile, `pnpm install
# --frozen-lockfile --trust-lockfile`) on the cert kernel with
# SLICC_WASM_BACKTRACE=1, to catch the intermittent "pnpm: wasm trap in
# thread N: memory access out of bounds" with named frames (wasi-pnpm >=
# 12.9.1-10 ships bin/pnpm.wasm.names). Every shard runs `rounds` installs
# in one browser kernel; a round that traps or fails is uploaded whole.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'wasi-pnpm version on npm (>= 12.9.1-10 for named frames)'
        default: 'latest'
      kernel:
        description: 'slicc-kernel to run on'
        default: '@ai-ecoverse/slicc-kernel@1.124.2'
        # also run it on npm latest (1.125.8+), per the KC
      rounds:
        description: 'installs per shard (8 shards)'
        default: '40'
      hosted:
        description: 'run on GitHub-hosted ubuntu-latest instead of the pool (Cloud Run, gVisor): splits a gVisor effect from Linux V8 (homescoop#1127)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pnpm-agent-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ${{ inputs.hosted && 'ubuntu-latest' || vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Harness (wasi-pnpm's cert pins) and Chromium
        run: |
          set -euo pipefail
          NM="$RUNNER_TEMP/nm"
          bash scripts/cert-review/harness.sh wasi-pnpm "$NM"
          # A wasm-bash that runs on the older kernels this loop compares
          # (5.3.0-21+ needs slicc-kernel >= 1.130.2).
          npm install --prefix "$NM" --no-fund --no-audit @ai-ecoverse/wasm-bash@5.3.0-20
          if [ "$(id -u)" = 0 ] || sudo -n true 2>/dev/null; then
            npx --prefix "$NM" playwright-core install --with-deps chromium
          else
            npx --prefix "$NM" playwright-core install chromium
          fi
      - name: wasi-pnpm ${{ inputs.version }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pnpm"
          npm pack "@ai-ecoverse/wasi-pnpm@$VERSION" --pack-destination "$RUNNER_TEMP/pnpm" --silent
          ls -l "$RUNNER_TEMP"/pnpm/*.tgz
          sha256sum "$RUNNER_TEMP"/pnpm/*.tgz
      - name: Loop the agent install
        env:
          KERNEL: ${{ inputs.kernel }}
          AGENT_LOOP_ROUNDS: ${{ inputs.rounds }}
          AGENT_LOOP_OUT: ${{ runner.temp }}/agent-loop
        run: |
          set -euo pipefail
          HOMESCOOP_CERT_NODE_MODULES="$RUNNER_TEMP/nm/node_modules" node scripts/browser-cert/run.mjs \
            --package wasi-pnpm --cert packages/wasi-pnpm/stress --spec agent-loop.mjs --kernel "$KERNEL" \
            --tarball "$RUNNER_TEMP"/pnpm/*.tgz --users enforce --soft
      - name: Summary
        if: always()
        env:
          OUT: ${{ runner.temp }}/agent-loop
        run: |
          f="$OUT/rounds.jsonl"
          [ -f "$f" ] || { echo "no rounds ran" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          node -e '
            const rows = require("fs").readFileSync(process.argv[1], "utf8").trim().split("\n").map(JSON.parse);
            const bad = rows.filter((r) => r.trapped || r.status);
            console.log(`shard ${process.argv[2]}: ${rows.length} rounds, ${bad.length} trapped or failed${bad.length ? ": " + bad.map((r) => r.round).join(",") : ""}`);
          ' "$f" "${{ matrix.shard }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-loop-${{ matrix.shard }}
          path: ${{ runner.temp }}/agent-loop
          if-no-files-found: ignore
