name: kernel-compat-proof

on:
  pull_request:
    paths:
      - '.github/workflows/kernel-compat.yml'
      - '.github/workflows/kernel-compat-proof.yml'
      - 'package.json'
      - 'scripts/dev-pin.mjs'
      - 'scripts/browser-cert/compat.mjs'
      - 'scripts/browser-cert/known-limits.json'
      - 'scripts/browser-cert/base-sweep/**'
      - 'scripts/browser-cert/run.mjs'
      - 'scripts/browser-cert/cases.mjs'
      - 'scripts/browser-cert/cert-meta.mjs'
      - 'scripts/browser-cert/glue.mjs'
      - 'scripts/browser-cert/context.mjs'
      - 'scripts/browser-cert/page/**'
      - 'scripts/browser-cert/selftest/**'
  workflow_call:
    inputs:
      homescoop-ref:
        description: The homescoop commit to prove (ladder-pr passes a merge group head)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: kernel-compat-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kernels:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      positive: ${{ steps.k.outputs.positive }}
      negative: ${{ steps.k.outputs.negative }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.homescoop-ref || '' }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - id: k
        run: |
          set -euo pipefail
          positive=$(node scripts/dev-pin.mjs @ai-ecoverse/slicc-kernel)
          negative=$(node scripts/dev-pin.mjs slicc-kernel-negative)
          echo "kernels (package.json devDependencies): positive $positive, negative $negative"
          printf 'positive=%s\nnegative=%s\n' "$positive" "$negative" >> "$GITHUB_OUTPUT"

  positive:
    needs: kernels
    uses: ./.github/workflows/kernel-compat.yml
    with:
      kernel: ${{ needs.kernels.outputs.positive }}
      set: 'base,ci-certified'
      homescoop-ref: ${{ inputs.homescoop-ref || github.event.pull_request.head.sha }}

  negative:
    needs: kernels
    uses: ./.github/workflows/kernel-compat.yml
    with:
      kernel: ${{ needs.kernels.outputs.negative }}
      set: 'base,ci-certified'
      homescoop-ref: ${{ inputs.homescoop-ref || github.event.pull_request.head.sha }}
      expect-regressions: 'grep,sed,xz,jq,findutils,diffutils,patch'

  selftest:
    needs: kernels
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.homescoop-ref || '' }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: The harness's own specs (scripts/browser-cert/selftest) on npm latest of wasm-curl
        env:
          KERNEL: ${{ needs.kernels.outputs.positive }}
        run: |
          set -euo pipefail
          NM="$RUNNER_TEMP/nm"
          needs=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("scripts/browser-cert/selftest/meta.json","utf8")).needs.join(" "))')
          npm install --prefix "$NM" --no-fund --no-audit "$KERNEL" "$(node scripts/dev-pin.mjs @ai-ecoverse/slicc-shared-web)" "$(node scripts/dev-pin.mjs playwright-core)" $needs
          if [ "$(id -u)" = 0 ] || sudo -n true 2>/dev/null; then
            npx --prefix "$NM" playwright-core install --with-deps chromium
          else
            npx --prefix "$NM" playwright-core install chromium
          fi
          mkdir -p "$RUNNER_TEMP/curl"
          npm pack @ai-ecoverse/wasm-curl --pack-destination "$RUNNER_TEMP/curl" --silent
          HOMESCOOP_CERT_NODE_MODULES="$NM/node_modules" node scripts/browser-cert/run.mjs --package curl --tarball "$RUNNER_TEMP"/curl/*.tgz --cert scripts/browser-cert/selftest
