name: kernel-compat-proof

on:
  pull_request:
    paths:
      - '.github/workflows/kernel-compat.yml'
      - '.github/workflows/kernel-compat-proof.yml'
      - 'package.json'
      - 'scripts/dev-pin.mjs'
      - 'scripts/browser-cert/compat.mjs'
      - 'scripts/browser-cert/known-limits.json'
      - 'scripts/browser-cert/base-sweep/**'
      - 'scripts/browser-cert/run.mjs'
      - 'scripts/browser-cert/cases.mjs'
      - 'scripts/browser-cert/cert-meta.mjs'
      - 'scripts/browser-cert/glue.mjs'
      - 'scripts/browser-cert/context.mjs'
      - 'scripts/browser-cert/page/**'

permissions:
  contents: read

concurrency:
  group: kernel-compat-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kernels:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      positive: ${{ steps.k.outputs.positive }}
      negative: ${{ steps.k.outputs.negative }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - id: k
        run: |
          set -euo pipefail
          positive=$(node scripts/dev-pin.mjs @ai-ecoverse/slicc-kernel)
          negative=$(node scripts/dev-pin.mjs slicc-kernel-negative)
          echo "kernels (package.json devDependencies): positive $positive, negative $negative"
          printf 'positive=%s\nnegative=%s\n' "$positive" "$negative" >> "$GITHUB_OUTPUT"

  positive:
    needs: kernels
    uses: ./.github/workflows/kernel-compat.yml
    with:
      kernel: ${{ needs.kernels.outputs.positive }}
      set: 'base,ci-certified'
      homescoop-ref: ${{ github.event.pull_request.head.sha }}

  negative:
    needs: kernels
    uses: ./.github/workflows/kernel-compat.yml
    with:
      kernel: ${{ needs.kernels.outputs.negative }}
      set: 'base,ci-certified'
      homescoop-ref: ${{ github.event.pull_request.head.sha }}
      expect-regressions: 'grep,sed,xz,jq,findutils,diffutils,patch'
