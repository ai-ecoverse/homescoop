name: kernel-compat

on:
  workflow_call:
    inputs:
      kernel:
        description: 'Candidate kernel: an npm spec (@ai-ecoverse/slicc-kernel@1.85.1, or a bare version) or the name of a kernel .tgz artifact uploaded earlier in the calling run'
        type: string
        required: true
      set:
        description: 'base | ci-certified | catalog | all | recipe or npm names (name[@version]), comma-separated'
        type: string
        default: 'base,ci-certified'
      homescoop-ref:
        description: 'homescoop ref whose cert specs and scripts run'
        type: string
        default: 'main'
      bios-ref:
        description: 'slicc-bios ref whose lockfiles give the base set, the catalog and the reference kernel'
        type: string
        default: 'main'
      runner:
        description: 'runs-on label for the shards (empty: vars.CERT_RUNNER). Used only for a trusted run (docs/ci-cert.md), else ubuntu-latest'
        type: string
        default: ''
      light-runner:
        description: 'runs-on label for plan and report (empty: vars.CERT_LIGHT_RUNNER). Used only for a trusted run, else ubuntu-latest'
        type: string
        default: ''
      fail-on-regression:
        description: 'Fail the report job when a package or sweep case passes on the reference kernel and fails on the candidate'
        type: boolean
        default: true
      shards:
        description: 'Shard jobs: auto (about 15 min of work each, at most 3) or 1-3; the base sweep runs inside them'
        type: string
        default: 'auto'
      expect-regressions:
        description: 'Negative proof: recipes that must regress (spec and base sweep); the report fails if one does not, and other regressions do not fail it'
        type: string
        default: ''
    outputs:
      artifact:
        description: 'Artifact holding compat.json, summary.md and the logs'
        value: ${{ jobs.plan.outputs.artifact }}
      verdict:
        description: 'pass, regression or error'
        value: ${{ jobs.report.outputs.verdict || jobs.shard.outputs.verdict }}
      regressions:
        description: 'Number of regressions'
        value: ${{ jobs.report.outputs.regressions || jobs.shard.outputs.regressions }}
  workflow_dispatch:
    inputs:
      kernel:
        description: 'Candidate kernel: an npm spec (@ai-ecoverse/slicc-kernel@1.85.1, or a bare version)'
        type: string
        required: true
      set:
        description: 'base | ci-certified | catalog | all | recipe or npm names (name[@version]), comma-separated'
        type: string
        default: 'base,ci-certified'
      homescoop-ref:
        description: 'homescoop ref whose cert specs and scripts run'
        type: string
        default: 'main'
      bios-ref:
        description: 'slicc-bios ref whose lockfiles give the base set, the catalog and the reference kernel'
        type: string
        default: 'main'
      runner:
        description: 'runs-on label for the shards (empty: vars.CERT_RUNNER). Used only for a trusted run (docs/ci-cert.md), else ubuntu-latest'
        type: string
        default: ''
      light-runner:
        description: 'runs-on label for plan and report (empty: vars.CERT_LIGHT_RUNNER). Used only for a trusted run, else ubuntu-latest'
        type: string
        default: ''
      fail-on-regression:
        description: 'Fail the report job on a regression'
        type: boolean
        default: true
      shards:
        description: 'Shard jobs: auto (about 15 min of work each, at most 3) or 1-3'
        type: string
        default: 'auto'

permissions:
  contents: read

concurrency:
  group: kernel-compat-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.kernel }}-${{ inputs.set }}-${{ inputs.bios-ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ${{ ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' || github.event_name == 'release') && github.ref == 'refs/heads/main' && (inputs.homescoop-ref || 'main') == 'main' && (inputs.bios-ref || 'main') == 'main' && startsWith(inputs.kernel, '@ai-ecoverse/slicc-kernel@') && !contains(inputs.kernel, ':') && !contains(inputs.kernel, '#')) && (inputs.light-runner || vars.CERT_LIGHT_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 20
    outputs:
      runner: ${{ steps.runners.outputs.runner }}
      light-runner: ${{ steps.runners.outputs.light-runner }}
      tag: ${{ steps.plan.outputs.tag }}
      artifact: ${{ steps.plan.outputs.artifact }}
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
      homescoop-sha: ${{ steps.plan.outputs.homescoop-sha }}
    steps:
      - id: runners
        env:
          TRUSTED: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' || github.event_name == 'release') && github.ref == 'refs/heads/main' && (inputs.homescoop-ref || 'main') == 'main' && (inputs.bios-ref || 'main') == 'main' && startsWith(inputs.kernel, '@ai-ecoverse/slicc-kernel@') && !contains(inputs.kernel, ':') && !contains(inputs.kernel, '#') }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RUNNER: ${{ inputs.runner || vars.CERT_RUNNER }}
          LIGHT: ${{ inputs.light-runner || vars.CERT_LIGHT_RUNNER }}
        run: |
          set -euo pipefail
          if [[ "$TRUSTED" == "true" ]]; then
            echo "runner=${RUNNER:-ubuntu-latest}" >> "$GITHUB_OUTPUT"
            echo "light-runner=${LIGHT:-ubuntu-latest}" >> "$GITHUB_OUTPUT"
            echo "runners: trusted ($EVENT on $REF, homescoop main, bios main, a published kernel): ${RUNNER:-ubuntu-latest}, light ${LIGHT:-ubuntu-latest}"
          else
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
            echo "light-runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
            echo "runners: ubuntu-latest (not a trusted run: $EVENT on $REF, or a homescoop-ref, bios-ref or kernel other than main, main and a published @ai-ecoverse/slicc-kernel)"
          fi
      - uses: actions/checkout@v7
        with:
          repository: ai-ecoverse/homescoop
          ref: ${{ inputs.homescoop-ref || 'main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - id: kind
        env:
          KERNEL: ${{ inputs.kernel }}
        run: |
          set -euo pipefail
          if [[ "$KERNEL" =~ ^(@|[0-9]) ]]; then echo "kind=npm" >> "$GITHUB_OUTPUT"; else echo "kind=artifact" >> "$GITHUB_OUTPUT"; fi
      - if: steps.kind.outputs.kind == 'artifact'
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.kernel }}
          path: ${{ runner.temp }}/kernel-artifact
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KERNEL: ${{ inputs.kernel }}
          SET: ${{ inputs.set || 'base,ci-certified' }}
          BIOS_REF: ${{ inputs.bios-ref || 'main' }}
          HOMESCOOP_REF: ${{ inputs.homescoop-ref }}
          SHARDS: ${{ inputs.shards || 'auto' }}
          KERNEL_DIR: ${{ steps.kind.outputs.kind == 'artifact' && format('{0}/kernel-artifact', runner.temp) || '' }}
        run: |
          set -euo pipefail
          node scripts/browser-cert/compat.mjs plan \
            --kernel "$KERNEL" --set "$SET" --bios-ref "$BIOS_REF" --homescoop-ref "$HOMESCOOP_REF" --shards "$SHARDS" \
            ${KERNEL_DIR:+--kernel-dir "$KERNEL_DIR"} \
            --out "$RUNNER_TEMP/plan"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.plan.outputs.artifact }}-plan
          path: ${{ runner.temp }}/plan
          retention-days: 3
          overwrite: true

  shard:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: 75
    outputs:
      verdict: ${{ steps.report.outputs.verdict }}
      regressions: ${{ steps.report.outputs.regressions }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ai-ecoverse/homescoop
          ref: ${{ needs.plan.outputs.homescoop-sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.plan.outputs.artifact }}-plan
          path: ${{ runner.temp }}/plan
      - name: Chromium for playwright-core 1.63.0
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pw" --no-fund --no-audit playwright-core@1.63.0
          npx --prefix "$RUNNER_TEMP/pw" playwright-core install --with-deps chromium || npx --prefix "$RUNNER_TEMP/pw" playwright-core install chromium
      - name: Cert specs and base sweep on the candidate kernel
        run: node scripts/browser-cert/compat.mjs shard --plan "$RUNNER_TEMP/plan/plan.json" --index ${{ matrix.shard }} --out "$RUNNER_TEMP/out"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.plan.outputs.artifact }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/out
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore
      - id: report
        if: ${{ !cancelled() && needs.plan.outputs.count == '1' }}
        env:
          FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression && 'true' || 'false' }}
          EXPECT_REGRESSIONS: ${{ inputs.expect-regressions }}
        run: |
          set -euo pipefail
          node scripts/browser-cert/compat.mjs report \
            --plan "$RUNNER_TEMP/plan/plan.json" --results "$RUNNER_TEMP/out" --out "$RUNNER_TEMP/compat" \
            --fail-on-regression "$FAIL_ON_REGRESSION" --expect-regressions "$EXPECT_REGRESSIONS"
      - if: ${{ !cancelled() && needs.plan.outputs.count == '1' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: ${{ runner.temp }}/compat
          retention-days: 30
          overwrite: true
          if-no-files-found: ignore

  report:
    needs: [plan, shard]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.count != '1' }}
    runs-on: ${{ needs.plan.outputs.light-runner }}
    timeout-minutes: 15
    outputs:
      verdict: ${{ steps.report.outputs.verdict }}
      regressions: ${{ steps.report.outputs.regressions }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ai-ecoverse/homescoop
          ref: ${{ needs.plan.outputs.homescoop-sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ needs.plan.outputs.artifact }}-*
          path: ${{ runner.temp }}/results
      - id: report
        env:
          FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression && 'true' || 'false' }}
          EXPECT_REGRESSIONS: ${{ inputs.expect-regressions }}
        run: |
          set -euo pipefail
          node scripts/browser-cert/compat.mjs report \
            --plan "$RUNNER_TEMP/results/${{ needs.plan.outputs.artifact }}-plan/plan.json" \
            --results "$RUNNER_TEMP/results" --out "$RUNNER_TEMP/compat" \
            --fail-on-regression "$FAIL_ON_REGRESSION" --expect-regressions "$EXPECT_REGRESSIONS"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: ${{ runner.temp }}/compat
          retention-days: 30
          overwrite: true
          if-no-files-found: ignore
