name: kernel-compat

on:
  workflow_call:
    inputs:
      kernel:
        description: 'Candidate kernel: an npm spec (@ai-ecoverse/slicc-kernel@1.85.1, or a bare version) or the name of a kernel .tgz artifact uploaded earlier in the calling run'
        type: string
        required: true
      set:
        description: 'base | ci-certified | catalog | all | recipe or npm names (name[@version]), comma-separated'
        type: string
        default: 'base,ci-certified'
      homescoop-ref:
        description: 'homescoop ref whose cert specs and scripts run'
        type: string
        default: 'main'
      bios-ref:
        description: 'slicc-bios ref whose lockfiles give the base set, the catalog and the reference kernel'
        type: string
        default: 'main'
      runner:
        description: 'runs-on label for the shards and the base sweep (empty: vars.CERT_RUNNER, else ubuntu-latest)'
        type: string
        default: ''
      fail-on-regression:
        description: 'Fail the report job when a package or sweep case passes on the reference kernel and fails on the candidate'
        type: boolean
        default: true
    outputs:
      artifact:
        description: 'Artifact holding compat.json, summary.md and the logs'
        value: ${{ jobs.report.outputs.artifact }}
      verdict:
        description: 'pass, regression or error'
        value: ${{ jobs.report.outputs.verdict }}
      regressions:
        description: 'Number of regressions'
        value: ${{ jobs.report.outputs.regressions }}
  workflow_dispatch:
    inputs:
      kernel:
        description: 'Candidate kernel: an npm spec (@ai-ecoverse/slicc-kernel@1.85.1, or a bare version)'
        type: string
        required: true
      set:
        description: 'base | ci-certified | catalog | all | recipe or npm names (name[@version]), comma-separated'
        type: string
        default: 'base,ci-certified'
      homescoop-ref:
        description: 'homescoop ref whose cert specs and scripts run'
        type: string
        default: 'main'
      bios-ref:
        description: 'slicc-bios ref whose lockfiles give the base set, the catalog and the reference kernel'
        type: string
        default: 'main'
      runner:
        description: 'runs-on label for the shards and the base sweep (empty: vars.CERT_RUNNER, else ubuntu-latest)'
        type: string
        default: ''
      fail-on-regression:
        description: 'Fail the report job on a regression'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: kernel-compat-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.kernel }}-${{ inputs.set }}-${{ inputs.bios-ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      shards: ${{ steps.plan.outputs.shards }}
      sweep: ${{ steps.plan.outputs.sweep }}
      modes: ${{ steps.plan.outputs.modes }}
      homescoop-sha: ${{ steps.plan.outputs.homescoop-sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ai-ecoverse/homescoop
          ref: ${{ inputs.homescoop-ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - id: kind
        env:
          KERNEL: ${{ inputs.kernel }}
        run: |
          set -euo pipefail
          if [[ "$KERNEL" =~ ^(@|[0-9]) ]]; then echo "kind=npm" >> "$GITHUB_OUTPUT"; else echo "kind=artifact" >> "$GITHUB_OUTPUT"; fi
      - if: steps.kind.outputs.kind == 'artifact'
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.kernel }}
          path: ${{ runner.temp }}/kernel-artifact
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KERNEL: ${{ inputs.kernel }}
          SET: ${{ inputs.set || 'base,ci-certified' }}
          BIOS_REF: ${{ inputs.bios-ref || 'main' }}
          HOMESCOOP_REF: ${{ inputs.homescoop-ref }}
          KERNEL_DIR: ${{ steps.kind.outputs.kind == 'artifact' && format('{0}/kernel-artifact', runner.temp) || '' }}
        run: |
          set -euo pipefail
          node scripts/browser-cert/compat.mjs plan \
            --kernel "$KERNEL" --set "$SET" --bios-ref "$BIOS_REF" --homescoop-ref "$HOMESCOOP_REF" \
            ${KERNEL_DIR:+--kernel-dir "$KERNEL_DIR"} \
            --out "$RUNNER_TEMP/plan"
      - uses: actions/upload-artifact@v7
        with:
          name: kernel-compat-${{ steps.plan.outputs.tag }}-plan
          path: ${{ runner.temp }}/plan
          retention-days: 3
          overwrite: true

  shard:
    needs: plan
    if: needs.plan.outputs.shards != '[]'
    runs-on: ${{ inputs.runner || vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ai-ecoverse/homescoop
          ref: ${{ needs.plan.outputs.homescoop-sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: kernel-compat-${{ needs.plan.outputs.tag }}-plan
          path: ${{ runner.temp }}/plan
      - name: Chromium for playwright-core 1.63.0
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pw" --no-fund --no-audit playwright-core@1.63.0
          npx --prefix "$RUNNER_TEMP/pw" playwright-core install --with-deps chromium || npx --prefix "$RUNNER_TEMP/pw" playwright-core install chromium
      - name: Cert specs on the candidate kernel
        run: node scripts/browser-cert/compat.mjs shard --plan "$RUNNER_TEMP/plan/plan.json" --index ${{ matrix.shard }} --out "$RUNNER_TEMP/out"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-compat-${{ needs.plan.outputs.tag }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/out
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore

  base-sweep:
    needs: plan
    if: needs.plan.outputs.sweep == 'true'
    runs-on: ${{ inputs.runner || vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        users: ${{ fromJson(needs.plan.outputs.modes) }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ai-ecoverse/homescoop
          ref: ${{ needs.plan.outputs.homescoop-sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: kernel-compat-${{ needs.plan.outputs.tag }}-plan
          path: ${{ runner.temp }}/plan
      - name: Chromium for playwright-core 1.63.0
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pw" --no-fund --no-audit playwright-core@1.63.0
          npx --prefix "$RUNNER_TEMP/pw" playwright-core install --with-deps chromium || npx --prefix "$RUNNER_TEMP/pw" playwright-core install chromium
      - name: Base-set sweep (users ${{ matrix.users }}, root and cone)
        run: node scripts/browser-cert/compat.mjs sweep --plan "$RUNNER_TEMP/plan/plan.json" --mode ${{ matrix.users }} --out "$RUNNER_TEMP/out"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-compat-${{ needs.plan.outputs.tag }}-sweep-${{ matrix.users }}
          path: ${{ runner.temp }}/out
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore

  report:
    needs: [plan, shard, base-sweep]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact: kernel-compat-${{ needs.plan.outputs.tag }}
      verdict: ${{ steps.report.outputs.verdict }}
      regressions: ${{ steps.report.outputs.regressions }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ai-ecoverse/homescoop
          ref: ${{ needs.plan.outputs.homescoop-sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          pattern: kernel-compat-${{ needs.plan.outputs.tag }}-*
          path: ${{ runner.temp }}/results
      - id: report
        env:
          FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression && 'true' || 'false' }}
        run: |
          set -euo pipefail
          node scripts/browser-cert/compat.mjs report \
            --plan "$RUNNER_TEMP/results/kernel-compat-${{ needs.plan.outputs.tag }}-plan/plan.json" \
            --results "$RUNNER_TEMP/results" --out "$RUNNER_TEMP/compat" \
            --fail-on-regression "$FAIL_ON_REGRESSION"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-compat-${{ needs.plan.outputs.tag }}
          path: ${{ runner.temp }}/compat
          retention-days: 30
          overwrite: true
          if-no-files-found: ignore
