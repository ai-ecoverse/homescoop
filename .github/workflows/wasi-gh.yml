# wasi-gh is retired from the ladder (published only after certification),
# so this workflow builds and tests it: gh.wasm from gh's pinned source with
# the pinned Go and patches/ (built twice; the sha256 must match), then the
# host module's unit tests and the end-to-end suite on slicc-kernel's headless
# Node entry with a local HTTP server.
name: wasi-gh

on:
  push:
    paths:
      - packages/wasi-gh/**
      - .github/workflows/wasi-gh.yml
  pull_request:
    paths:
      - packages/wasi-gh/**
      - .github/workflows/wasi-gh.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: build gh.wasm from source
        run: HOMESCOOP_WORK="$RUNNER_TEMP/homescoop-work" bash packages/wasi-gh/build.sh
      - name: record sha256
        run: sha256sum packages/wasi-gh/package/bin/gh.wasm | tee "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: gh-wasm-${{ matrix.attempt }}
          path: |
            packages/wasi-gh/package/bin/gh.wasm
            packages/wasi-gh/package/LICENSE
            packages/wasi-gh/package/THIRD-PARTY-NOTICES.md
          if-no-files-found: error
          retention-days: 14
      - name: pack the npm tarball
        if: matrix.attempt == 1
        working-directory: packages/wasi-gh/package
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        if: matrix.attempt == 1
        with:
          name: wasi-gh-2.102.0-1
          path: ${{ runner.temp }}/ai-ecoverse-wasi-gh-2.102.0-1.tgz
          if-no-files-found: error
          retention-days: 14

  reproducible:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gh-wasm-*
      - name: both builds are byte-identical
        run: |
          sha256sum gh-wasm-*/bin/gh.wasm | tee "$GITHUB_STEP_SUMMARY"
          test "$(sha256sum gh-wasm-1/bin/gh.wasm | cut -d' ' -f1)" = "$(sha256sum gh-wasm-2/bin/gh.wasm | cut -d' ' -f1)"

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: gh-wasm-1
          path: packages/wasi-gh/package
      - name: host module unit tests
        working-directory: packages/wasi-gh
        run: node --test 'test/*.test.mjs'
      - name: install test dependencies
        working-directory: packages/wasi-gh/test
        run: npm ci --no-audit --no-fund
      - name: end-to-end tests
        working-directory: packages/wasi-gh/test
        run: node --test 'e2e/*.test.mjs'
