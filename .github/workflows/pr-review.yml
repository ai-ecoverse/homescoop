name: pr-review

# One Claude code review of a pull request. It stands in for the Codex round while Codex's review quota is
# exhausted (PM rule). Package PRs already get cert-review; use this on code PRs (scripts, workflows, tooling).
# Dispatch it once per PR:  gh workflow run pr-review.yml -f pr=<number>
# Each finding is an inline review comment, so a resolvable thread: fix or answer each one, resolve it,
# and queue once there are zero threads. P1 = fix before merge; P2 = file an issue (or fix) and resolve.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request to review (same repository, open)
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: pr-review-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    name: pr-review
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    env:
      PR: ${{ inputs.pr }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: The pull request and its head
        id: pr
        run: |
          set -euo pipefail
          IFS=$'\t' read -r head base repo state < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '[.head.sha, .base.sha, .head.repo.full_name, .state] | @tsv')
          [ "$repo" = "$GITHUB_REPOSITORY" ] || { echo "::error::#$PR comes from $repo; only same-repository pull requests are reviewed"; exit 1; }
          [ "$state" = open ] || { echo "::error::#$PR is $state"; exit 1; }
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Review
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ vars.CERT_AWS_REGION || 'us-west-2' }}
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.pr.outputs.head }}
          BASE: ${{ steps.pr.outputs.base }}
        with:
          use_bedrock: 'true'
          github_token: ${{ github.token }}
          claude_args: |
            --model ${{ vars.CERT_BEDROCK_MODEL || 'global.anthropic.claude-opus-5-5' }}
            --allowedTools "Read,Glob,Grep,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*)"
            --max-turns 120
          prompt: |
            Review pull request #${{ inputs.pr }} of ${{ github.repository }} as a careful senior reviewer. This is the PR's one code review; it replaces a Codex review round. The checkout is the PR head ${{ steps.pr.outputs.head }}; the base is ${{ steps.pr.outputs.base }}. Read the change with `gh pr view ${{ inputs.pr }}`, `gh pr diff ${{ inputs.pr }}` and `git diff ${{ steps.pr.outputs.base }}...${{ steps.pr.outputs.head }}`, and read the surrounding code and its callers with Read/Grep so you judge the change in context. Don't run the PR's code.

            Look for real problems only: bugs, wrong edge cases, races, broken error handling, security (injection, secrets in logs, token scope, trusting fork input, supply chain), data loss, and changes that break a common workflow or the publish path (ladder-*.yml, cert-review.yml, scripts/ladder-merge-resolve.mjs, assert-certified-publish.mjs, list-touched-packages.mjs, verify-published.mjs, check-cert-kernel.mjs, scripts/cert-review/*). Also flag a bug fix that comes without a committed behaviour test. Skip style, naming and taste.

            Rate each finding P1 (must be fixed before merge: a real bug, security, data loss, a broken workflow) or P2 (worth doing but not blocking). Report at most 10 findings, the most important first, and say nothing you aren't confident of.

            Post exactly one review. Write `.pr-review.json` with the Write tool, as {"commit_id": "${{ steps.pr.outputs.head }}", "event": "COMMENT", "body": "...", "comments": [{"path": "...", "line": N, "side": "RIGHT", "body": "**P1** ..."}]}, then run `gh api repos/${{ github.repository }}/pulls/${{ inputs.pr }}/reviews --method POST --input .pr-review.json`. Each comment is one finding: a P1 or P2 label, what is wrong, why, and a concrete fix. Anchor each to a line that is in the diff (a RIGHT-side line of a changed hunk); if the problem sits in unchanged code, anchor it to the nearest changed line in the same file, or to the PR's first changed line. Start the body with "pr-review (Claude, standing in for the Codex round) at ${{ steps.pr.outputs.head }}:", then the P1 and P2 counts. If there are no findings, post the review with "No findings." in the body and an empty comments list. If the POST fails because a line is outside the diff, move that comment to a line that is in the diff and post again.
