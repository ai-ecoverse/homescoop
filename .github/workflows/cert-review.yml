name: cert-review

on:
  workflow_run:
    workflows: [ladder-pr]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to certify
        required: true
        type: number
      head:
        description: 'An earlier head of that pull request to review instead of its current one, as a full sha (for replays)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: cert-review / plan
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request'
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      go: ${{ steps.plan.outputs.go }}
      number: ${{ steps.plan.outputs.number }}
      head: ${{ steps.plan.outputs.head }}
      ladder_run: ${{ steps.plan.outputs.ladder_run }}
      packages: ${{ steps.plan.outputs.packages }}
      base: ${{ steps.plan.outputs.base }}
      ladder_conclusion: ${{ steps.plan.outputs.ladder_conclusion }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/cert-review
          persist-credentials: false

      - name: The pull request, its ladder-pr run at the head, the packages it built, and the cert-review status
        id: plan
        uses: actions/github-script@v9
        env:
          NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number }}
          LADDER_RUN: ${{ github.event.workflow_run.id }}
          LADDER_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_SHA: ${{ inputs.head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { CONTEXT, planStatus } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/cert-review/status.mjs`);
            const { owner, repo } = context.repo;
            const env = process.env;
            const facts = { sha: env.RUN_HEAD_SHA || env.HEAD_SHA || null };
            const status = (state, description) =>
              github.rest.repos.createCommitStatus({ owner, repo, sha: facts.sha, state, context: CONTEXT, description, target_url: env.RUN_URL });
            const finish = async () => {
              const d = planStatus(facts);
              if (d.state) {
                await status(d.state, d.description);
                core.info(`${CONTEXT}=${d.state} on ${facts.sha}: ${d.description}`);
              } else core.notice(`no ${CONTEXT} status: ${d.description}`);
              core.setOutput('go', String(d.go));
              if (!d.go) return;
              const outputs = { number: facts.number, head: facts.sha, base: facts.base, ladder_run: facts.run, ladder_conclusion: facts.ladder, packages: JSON.stringify(facts.packages) };
              for (const [key, value] of Object.entries(outputs)) {
                core.info(`${key}=${value}`);
                core.setOutput(key, String(value));
              }
            };
            try {
              let pr;
              facts.number = Number(env.NUMBER) || 0;
              if (facts.number) {
                ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: facts.number }));
              } else if (env.RUN_HEAD_BRANCH && env.RUN_HEAD_OWNER) {
                const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', head: `${env.RUN_HEAD_OWNER}:${env.RUN_HEAD_BRANCH}`, per_page: 100 });
                pr = open.find((p) => p.head.sha === env.RUN_HEAD_SHA) ?? open[0];
                facts.number = pr?.number ?? 0;
              }
              if (!pr) return await finish();
              facts.fork = pr.head.repo?.full_name !== `${owner}/${repo}`;
              facts.base = pr.base.sha;
              const head = env.HEAD_SHA || pr.head.sha;
              facts.head = head;
              const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: head });
              const builtFrom =
                commit.author?.login === 'github-actions[bot]' &&
                commit.parents.length === 1 &&
                commit.commit.message.startsWith('chore: refresh recipe sha256 and package version')
                  ? commit.parents[0].sha
                  : null;
              const accepted = [head, builtFrom].filter(Boolean);
              if (env.RUN_HEAD_SHA && !accepted.includes(env.RUN_HEAD_SHA)) {
                facts.moved = true;
                return await finish();
              }
              facts.sha = head;
              const usable = (r) => r?.status === 'completed' && r.conclusion !== 'action_required';
              let run;
              if (env.LADDER_RUN) {
                ({ data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: Number(env.LADDER_RUN) }));
                if (run.run_attempt > Number(env.LADDER_ATTEMPT || run.run_attempt) || run.status !== 'completed') {
                  facts.superseded = true;
                  return await finish();
                }
                await status('pending', 'cert-review plan started');
                core.setOutput('pending_on', facts.sha);
                if (!usable(run)) {
                  facts.ladder = run.conclusion;
                  return await finish();
                }
              } else {
                await status('pending', 'cert-review plan started');
                core.setOutput('pending_on', facts.sha);
                for (let minute = 0; minute < 120 && !usable(run); minute++) {
                  for (const sha of accepted) {
                    const [found] = (
                      await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'ladder-pr.yml', head_sha: sha, event: 'pull_request', per_page: 1 })
                    ).data.workflow_runs;
                    if (usable(found)) {
                      run = found;
                      break;
                    }
                  }
                  if (usable(run)) break;
                  core.info(`ladder-pr on ${accepted.join(' or ')}: not completed yet`);
                  await new Promise((resolve) => setTimeout(resolve, 60000));
                }
                if (!usable(run)) return await finish();
              }
              if (!accepted.includes(run.head_sha)) {
                facts.moved = true;
                return await finish();
              }
              if (builtFrom && run.head_sha === builtFrom) core.info(`${head} is ladder-pr's recipe-sha commit on ${builtFrom}; run ${run.id} built it`);
              facts.run = run.id;
              facts.ladder = run.conclusion;
              const pattern = new RegExp(`^host-(.+)-pr${facts.number}$`);
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { owner, repo, run_id: run.id, per_page: 100 });
              facts.packages = artifacts.filter((a) => !a.expired && pattern.test(a.name)).map((a) => a.name.match(pattern)[1]);
              return await finish();
            } catch (err) {
              facts.error = err.message;
              return await finish();
            }

      - name: A failure status when the plan stopped after its pending one
        if: (failure() || cancelled()) && steps.plan.outputs.pending_on != ''
        uses: actions/github-script@v9
        env:
          HEAD: ${{ steps.plan.outputs.pending_on }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { failIfOurs } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/cert-review/status.mjs`);
            const { owner, repo } = context.repo;
            const r = await failIfOurs({ github, owner, repo, sha: process.env.HEAD, runUrl: process.env.RUN_URL, description: 'not certified: the cert-review plan did not finish' });
            core.info(r.why);

  review:
    name: cert-review / review
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ${{ vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 240
    concurrency:
      group: cert-review-${{ needs.plan.outputs.number }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    env:
      PR_NUMBER: ${{ needs.plan.outputs.number }}
      HEAD: ${{ needs.plan.outputs.head }}
      LADDER_RUN: ${{ needs.plan.outputs.ladder_run }}
      PACKAGES: ${{ needs.plan.outputs.packages }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .cert-review-tools
          sparse-checkout: |
            scripts/cert-review
            scripts/browser-cert
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: gh, cert-run, and the ladder-pr tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64 | arm64) arch=arm64 ;;
            *) echo "::error::no gh release for $(uname -m)"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/cert-review"
          if ! command -v gh > /dev/null; then
            v=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/cli/cli/releases/latest | jq -r '.tag_name | ltrimstr("v")')
            (cd "$RUNNER_TEMP/bin" \
              && curl -fsSL -O "https://github.com/cli/cli/releases/download/v$v/gh_${v}_linux_$arch.tar.gz" \
                -O "https://github.com/cli/cli/releases/download/v$v/gh_${v}_checksums.txt" \
              && sha256sum -c "gh_${v}_checksums.txt" --ignore-missing \
              && tar -xzf "gh_${v}_linux_$arch.tar.gz" --strip-components=2 "gh_${v}_linux_$arch/bin/gh")
          fi
          printf '#!/bin/sh\nexec env -u AWS_BEARER_TOKEN_BEDROCK -u GH_TOKEN -u GITHUB_TOKEN "$@"\n' > "$RUNNER_TEMP/bin/cert-run"
          chmod +x "$RUNNER_TEMP/bin/cert-run"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          for pkg in $(jq -r '.[]' <<< "$PACKAGES"); do
            name="host-$pkg-pr$PR_NUMBER"
            gh run download "$LADDER_RUN" -n "$name" -D "$RUNNER_TEMP/artifacts/$name"
          done
          ls -R "$RUNNER_TEMP/artifacts"

      - name: Cert harnesses (no secrets in this step)
        run: |
          for pkg in $(jq -r '.[]' <<< "$PACKAGES"); do
            if [ "$(jq -r '.blocked // false' "packages/$pkg/cert/meta.json" 2> /dev/null)" = true ]; then
              echo "$pkg: no harness, cert/meta.json is blocked"
              continue
            fi
            echo "::group::harness for $pkg"
            bash .cert-review-tools/scripts/cert-review/harness.sh "$pkg" "$RUNNER_TEMP/harness/$pkg" \
              || echo "::warning::the harness for $pkg didn't install; the review goes on without it"
            echo "::endgroup::"
          done

      - name: Live pairs, npm latest and the pull request's tarball (no secrets in this step)
        run: |
          if [ -z "${DISPLAY:-}" ] && command -v Xvfb > /dev/null; then
            nohup Xvfb :99 -screen 0 1440x900x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
            export DISPLAY=:99
            echo "DISPLAY=:99" >> "$GITHUB_ENV"
          fi
          mkdir -p "$RUNNER_TEMP/live"
          port=9300
          echo '[]' > "$RUNNER_TEMP/live/live.json"
          for pkg in $(jq -r '.[]' <<< "$PACKAGES"); do
            harness=$(jq -r 'if .blocked then "blocked" else (.harness // "slicc-kernel") end' "packages/$pkg/cert/meta.json" 2> /dev/null || echo slicc-kernel)
            if [ "$harness" != slicc-kernel ]; then
              echo "$pkg: no live pair, its cert harness is $harness"
              continue
            fi
            peers=$(jq -r '[(.needsRepack // []), (.needsTarballScripts // [])] | add | length > 0' "packages/$pkg/cert/meta.json" 2> /dev/null || echo false)
            head_tgz="$RUNNER_TEMP/artifacts/host-$pkg-pr$PR_NUMBER/package.tgz"
            name=$(tar -xzf "$head_tgz" -O package/package.json | jq -r .name)
            base_tgz=
            if (cd "$RUNNER_TEMP/live" && npm pack "$name@latest" --json > "base-$pkg.json" 2> /dev/null); then
              base_tgz="$RUNNER_TEMP/live/$(jq -r '.[0].filename' "$RUNNER_TEMP/live/base-$pkg.json")"
            fi
            for side in base head; do
              tgz=$([ "$side" = base ] && echo "$base_tgz" || echo "$head_tgz")
              if [ -n "$tgz" ]; then
                HOMESCOOP_CERT_NODE_MODULES="$RUNNER_TEMP/harness/$pkg/node_modules" nohup node .cert-review-tools/scripts/browser-cert/run.mjs \
                  --package "$pkg" --cert "packages/$pkg/cert" --tarball "$tgz" --users enforce --live "$port" \
                  > "$RUNNER_TEMP/live/$pkg-$side.log" 2>&1 &
                jq --arg pkg "$pkg" --arg side "$side" --arg tgz "$tgz" --argjson port "$port" --argjson pid "$!" --argjson peers "$peers" \
                  '. + [{package: $pkg, side: $side, tarball: $tgz, url: "http://127.0.0.1:\($port)/", pid: $pid, peers_from_pr: $peers}]' \
                  "$RUNNER_TEMP/live/live.json" > "$RUNNER_TEMP/live/next.json" && mv "$RUNNER_TEMP/live/next.json" "$RUNNER_TEMP/live/live.json"
              fi
              port=$((port + 1))
            done
          done
          jq -r '.[] | "\(.url) \(.pid)"' "$RUNNER_TEMP/live/live.json" | while read -r url pid; do
            for _ in $(seq 120); do
              curl -fs "$url" > /dev/null && break
              kill -0 "$pid" 2> /dev/null || break
              sleep 2
            done
            curl -fsS "$url" || echo "::warning::$url didn't come up; see its log in $RUNNER_TEMP/live"
          done
          cat "$RUNNER_TEMP/live/live.json"

      - name: Review
        id: review
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ vars.CERT_AWS_REGION || 'us-west-2' }}
          GH_TOKEN: ${{ github.token }}
        with:
          use_bedrock: 'true'
          github_token: ${{ github.token }}
          allowed_bots: 'renovate[bot]'
          show_full_output: ${{ github.event_name == 'workflow_dispatch' }}
          claude_args: |
            --model ${{ vars.CERT_BEDROCK_MODEL || 'global.anthropic.claude-opus-5-5' }}
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch"
            --permission-mode bypassPermissions
            --max-turns 300
          prompt: |
            You certify homescoop packages. homescoop builds the `@ai-ecoverse/wasm-*`, `wasi-*`, `wasix-*` and `py-*` npm packages that seven (seven.sliccy.ai) runs in slicc-kernel in the browser. Decide, from evidence, whether each package pull request ${{ env.PR_NUMBER }} of ${{ github.repository }} builds is fit to publish. Run: ${{ env.RUN_URL }}.

            WHAT'S SET UP
            - The current directory is the pull request's head (${{ env.HEAD }}), with full history: `git diff ${{ needs.plan.outputs.base }}...HEAD` is the change (the pull request's base, which also holds for a merged pull request).
            - ladder-pr run `${{ env.LADDER_RUN }}` (concluded `${{ needs.plan.outputs.ladder_conclusion }}`; a run that isn't `success` is never certified, whatever you decide) built the packages ${{ env.PACKAGES }} on this head, ran their `smoke.c`, and ran their `packages/<package>/cert/*.mjs` specs in slicc-kernel on the kernel `cert/meta.json` names (`cert (<package>)` jobs; `host-build (<package>)` for the build). Read it with `gh run view ${{ env.LADDER_RUN }} --json jobs`, `gh run view ${{ env.LADDER_RUN }} --log-failed` and `gh run view --job <job> --log`. Don't repeat what it already ran unless you need to.
            - Each built tarball is `${{ runner.temp }}/artifacts/host-<package>-pr${{ env.PR_NUMBER }}/package.tgz`, with its sha256 next to it. These exact bytes are what gets published.
            - Each package has a cert harness in `${{ runner.temp }}/harness/<package>` (its kernel, `needs` and Chromium). Run its specs, on any kernel and users mode:
              `cert-run env HOMESCOOP_CERT_NODE_MODULES=${{ runner.temp }}/harness/<package>/node_modules node scripts/browser-cert/run.mjs --package <package> --tarball <package.tgz> [--kernel @ai-ecoverse/slicc-kernel@<version>] [--users enforce] [--soft] [--json <out.json>]`
              For a spec of your own, put it in a directory and pass `--cert <dir>`. See `docs/ci-cert.md` and `scripts/browser-cert/README.md` for the spec API.
            - **Live pairs, for a regression check right away.** For each package, two Chromes with windows run the harness under `--users enforce` on the `cert/meta.json` kernel, with the package installed and booted: one with npm `latest` (the baseline; missing for a new package) and one with this pull request's tarball. `${{ runner.temp }}/live/live.json` lists each one's `url`, and their logs are next to it. `GET <url>` describes it; `POST <url>ctx/<call>` with a JSON array of arguments calls the same `ctx` the specs get, for example `curl -s <url>ctx/run -d '[["sqlite3", "--version"], {"cwd": "/home"}]'`, `ctx/write`, `ctx/read`, `ctx/pty` and `ctx/addUser`. Run the same thing on both sides. Something that fails the same way on the baseline is pre-existing: it never blocks the certification. **Except** where an entry has `"peers_from_pr": true`: both sides then share peers rebuilt from this pull request (`needsRepack`, `needsTarballScripts`), so a shared failure may come from those peers. Check it against the published peers before you call it pre-existing.
            - **Run every command that executes package or pull-request code through `cert-run`**, including any command you take from `cert/meta.json` (`ci`, `needsTarballScripts`), a README or other docs in the pull request, which drops the Bedrock key and the GitHub token from its environment.
            - `npm view` and `npm pack` reach the registry, for the version on npm today (`latest`) and its tarball. `gh issue list -R <repo> --search …` finds existing issues (homescoop's and slicc-kernel's) to cite.

            WHAT TO CHECK, for each package (scale it to the change; a rebuild with no source change needs less than an upstream bump or a new patch)
            1. What changed: the recipe, patches, build flags, `package/` and `cert/`, against `origin/main` and against the tarball on npm (file list, modes, `package.json`, `slicc.commands`, engines, no install scripts). A spec deleted or an assertion weakened in `cert/` needs a reason.
            2. The cert specs pass on the kernel `cert/meta.json` names (ladder-pr's result), and on slicc-kernel's npm `latest`, under `--users enforce`. A failure only on one kernel: run the npm `latest` tarball of the package on that kernel too, to tell a regression from a known kernel issue.
            3. **Host certs:** if `cert/meta.json`'s `harness` is `host-node` and it has no `ci` commands, ladder-pr's green `cert (<package>)` ran nothing (#417). Run the package's host cert yourself (`cert-run node packages/<package>/cert/run.mjs --tarball <package.tgz>`, or what its `cert/` README says, also prefixed with `cert-run`), installing what it needs without root, as you would on a laptop, and say in the comment that this certification rests on your run.
            4. `cert/meta.json`'s `checklist` is covered by the specs, and every `*.patch` is exercised by a spec that maps to it.
            5. For an upstream bump: the source tarball's sha256 in `recipe.yaml` matches an independent download of `source.url`, and the upstream changelog has nothing that needs a closer look.
            6. Licences and notices are in the tarball.
            7. For security-sensitive packages (secrets, network, crypto, sudo, ssh, gpg, fnox, tailscale): what the change does to that surface.
            8. Poke around a bit and try the changed package yourself, the way someone in seven would: its commands on real input, the things the change touches, and whatever looks fragile. Write a spec of your own for it (`--cert <dir>`). The committed specs only check what someone already thought of.

            SEVERITY (Lars's policy: roll forward, don't reject over minor issues)
            FAIL only for: a security or secret exposure, data loss or corruption, a supply-chain problem (a hash that doesn't match, an unexplained non-reproducible build), a licence violation, a crash or boot failure, or a regression that breaks a common workflow or a base-set command without a workaround. Everything else (narrow regressions with a workaround, compatibility differences, cosmetic issues, test gaps, docs), and anything that also fails on the baseline, is a known issue: certify, and list it as known. **File each known issue that isn't filed yet** in this repository. Search first, open and closed, in both repositories: `gh issue list -R ai-ecoverse/homescoop --state all --search …` and `gh issue list -R ai-ecoverse/slicc-kernel --state all --search …`, and cite a match as `#<n>` or `ai-ecoverse/slicc-kernel#<n>` instead of filing again. Then `gh issue create`, with a repro, which side it fails on, and the behaviour-level integration test that would catch it; for a slicc-kernel problem, say so in the title. List it in `known` as `#<n>`.

            YOUR ANSWER, in `${{ runner.temp }}/cert-review/`
            - `verdict.json`: `{ "packages": [ { "package": "<recipe dir>", "verdict": "certified" | "fail", "known": ["<an issue, as owner/repo#n or #n, or new: a summary of at most ten words>"], "reason": "<one line, for a fail>" } ] }`, one entry per built package. Don't write shas or versions: a later step computes the `certified=` lines from the artifacts.
            - `comment.md`: per package, a short table (what changed, specs and kernels, checklist and patches, surface, licences, findings) and a few sentences on what a human should look at. Mention anything in this setup that got in your way.
            Don't edit, commit or push anything, and don't comment on the pull request yourself.

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cert-review-verdict-${{ needs.plan.outputs.number }}
          path: |
            ${{ runner.temp }}/cert-review/verdict.json
            ${{ runner.temp }}/cert-review/comment.md
          if-no-files-found: ignore

      - name: Evidence
        if: always()
        env:
          EXECUTION: ${{ steps.review.outputs.execution_file }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          cp "${EXECUTION:-$RUNNER_TEMP/claude-execution-output.json}" "$RUNNER_TEMP/evidence/claude-turns.json" 2>/dev/null || true
          cp -r "$RUNNER_TEMP/cert-review" "$RUNNER_TEMP/evidence/" 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cert-review-${{ needs.plan.outputs.number }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: ignore

  record:
    name: cert-review / record
    needs: [plan, review]
    if: always() && needs.plan.outputs.go == 'true' && needs.review.result != 'cancelled'
    runs-on: ${{ vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    concurrency:
      group: cert-review-record-${{ needs.plan.outputs.number }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    env:
      PR_NUMBER: ${{ needs.plan.outputs.number }}
      HEAD: ${{ needs.plan.outputs.head }}
      LADDER_RUN: ${{ needs.plan.outputs.ladder_run }}
      PACKAGES: ${{ needs.plan.outputs.packages }}
      LADDER_CONCLUSION: ${{ needs.plan.outputs.ladder_conclusion }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/cert-review
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: cert-review-verdict-${{ needs.plan.outputs.number }}
          path: ${{ runner.temp }}/cert-review

      - name: The ladder-pr tarballs, downloaded here, not taken from the review
        run: |
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64 | arm64) arch=arm64 ;;
            *) echo "::error::no gh release for $(uname -m)"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin"
          if ! command -v gh > /dev/null; then
            v=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/cli/cli/releases/latest | jq -r '.tag_name | ltrimstr("v")')
            (cd "$RUNNER_TEMP/bin" \
              && curl -fsSL -O "https://github.com/cli/cli/releases/download/v$v/gh_${v}_linux_$arch.tar.gz" \
                -O "https://github.com/cli/cli/releases/download/v$v/gh_${v}_checksums.txt" \
              && sha256sum -c "gh_${v}_checksums.txt" --ignore-missing \
              && tar -xzf "gh_${v}_linux_$arch.tar.gz" --strip-components=2 "gh_${v}_linux_$arch/bin/gh")
          fi
          export PATH="$RUNNER_TEMP/bin:$PATH"
          for pkg in $(jq -r '.[]' <<< "$PACKAGES"); do
            name="host-$pkg-pr$PR_NUMBER"
            gh run download "$LADDER_RUN" -n "$name" -D "$RUNNER_TEMP/artifacts/$name"
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Committed cert specs per package, at the reviewed head
        run: |
          echo '{}' > "$RUNNER_TEMP/specs.json"
          for pkg in $(jq -r '.[]' <<< "$PACKAGES"); do
            n=$(gh api "repos/$GH_REPO/contents/packages/$pkg/cert?ref=$HEAD" --jq '[.[] | select(.name | endswith(".mjs"))] | length' 2> /dev/null) || n=0
            [[ "$n" =~ ^[0-9]+$ ]] || n=0
            jq --arg p "$pkg" --argjson n "$n" '. + {($p): $n}' "$RUNNER_TEMP/specs.json" > "$RUNNER_TEMP/specs.next" && mv "$RUNNER_TEMP/specs.next" "$RUNNER_TEMP/specs.json"
          done
          cat "$RUNNER_TEMP/specs.json"

      - name: Build inputs, the root rule for every package (this job's tools, from ${{ github.sha }})
        run: |
          mkdir -p "$RUNNER_TEMP/cert-review"
          echo '{}' > "$RUNNER_TEMP/cert-review/repack-input.json"
          for pkg in $(jq -r '.[]' <<< "$PACKAGES"); do
            npm_name=$(tar -xzf "$RUNNER_TEMP/artifacts/host-$pkg-pr$PR_NUMBER/package.tgz" -O package/package.json 2> /dev/null | jq -r '.name // empty') || npm_name=
            node scripts/cert-review/repack-input.mjs --package "$pkg" --ref "$HEAD" --repo "$GH_REPO" ${npm_name:+--npm "$npm_name"} \
              > "$RUNNER_TEMP/repack-input-$pkg.json" || true
            cat "$RUNNER_TEMP/repack-input-$pkg.json"
            if jq -e . "$RUNNER_TEMP/repack-input-$pkg.json" > /dev/null 2>&1; then
              jq --arg p "$pkg" --slurpfile r "$RUNNER_TEMP/repack-input-$pkg.json" '. + {($p): $r[0]}' "$RUNNER_TEMP/cert-review/repack-input.json" > "$RUNNER_TEMP/cert-review/repack-input.next"
              mv "$RUNNER_TEMP/cert-review/repack-input.next" "$RUNNER_TEMP/cert-review/repack-input.json"
            fi
          done

      - name: Verdict from the artifacts (this job's tools, from ${{ github.sha }})
        id: verdict
        run: |
          mkdir -p "$RUNNER_TEMP/cert-review"
          if node scripts/gate.mjs cert-verdict -- node scripts/cert-review/verdict.mjs \
            --artifacts "$RUNNER_TEMP/artifacts" --pr "$PR_NUMBER" --review "$RUNNER_TEMP/cert-review" \
            --body "$RUNNER_TEMP/cert-review/body.md" --lines "$RUNNER_TEMP/cert-review/lines.txt" --run "$RUN_URL" \
            --ladder-run "$LADDER_RUN" --ladder-conclusion "$LADDER_CONCLUSION" --specs "$RUNNER_TEMP/specs.json" --repack-input "$RUNNER_TEMP/cert-review/repack-input.json"; then
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
          else
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"
          fi
          jq -n --arg pr "$PR_NUMBER" --arg head "$HEAD" --arg ladder "$LADDER_RUN" --arg run "$GITHUB_RUN_ID" \
            --rawfile lines "$RUNNER_TEMP/cert-review/lines.txt" \
            --slurpfile unspecified "$RUNNER_TEMP/cert-review/lines.txt.unspecified" \
            '{pr: ($pr | tonumber), head: $head, ladder_run: ($ladder | tonumber), cert_review_run: ($run | tonumber), no_cert_specs: $unspecified[0], lines: ($lines | rtrimstr("\n") | split("\n"))}' \
            > "$RUNNER_TEMP/cert-review/record.json"

      - uses: actions/upload-artifact@v7
        id: record
        with:
          name: cert-review-record-${{ needs.plan.outputs.number }}
          path: |
            ${{ runner.temp }}/cert-review/record.json
            ${{ runner.temp }}/cert-review/lines.txt
            ${{ runner.temp }}/cert-review/repack-input.json
          if-no-files-found: error

      - name: Comment and the cert-review status on the head
        env:
          CONCLUSION: ${{ steps.verdict.outputs.conclusion }}
          RECORD_ID: ${{ steps.record.outputs.artifact-id }}
        run: |
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/cert-review/body.md"
          gh api "repos/$GH_REPO/statuses/$HEAD" \
            -f state="$CONCLUSION" -f context=cert-review -f target_url="$RUN_URL/artifacts/$RECORD_ID" \
            -f description="$([ "$CONCLUSION" = success ] && echo "certified: run $GITHUB_RUN_ID, record artifact $RECORD_ID" || echo "not certified: run $GITHUB_RUN_ID, record artifact $RECORD_ID")" \
            --jq '"status \(.id) \(.state) on \(.url)"'

  unfinished:
    name: cert-review / unfinished
    needs: [plan, review, record]
    if: always() && needs.plan.outputs.go == 'true' && needs.record.result != 'success'
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/cert-review
          persist-credentials: false

      - name: A failure status, so no head is left pending
        uses: actions/github-script@v9
        env:
          HEAD: ${{ needs.plan.outputs.head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DESCRIPTION: 'not certified: cert-review did not finish (review ${{ needs.review.result }}, record ${{ needs.record.result }})'
        with:
          script: |
            const { failIfOurs } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/cert-review/status.mjs`);
            const { owner, repo } = context.repo;
            const r = await failIfOurs({ github, owner, repo, sha: process.env.HEAD, runUrl: process.env.RUN_URL, description: process.env.DESCRIPTION });
            core.info(r.why);
