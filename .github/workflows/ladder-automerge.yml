name: ladder-automerge

on:
  workflow_run:
    workflows: [cert-review]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR to consider. Merges only when dispatched on main; on any other branch this is a dry run.
        required: true
        type: string

concurrency:
  group: ladder-automerge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: read
    outputs:
      merge: ${{ steps.d.outputs.merge }}
      pr: ${{ steps.d.outputs.pr }}
      head: ${{ steps.d.outputs.head }}
      base: ${{ steps.d.outputs.base }}
      report: ${{ steps.d.outputs.report }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          REVIEW_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ -n "$PR" ]]; then
            node scripts/ladder-automerge.mjs decide --pr "$PR"
          else
            node scripts/ladder-automerge.mjs decide --cert-review-run "$REVIEW_RUN"
          fi

  report:
    needs: decide
    if: needs.decide.outputs.report != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.decide.outputs.pr }}
          REASON: ${{ needs.decide.outputs.report }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "dry run: would comment on #$PR: auto-merge skipped: $REASON"
            exit 0
          fi
          node scripts/ladder-automerge.mjs report --pr "$PR" --reason "$REASON"

  merge:
    needs: decide
    if: needs.decide.outputs.merge == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      sha: ${{ steps.m.outputs.sha }}
      before: ${{ steps.m.outputs.before }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - id: m
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.decide.outputs.pr }}
          HEAD_SHA: ${{ needs.decide.outputs.head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ladder-automerge.mjs merge --pr "$PR" --head "$HEAD_SHA" --run-url "$RUN_URL"

  would-merge:
    needs: decide
    if: needs.decide.outputs.merge == 'true' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.w.outputs.sha }}
      before: ${{ steps.w.outputs.before }}
      pr: ${{ steps.w.outputs.pr }}
    steps:
      - id: w
        env:
          PR: ${{ needs.decide.outputs.pr }}
          HEAD_SHA: ${{ needs.decide.outputs.head }}
          BASE: ${{ needs.decide.outputs.base }}
        run: |
          echo "dry run: would merge PR #$PR at $HEAD_SHA with a merge commit; ladder-merge resolves it dry against that head"
          {
            echo "sha=$HEAD_SHA"
            echo "before=$BASE"
            echo "pr=$PR"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: [merge, would-merge]
    if: always() && (needs.merge.outputs.sha != '' || needs.would-merge.outputs.sha != '')
    permissions:
      contents: read
      actions: write
      statuses: read
    uses: ./.github/workflows/ladder-merge.yml
    with:
      sha: ${{ needs.merge.outputs.sha || needs.would-merge.outputs.sha }}
      before: ${{ needs.merge.outputs.before || needs.would-merge.outputs.before }}
      pr: ${{ needs.would-merge.outputs.pr }}
