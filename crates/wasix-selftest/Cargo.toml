[package]
name = "wasix-selftest"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"
description = "Checks wasix-net, wasix-ureq and wasix-command inside slicc's kernel (test/kernel)"
publish = false

[dependencies]
wasix-net = { path = "../wasix-net", features = ["json"] }
wasix-command = { path = "../wasix-command" }
wasix-ureq = { path = "../wasix-ureq", features = ["json"] }
serde_json = "1"
